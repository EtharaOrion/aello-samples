determinism: |
  Seeded, and honest about which half reproduces. Exact equality is proven on the quality
  quantities and the state: the balanced accuracies on both private shards and hence every bar
  outcome and sibling gap, the optimizer step and sample counts, the exported parameter digest
  per configuration under the verifier-supplied init seed, and the validated, stamped,
  expiry-filtered carry-store digest with its expired-identifier set. T_c itself is stochastic
  and no exact-equality claim is made on it; it is stabilised by FIXED WORK rather than fixed
  time, and it leaves the graded value alone wherever the ramp saturates.

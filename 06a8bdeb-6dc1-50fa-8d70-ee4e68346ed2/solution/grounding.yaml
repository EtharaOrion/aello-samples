$schema: forge.grounding/v1
banner: Private derivation source. Every generated canonical artifact descends from this file.
slot_id: C2-S2
compilation_floor: 1.0
compilation_floor_basis: 'PRD section 5.6: every deterministically reducible judgment is compiled, and
  on this slot every one of them is. Composition order, digest closure, epoch binding, the pinned tool
  digests, the twelve argument bindings, the strata arithmetic and the published composite are all decidable
  from delivered bytes, so nothing here is left to a judge. The three trajectory rubrics sit outside this
  carrier and gate the composed score rather than forming part of it.'
deliverable:
  path: /submission/c2s2.json
  kind: json
  shape: an object carrying chain_manifest (one record per stage invocation, in execution order, with
    stage, stage_digest, epoch_id, bindings, consumed and produced), argument_bindings over the twelve
    declared interface arguments, stage_digests for all eight pinned tools, export_record, composite_declaration
    and stage_seconds
evaluation_target_vocabulary:
- argument_bindings
- chain_manifest
- episode_ledger
- run_record
- stage_tree
- submitted_artifact
corpus_layout:
  status: AUTHORED, NOT LANDED. Neither environment/stage/ nor environment/data/ nor tests/heldout/ exists
    in this bundle yet, so every path below is the path this slot's checks will read once the corpus lands.
    Every compiled body reports a named absence -- pinned_stage_digests_unrecorded, episode_ledger_unrecorded,
    argument_domains_unpublished, link_ablation_unrecorded -- rather than crashing or quietly passing
    when the file it needs is missing.
  stage_tools_root: environment/stage/
  stage_tools:
  - environment/stage/export
  - environment/stage/merge
  - environment/stage/render
  - environment/stage/rollout
  - environment/stage/score
  - environment/stage/seed
  - environment/stage/sft
  - environment/stage/update
  stage_tools_basis: Eight tools, read-only and pinned by per-file sha256, each documenting its complete
    interface under --help. The agent composes them and may not modify a byte; any addition, removal or
    change under this root is stage_tree_written at exactly 0.0.
  validator: environment/stage/validate_export
  validator_basis: Emits the admissibility reason codes in-environment. The grader's emittable set must
    equal this one exactly, so the agent debugs against the same failure vocabulary it is graded by.
  delivery_path_baseline: environment/starter/starter.py
  delivery_path_baseline_basis: Ships NOW, ahead of the corpus. It emits the six-section artifact instruction.md
    publishes, composing the eight stages in one admissible linearization with every argument bound correctly,
    so the delivery path and the whole checker set can be exercised before a single stage tool exists.
    It reads each stage_digest off environment/stage/<stage> when that tree is present and falls back
    to a placeholder when it is not, so the one check it cannot clear today -- invoked_stage_digest_equals_the_pinned_tool_digest,
    reason stage_tree_written -- is a named absence of the corpus and closes on its own the moment the
    eight tools land. It writes nothing into run_record.json, because that record holds the quantities
    an orchestration must not author.
  starter: environment/starter/train.sh
  starter_basis: Runs all eight stages to completion with four of the twelve interface arguments mis-bound,
    reaching roughly 0.19 end-state accuracy in roughly 2900 s. Every stage exits 0.
  training_episodes: environment/data/episodes/
  training_episodes_basis: Roughly 2400 agent-visible episodes over six of the eight backend API classes,
    re-instanced from the pinned BFCL v3 multi-turn release. A subset carries three unmarked wrong-ORDER
    copies of a call chain against one correct-order copy.
  backend_api_classes:
  - file_system
  - message
  - ticket
  - trading
  - travel
  - vehicle_control
  backend_api_classes_basis: The six shipped classes. Two further classes exist in the pinned release
    and are never shipped; they are the transfer stratum, and Phase 1 must confirm this roster against
    the vendored commit and fail closed on a mismatch rather than trusting this list.
  private_episode_tree: /private/episodes
  private_episode_tree_basis: Never mounted in the graded container. 1200 episodes over three strata;
    a process opening a path under it is boundary_violation at exactly 0.0.
  private_strata:
    main: 700
    transfer: 300
    haystack: 200
  run_record: tests/../run_record.json
  run_record_basis: Written by the harness and the verifier together, beside the tests tree. Every quantity
    the submission must not author lives here.
  emitted_manifest_name: chain_manifest.json
  emitted_manifest_basis: The orchestration writes it during the timed run and the graded artifact at
    /submission/c2s2.json carries it as its chain_manifest section.
run_record_schema:
  status: PUBLISHED IN instruction.md. The compiled checks read these keys, so the specification has to
    state them or the task is unsolvable by spec.
  harness_measured_elapsed_s: float. The timed window, measured host-side from first touch of the training
    data. Never taken from the submission.
  declared_partial_order: list of [before, after] pairs over the eight stage names. Seven edges; at least
    forty linearizations satisfy it.
  argument_domains: map from each of the twelve declared arguments to its published domain, with sizes
    2, 3, 2, 3, 3, 2, 3, 3, 3, 3, 2, 3.
  pinned_stage_digests: map from each of the eight stage names to its pinned per-file sha256.
  artifact_producers: map from each declared artifact name to the stages entitled to produce it. merged_weights
    carries two, merge and update, because the GRPO cycle re-produces it; every other artifact carries
    one.
  episode_ledger: map from stratum name (main, transfer, haystack) to {total, counted, end_state_equal,
    executed_to_completion, order_violations}, all integers.
  counting_basis: the string backend_end_state_digest_equality_with_order_dependent_pairs, naming what
    an episode had to do to be counted.
  per_call_accuracy: float. Recorded so the divergence from end-state accuracy is visible, and never a
    term in the numerator.
  link_ablation_accuracy: map from each of the twelve declared arguments to the reference chain's end-state
    accuracy with exactly that one argument re-bound wrong.
  mount_manifest: list of paths mounted in the graded container.
  opened_paths_under_private_tree: list; empty on a lawful run.
  private_episode_tree: string prefix naming the private tree, defaulting to /private/episodes.
  gold_end_state_digests: list of the gold digests, held verifier-side, used only to prove none of them
    appears in the submission.
  grader_reason_codes: list of the machine-readable reason codes the grader can emit for an inadmissible
    export.
  sandbox_replay: '{first_pass_digest, second_pass_digest, epoch_id, graded_epoch_id, episodes_replayed}.
    The graded export''s emitted chains replayed twice against a freshly seeded epoch; the two digests
    must be equal over all 1200 episodes.'
items:
- id: chain_manifest_records_every_stage_invocation
  dimension: deliverable
  weight: 5
  knockout: true
  evaluation_target: submitted_artifact
  mode: compiled
  outcome_class: EFFECT
  criterion: The orchestration emits a chain manifest describing every invocation of the eight pinned
    stage tools, alongside the bindings, the digests and the declared composite.
  judgment: '/submission/c2s2.json parses and carries all six sections: chain_manifest, argument_bindings,
    stage_digests, export_record, composite_declaration and stage_seconds, and chain_manifest is a non-empty
    list of invocation records. A missing section is manifest_malformed at exactly 0.0. Every stage exits
    0 on a mis-bound input, so the manifest is the only record of what was composed; an orchestration
    that ran and did not describe itself is not a slow chain, it is a chain nobody can close.'
- id: every_invocation_names_consumed_and_produced_digests
  dimension: deliverable
  weight: 5
  knockout: true
  evaluation_target: chain_manifest
  mode: compiled
  outcome_class: INVARIANT
  criterion: Each stage invocation records the digest of every artifact it consumed and every artifact
    it produced.
  judgment: every chain_manifest record carries stage, stage_digest, epoch_id, bindings, consumed and
    produced; bindings is the map of declared interface arguments that invocation was called with, and
    consumed and produced are lists of {artifact, sha256} whose digests are 64 lowercase hex characters.
    Only the seed invocation may consume nothing and every invocation produces something. A record that
    lists what it produced and not what it ate cannot be closed against its producer, and closure over
    those digests is the gate.
- id: consumed_digest_resolves_to_an_earlier_producing_stage
  dimension: integrity
  weight: 5
  knockout: true
  evaluation_target: chain_manifest
  mode: compiled
  outcome_class: ORDERING
  criterion: Every consumed artifact digest closes against the most recent digest emitted under that artifact
    name by a stage declared to produce it.
  judgment: for each consumed {artifact, sha256} that artifact name is one run_record.artifact_producers
    declares, an EARLIER invocation by a stage that map names as its producer emitted it, and the digest
    consumed is the most recent digest produced under that name rather than a superseded one. Otherwise
    chain_closure_broken at exactly 0.0. The most-recent rule is what catches the pinned score stage run
    against a previous iteration's rollout file, which the stage accepts and exits 0 on; the GRPO cycle
    legitimately re-produces merged_weights at update and feeds it back to rollout, so closure is per
    artifact name and not per acyclic predecessor. The relation is recomputed from the digests themselves
    and never from what the manifest narrates about its own correctness.
- id: realized_sequence_linearizes_the_declared_partial_order
  dimension: integrity
  weight: 5
  knockout: true
  evaluation_target: chain_manifest
  mode: compiled
  outcome_class: ORDERING
  criterion: The order the eight stages actually ran in is an admissible linearization of the partial
    order instruction.md declares.
  judgment: every edge of run_record.declared_partial_order -- render before sft, sft before merge, merge
    before rollout, seed before rollout, rollout before score, score before update, update before export
    -- holds over the realized invocation sequence. At least forty distinct linearizations satisfy the
    partial order and every one of them runs all eight tools to a clean exit, so a zero exit status is
    evidence about nothing and the order has to be read off the manifest.
- id: one_seed_call_pins_the_epoch_for_the_whole_run
  dimension: integrity
  weight: 5
  knockout: true
  evaluation_target: chain_manifest
  mode: compiled
  outcome_class: ABSENCE
  criterion: The sandbox epoch is pinned once, ahead of everything, and never rebased mid-chain.
  judgment: 'exactly one invocation of the seed stage appears in chain_manifest and it precedes every
    rollout and every score invocation. A second seed call placed anywhere before score silently rebases
    the world state: the stage exits 0, emits no warning, and every reward from that point is computed
    against a state no rollout ever observed, uniformly depressed and entirely plausible.'
- id: score_epoch_equals_the_rollout_and_seed_epoch
  dimension: integrity
  weight: 5
  knockout: true
  evaluation_target: chain_manifest
  mode: compiled
  outcome_class: ORDERING
  criterion: Every scored record is bound to the epoch of the rollout it scores and of the seed that produced
    that world state.
  judgment: each score invocation's epoch_id equals the epoch_id of the rollout invocation whose produced
    artifact it consumed, and equals the epoch_id of the single seed invocation. A mismatch is epoch_unbound
    at exactly 0.0. The score stage accepts a rollout carrying a superseded epoch_id and exits 0 on it,
    so the binding is checkable only across records and never from any one stage's own exit.
- id: twelve_interface_arguments_bound_inside_published_domains
  dimension: deliverable
  weight: 5
  knockout: true
  evaluation_target: argument_bindings
  mode: compiled
  outcome_class: VALUE
  criterion: All twelve declared interface arguments are bound, each to a value from the domain instruction.md
    publishes for it.
  judgment: argument_bindings names all twelve declared arguments and binds each to a member of run_record.argument_domains,
    whose published domain sizes are 2, 3, 2, 3, 3, 2, 3, 3, 3, 3, 2 and 3 -- 1.05e5 combinations. An
    unbound or out-of-domain argument is manifest_malformed. Getting eleven of the twelve right buys nothing,
    because each single mis-binding alone sinks the run below T1.
- id: mask_convention_postshift_because_sft_shifts_labels_itself
  dimension: process
  weight: 3
  knockout: false
  evaluation_target: argument_bindings
  mode: compiled
  outcome_class: VALUE
  criterion: The loss mask is handed to the sft stage under the convention that stage actually applies.
  judgment: argument_bindings['--mask-convention'] is postshift. The sft stage shifts labels internally,
    so a pre-shift mask lands one position off, raises no error, and silently trains on the user turns
    and the tool-result turns as if they were assistant output. The loss curve stays healthy the whole
    way; the fault is visible only in end-state accuracy on episodes the agent never sees.
- id: generation_prompt_pinned_to_one_value_at_render_and_rollout
  dimension: process
  weight: 3
  knockout: false
  evaluation_target: argument_bindings
  mode: compiled
  outcome_class: INVARIANT
  criterion: The generation-prompt flag holds one value across the render link and the rollout link rather
    than being left to each stage's default.
  judgment: the value bound for --generation-prompt is a single explicit member of its domain and is not
    auto, and the render and rollout invocations in chain_manifest both record that same value. auto at
    render against on at rollout makes every training prompt differ from every inference prompt by one
    template token of the shipped Qwen2.5-1.5B-Instruct tool-call template; both stages exit 0 and the
    divergence never appears in a log.
- id: pad_side_agrees_between_rollout_and_update
  dimension: process
  weight: 3
  knockout: false
  evaluation_target: argument_bindings
  mode: compiled
  outcome_class: INVARIANT
  criterion: Reference logprobs are consumed at the padding side the rollout stage emitted them on.
  judgment: the pad side bound for the update stage equals the pad side the rollout invocation records
    for the sequences it produced. Left-padded rollout logprobs consumed by an update stage assuming right
    padding put the KL term over shifted positions; no error is raised, the loss curve looks ordinary,
    and end-state accuracy lands below the gate.
- id: export_form_merged_carries_the_render_spec_digest
  dimension: deliverable
  weight: 5
  knockout: true
  evaluation_target: submitted_artifact
  mode: compiled
  outcome_class: VALUE
  criterion: The export is a merged model and it carries the digest of the render spec the chain was trained
    under.
  judgment: export_record.export_form is merged and export_record.render_spec_digest equals a sha256 the
    render invocation recorded as produced. An adapter export is export_form_rejected at exactly 0.0;
    a merged export carrying some other render-spec digest means the grader's renderer and the exported
    model disagree about the tool-call template, which no stage in the chain is positioned to notice.
- id: invoked_stage_digest_equals_the_pinned_tool_digest
  dimension: integrity
  weight: 5
  knockout: true
  evaluation_target: stage_tree
  mode: compiled
  outcome_class: ABSENCE
  criterion: The eight stage tools are composed, never rewritten, wrapped or shimmed.
  judgment: 'stage_digests names all eight pinned tools -- export, merge, render, rollout, score, seed,
    sft, update -- with digests equal to run_record.pinned_stage_digests, no name is added or missing,
    and every chain_manifest record''s stage_digest equals the pinned digest of the stage it names. A
    wrapper, a patched copy or a re-implemented sandbox is stage_tree_written at exactly 0.0: composition
    order is the lever, and the interface is the adversary rather than a suggestion.'
- id: each_single_link_misbinding_alone_falls_below_t1
  dimension: process
  weight: 3
  knockout: false
  evaluation_target: run_record
  mode: compiled
  outcome_class: EFFECT
  criterion: No one of the twelve bound arguments is individually optional.
  judgment: run_record.link_ablation_accuracy carries one entry per declared argument, twelve in all,
    each the reference chain's end-state accuracy with exactly that one argument re-bound wrong and the
    other eleven left correct, and every one of the twelve is strictly below T1 = 0.34. An argument whose
    mis-binding leaves the run above T1 is decorative and has to leave the graded interface rather than
    be asserted, because a chain whose links do not all bind is not a composition problem.
- id: twelve_ablation_rewards_lie_inside_a_007_band
  dimension: process
  weight: 3
  knockout: false
  evaluation_target: run_record
  mode: compiled
  outcome_class: INVARIANT
  criterion: The scalar the refinement loop carries between attempts cannot say which link broke.
  judgment: max minus min over the twelve single-link ablation accuracies in run_record.link_ablation_accuracy
    is at most 0.07, and the grader publishes no per-link diagnosis, no per-stage timing breakdown and
    no stratum detail below the published floors. Fifty graded evaluations against roughly 4.2e6 realizable
    chain configurations is a search only if the feedback localizes; a band this narrow is the measurement
    that it does not, and it is what keeps the composition jointly binding instead of twelve independent
    one-dimensional searches.
- id: strata_counts_partition_the_1200_private_episodes
  dimension: integrity
  weight: 3
  knockout: false
  evaluation_target: episode_ledger
  mode: compiled
  outcome_class: VALUE
  criterion: The three private strata partition the graded split exactly, and the counts are summed rather
    than taken from a stated total.
  judgment: run_record.episode_ledger carries main, transfer and haystack with episode totals 700, 300
    and 200, those three totals sum to 1200, and each stratum's counted episodes lie between zero and
    its total. The denominator is recomputed by summing the strata and never read from any total the record
    also states beside them; a ledger whose strata do not partition the split makes accuracy a number
    about some other set of episodes.
- id: end_state_digest_equality_with_no_per_call_credit
  dimension: integrity
  weight: 5
  knockout: true
  evaluation_target: episode_ledger
  mode: compiled
  outcome_class: VALUE
  criterion: An episode counts only on exact backend end-state equality, and per-call accuracy is never
    a term in the numerator.
  judgment: every stratum's counted episodes are those whose emitted call chain executed to completion
    in the pinned sandbox without raising, whose backend end-state digest equals gold's exactly, and whose
    order-dependent call pairs appear in gold's relative order; run_record.per_call_accuracy is recorded
    separately and the summed count never uses it. Emitting every plausible call in the schema raises
    per-call recall and mutates backend state, so end-state equality collapses while the per-call number
    the agent can see stays high.
- id: haystack_and_transfer_floors_cap_quality_at_060
  dimension: process
  weight: 3
  knockout: false
  evaluation_target: episode_ledger
  mode: compiled
  outcome_class: VALUE
  criterion: Clearing the overall bar on the six shipped API classes does not lift the cap that the two
    never-shipped classes impose.
  judgment: stratum_ok is (acc_haystack >= T - 0.10) and (acc_transfer >= T - 0.16), both recomputed from
    the ledger counts at T = 0.42, and when it is false the quality fraction is capped at 0.60. A policy
    fitted to the six shipped classes clears the overall bar and collapses on transfer, whose two API
    classes and their function schemas are seen for the first time at grading; the haystack stratum pads
    the same schemas with forty or more near-name decoy functions.
- id: two_axis_composite_uses_the_published_weights_verbatim
  dimension: process
  weight: 3
  knockout: false
  evaluation_target: submitted_artifact
  mode: compiled
  outcome_class: INVARIANT
  criterion: The composite over the two axes is the one instruction.md publishes verbatim; the weighting
    is not the agent's to choose.
  judgment: composite_declaration carries quality_weight 0.55 and speed_weight 0.45, the two sum to 1.0,
    and its declared form reproduces r_det = quality_fraction * (0.55 + 0.45 * speed_fraction) on the
    inputs it names. Both axes are published, so there is nothing to discover here and no credit for discovering
    it; a declaration that reweights quality against speed is graded as a wrong declaration and never
    as a different objective, because the verifier computes the published composite either way.
- id: timed_window_is_host_measured_not_self_reported
  dimension: process
  weight: 3
  knockout: false
  evaluation_target: run_record
  mode: compiled
  outcome_class: VALUE
  criterion: The seconds that price the speed axis are the harness's, and every stage invocation falls
    inside that one window.
  judgment: run_record.harness_measured_elapsed_s, timed host-side from first touch of the training data,
    is at most 3600 + 300 s of grace, and every chain_manifest invocation's start and end offsets lie
    inside [0, that measurement]. Above the grace the run is budget_exceeded at exactly 0.0. Nothing the
    submission reports about its own duration is read as the measurement; an invocation timestamped outside
    the window is work done before the timed run and claimed inside it.
- id: no_private_episode_path_opened_and_no_gold_digest_carried
  dimension: integrity
  weight: 5
  knockout: true
  evaluation_target: run_record
  mode: compiled
  outcome_class: ABSENCE
  criterion: The graded container never reaches the private episode tree, and the submission carries none
    of its digests.
  judgment: run_record.mount_manifest contains no path under the private episode tree, run_record.opened_paths_under_private_tree
    is empty, and no string anywhere in the submission matches a gold end-state digest the record names
    or a non-null value in tests/constants.json. The tree is not mounted in the graded container at all,
    so reaching it is boundary_violation at exactly 0.0 rather than a judged opinion about intent.
- id: grader_reason_codes_equal_the_validate_export_codes
  dimension: process
  weight: 3
  knockout: false
  evaluation_target: run_record
  mode: compiled
  outcome_class: INVARIANT
  criterion: The failure vocabulary the agent debugs against in-environment is the same list the grader
    can emit.
  judgment: the set in export_record.validate_export_reason_codes equals run_record.grader_reason_codes
    exactly, both are drawn from the published list, and every admissibility condition in it maps to a
    named exact 0.0 rather than to a reduced score. environment/stage/validate_export emits these codes
    in-environment; a grader whose vocabulary is wider or narrower means the agent tuned against a different
    failure surface than the one it is graded on.
- id: per_stage_seconds_declared_for_all_eight_stages
  dimension: process
  weight: 3
  knockout: false
  evaluation_target: submitted_artifact
  mode: compiled
  outcome_class: EFFECT
  criterion: The agent says where its wall went, stage by stage across all eight.
  judgment: stage_seconds names all eight pinned stages and each value parses as a non-negative number.
    The declaration is what is graded and not the harness's own measurement, so no field the harness writes
    can satisfy it. Recovering the roughly 900 s that separate the starter from the reference comes from
    batching the rollout stage and overlapping score with the next rollout rather than from any single
    faster kernel, and an agent that cannot say where its seconds went has not found that.
- id: replay_on_a_fresh_epoch_reproduces_the_end_state_digests
  dimension: integrity
  weight: 3
  knockout: false
  evaluation_target: run_record
  mode: compiled
  outcome_class: INVARIANT
  criterion: Replaying the graded export's emitted call chains twice against a freshly seeded epoch yields
    byte-identical backend end-state digests.
  judgment: run_record.sandbox_replay carries first_pass_digest and second_pass_digest over the graded
    export's emitted chains, the two are equal, the replay ran under an epoch_id different from the graded
    run's seed epoch, and it covered all 1200 episodes. The pinned backend API classes flap on dict iteration
    order, embedded timestamps, unseeded RNG and float formatting in the trading and travel classes unless
    PYTHONHASHSEED is pinned, the seed stage injects a frozen clock, every backend RNG derives from the
    epoch seed, and floats are serialized through repr at a pinned precision before hashing. A digest
    that flaps here means the VERIFIER is unstable and the bundle is BLOCK:INVALID_TASK; it is not the
    agent scoring zero, which is why this item does not knock out.
- id: chain_end_state_accuracy_ramp
  dimension: outcome
  weight: 10
  knockout: true
  evaluation_target: episode_ledger
  mode: compiled
  outcome_class: EFFECT
  criterion: Chain end-state accuracy over the 1200 private episodes clears the published bar through
    the ramp, and prices the quality axis of the published composite.
  judgment: 'acc is the summed counted episodes over the summed 1200, where an episode counts only on
    exact backend end-state equality with gold under the order-dependent pair constraint. quality_fraction
    = clamp((acc - 0.08) / (0.42 - 0.08), 0, 1), capped at 0.60 when either stratum floor fails, and the
    published composite multiplies it by (0.55 + 0.45 * speed_fraction). UNMEASURED AT PHASE 0: the ramp
    constants are null, so this check raises ConstantUnmeasured rather than returning a score, and the
    slot is not gradeable until the measurement wave writes them.'
measurement_tier: gpu
measurement_tier_basis: trains or runs an LLM backbone
constants:
  floor: null
  knee: null
  dichotomizing_threshold: null
  reward_gate_pass_threshold: null
  measured_values_reason: 'Null by seed/contract.yaml''s own convention: every quantity recorded null
    is measured at Phase 1 build time on the grading host and never authored at Phase 0. Authoring a floor,
    knee or ablation worth here would invent a measurement the bytes have not earned.'
gradeable:
  value: false
  basis: constants_unmeasured
  unmeasured_constants:
  - floor
  - knee
  - dichotomizing_threshold
  - reward_gate_pass_threshold
  distinction: 'a declared absence is not a measured zero: r_det is null here, not 0.0, because 0.0 asserts
    the agent failed and null asserts the slot is not yet measurable'
  becomes_gradeable_when: the Phase 2 measurement wave writes the four constants above on the grading
    host
knee_anchor: null
knee_anchor_source: null
knee_anchor_status: unsourced-not-attempted
knee_anchor_status_reason: No source was attempted for this slot's knee anchor at Phase 0.
reward_gate:
  applies_to: the three judged trajectory rubrics in tests/rubrics.json, as a conjunction
  ceiling: 0.5
  composition: r_final = r_det if every judged rubric passes, else min(r_det, ceiling)
  ceiling_basis: seed/contract.yaml records judged_reduction.parameter as 0.5 for this slot. The ceiling
    binds because 0.50 is strictly below 1.0 and strictly below the slot's dichotomizing threshold of
    0.55, so a rubric-failing run can never be reported as correct, and it sits above the highest required
    control (shipped_class_memorizer at 0.432) so the gate demotes an otherwise-good run rather than duplicating
    a control. An unavailable verdict counts as a failure.
reward_map:
  full_reward: 1.0
  shape: 'r_det: exactly 0.0 on any red line and on any knockout failure, including a broken chain closure,
    an unbound epoch, a written stage tree or a boundary violation. Otherwise the composite published
    verbatim in instruction.md over two axes: quality_fraction = clamp((acc - 0.08) / (0.42 - 0.08), 0,
    1), capped at 0.60 when either stratum floor fails; speed_fraction = clamp((ln 3600 - ln clamp(t,
    2700, 3600)) / (ln 3600 - ln 2700), 0, 1); r_det = quality_fraction * (0.55 + 0.45 * speed_fraction).'
  axes:
  - chain_end_state_accuracy over 1200 private executable episodes
  - harness-measured wall clock of the single timed invocation
  weights_are_published_not_chosen: 0.55 against 0.45 is stated verbatim in instruction.md. The agent
    restates it in composite_declaration and is graded on restating it correctly; the verifier computes
    the published composite either way.
  unmeasured: floor and knee are null at Phase 0, so r_det is not computable from these bytes yet and
    the slot is authored but not gradeable.
truth_narrative:
  opening: 'The environment ships eight pinned stage tools under environment/stage/ -- render, sft, merge,
    seed, rollout, score, update and export -- each read-only, each digest-locked, each documenting its
    complete interface under --help, together with a suboptimal starter orchestration script environment/starter/train.sh
    that runs all eight to completion and reaches roughly 0.19 end-state accuracy in roughly 2900 s. The
    deliverable is not a training script. It is an orchestration: the agent chooses the invocation order,
    binds twelve declared interface arguments across seven link boundaries, and pipes each stage''s artifacts
    into the next. Not one byte under environment/stage/ may change. The graded artifact is the exported
    model together with the chain manifest written to /submission/c2s2.json, which records per stage invocation
    the digest of every artifact it consumed and every artifact it produced, the arguments it was called
    with, and the sandbox epoch it ran under. Grading is a composite over two axes, published verbatim
    in instruction.md: chain end-state accuracy over 1200 private executable tool-call episodes, and harness-measured
    wall clock of the grader''s single timed invocation. Both axes are published, both weights are fixed,
    and neither is the agent''s to choose.'
  insight: 'Every stage exits 0 on a mis-bound input. That single fact is the task. A wrong binding does
    not raise, does not warn and does not leave a mark in a log; it produces an artifact that satisfies
    the next stage''s syntactic precondition and violates its semantic one, and the chain runs happily
    to an export that loads. So exit status carries no information, and neither does a clean run: roughly
    1.05e5 argument combinations times at least forty admissible stage orderings all execute to completion,
    and only a handful of them are semantically valid. The second fact is that the feedback cannot tell
    you which link broke. The twelve single-link mis-bindings each land below the lowest target on their
    own, and all twelve land inside a band 0.07 wide, so the one scalar the refinement loop carries between
    attempts is the same number whichever argument is wrong. Fifty graded evaluations against roughly
    4.2e6 realizable configurations is not a search when the signal does not localize. What replaces the
    missing signal is reading the interfaces: each stage''s --help states what it consumes, what convention
    it applies internally, and what it emits, and every intermediate artifact carries a manifest with
    a tokenizer fingerprint, a template id, a mask convention, an epoch id and a producer digest. Nothing
    here is undecidable from inside the container. The agent that wins reconciles adjacent stages'' declared
    conventions before running anything; the agent that loses runs the chain, sees a plausible number,
    and tries a different learning rate.'
  steps:
  - heading: Pin one sandbox epoch before anything else runs.
    paragraph: 'Call seed exactly once and hoist it ahead of render, ahead of the warm start and ahead
      of every rollout. The epoch is mutable cross-stage state: a second seed call placed anywhere before
      score rebases the world, the score stage accepts a rollout carrying the superseded epoch_id, exits
      0 and emits no warning, and every reward from that point is computed against a state no rollout
      ever observed. The rewards do not look broken -- they look uniformly a little low, which is exactly
      what an underfit policy looks like. Bind --epoch-binding to inherit and let every downstream record
      carry the one epoch the seed produced.'
  - heading: Reconcile the mask convention across the render-to-sft boundary before training a single
      step.
    paragraph: The sft stage shifts labels internally. Handing it a mask under the pre-shift convention,
      which is what the starter does, lands the mask one position off and silently trains on the user
      turns and the tool-result turns as though the model had written them. No error is raised and the
      loss curve is healthy the whole way down, because a model can fit user text perfectly well. Bind
      --mask-convention postshift. This is the single binding whose fault is invisible everywhere except
      in end-state accuracy on episodes the agent never sees.
  - heading: Pin the generation prompt to one explicit value at both ends of the render-to-rollout link.
    paragraph: 'The starter leaves --generation-prompt on auto at render and on at rollout, so every training
      prompt differs from every inference prompt by one token of the shipped Qwen2.5-1.5B-Instruct tool-call
      template. One token is enough: the model learns to emit its first call after a prefix it will never
      see again. auto is not a value, it is a deferral to whichever stage resolves it first, and the two
      stages resolve it differently. Choose a member of the domain and bind the same one at both invocations.'
  - heading: Align padding across the rollout-to-update link, because the KL term is computed positionally.
    paragraph: Rollout emits left-padded sequences. An update stage bound to right padding reads the reference
      logprobs at shifted positions, so the KL penalty is computed between a distribution and a shifted
      copy of itself. The loss curve looks ordinary, the policy drifts, and end-state accuracy lands below
      the gate. Capture reference logprobs pre-update at the pad side the rollout actually emitted, and
      bind --pad-side to that side rather than to the update stage's default.
  - heading: Merge before rollout, and carry the render spec digest into the export.
    paragraph: 'The vLLM engine has to load merged weights whose template and tool-token ids match the
      render spec, so merge belongs before rollout rather than after the loop. Set --embed-resize to tool-tokens
      consistently at render, merge and rollout, or the tool-call special tokens map to unrelated ids
      the moment the adapter is merged. Export with --export-form merged rather than adapter and carry
      the render spec digest into the export record: an adapter export is rejected outright, and a merged
      export carrying some other spec digest means the grader''s renderer and the exported model disagree
      about the template, which no stage in the chain is positioned to notice.'
  - heading: Down-weight the triplicated wrong-order chains before fitting anything to them.
    paragraph: 'For a subset of the shipped training episodes the split carries three unmarked copies
      of a call chain that is correct in content and wrong in ORDER, against one copy of the correct ordering.
      A frequency-weighted fit learns the wrong ordering and per-call accuracy does not move at all, because
      every call in the majority copies is individually right. The signature is a divergence between per-call
      accuracy and end-state accuracy: the first stays high, the second collapses, because the graded
      episodes execute in a stateful sandbox where order decides the end state. Detect the triplication
      by grouping episodes on their call multiset and bind --decoy-downweight rather than trusting the
      majority.'
  - heading: Build the GRPO advantage baseline inside each episode's rollout group.
    paragraph: Score is a pinned stage and its executable reward is not the agent's to redefine, so the
      only lever left on the update side is what the advantage is normalized against. Normalizing across
      the batch mixes episodes whose reward scales differ by construction -- a six-call travel episode
      and a two-call message episode are not comparable -- and the policy drifts toward whichever class
      happens to be easy, with no error raised. Bind --advantage-baseline to the rollout group, and choose
      the reference model dtype independently of the bf16 the rest of the chain runs in, then show the
      KL term stays finite at the value chosen.
  - heading: Write the chain manifest as the thing the verifier will recompute, not as a report.
    paragraph: 'Closure is recomputed from artifact digests, per artifact NAME: every consumed digest
      has to be the most recent one emitted under that name by a stage the published artifact-producer
      map entitles to emit it. Per name rather than per acyclic predecessor, because the GRPO cycle legitimately
      re-produces merged_weights at update and hands it back to rollout. The most-recent rule is what
      catches a score stage run against a previous iteration''s rollout file, which the stage accepts
      and exits 0 on. Record every invocation, in the order it ran, with its stage digest, its epoch id,
      the arguments it was called with, and both digest lists. Anything the orchestration did that the
      manifest does not describe -- a cached rollout, a hand-run merge, a second seed -- is either invisible
      to the grader or breaks closure, and neither outcome is one worth discovering at grading.'
  - heading: Buy the wall back from the loop structure, not from a faster kernel.
    paragraph: The starter finishes in roughly 2900 s for roughly 0.19 accuracy; the reference finishes
      in roughly 2000 s at roughly 0.46. The 900 s is not in any single stage. It comes from batching
      the rollout stage over episodes rather than walking them, and from overlapping score with the next
      rollout, both of which are ordering decisions the partial order permits and the starter does not
      take. The speed axis is a log ramp that saturates at 2700 s and reads zero at 3600 s, so seconds
      recovered below the knee are worth nothing and seconds spent above it are worth a great deal; measure
      the timed window before spending it on more GRPO iterations.
  traps:
  - Reading a clean run as a correct one. All eight stages exit 0 under every one of the 1.05e5 argument
    bindings and every one of the at least forty admissible orderings. A green pipeline is the null result
    here, not the signal.
  - Treating the scalar reward as a debugger. The twelve single-link ablations lie inside a band 0.07
    wide, so the number returned after a failed attempt is the same number whichever link is mis-bound.
    Trying twelve one-argument variants across the attempt budget spends the budget and learns nothing;
    reading twelve --help pages costs one attempt's worth of wall and resolves the bindings outright.
  - Optimizing per-call accuracy. There is no per-call partial credit anywhere in the grading. Emitting
    every plausible call in the schema raises recall and mutates backend state, so end-state equality
    collapses while the number the agent can compute for itself goes up. The two metrics diverge by at
    least 0.10 on the decoy-trusting route while staying within 0.03 of each other per call.
  - Memorizing the six shipped API classes. Two of the eight backend classes are absent from the environment
    entirely and their function schemas are seen for the first time at grading; the transfer stratum is
    300 of the 1200 graded episodes and its floor caps the quality fraction at 0.60 when it fails. A policy
    that clears the overall bar on the shipped classes and collapses on transfer is capped, not credited.
  - Hardcoding literals seen in the shipped instances. Every private episode's backend initial state is
    re-instanced under the identical class schemas, so file trees, ticket identifiers, portfolio holdings
    and vehicle states all differ from anything shipped. A memorized gold chain carries the wrong literals
    and fails end-state equality on every private episode while executing without raising.
  - Ignoring the haystack stratum's decoys. Two hundred graded episodes pad the tool schema with forty
    or more near-name functions -- send_message against send_message_to_user against message_send, and
    equivalents across all eight classes. The model picks the wrong one at its own call site, the call
    executes, and the end state is wrong.
  - Wrapping a stage instead of composing it. A shim, a patched copy or a re-implemented sandbox is rejected
    on the pinned per-file digests, and a re-implemented sandbox produces no epoch id at all, so the epoch
    binding fails as well. Composition order is the lever; the interface is the adversary rather than
    a suggestion.
  - Spending the timed window on more GRPO iterations than the log ramp pays for. Above 3600 s plus 300
    s of grace the run scores exactly 0.0 under budget_exceeded, which is not a slightly worse score.
    Below the 2700 s knee the speed term is already saturated and further seconds buy nothing.
  - Looking for the private episodes. The tree is not mounted in the graded container at all, so reaching
    for it is not forbidden-but-tempting, it is unreachable; a process opening a path under it produces
    a mutually exclusive wrong deliverable at exactly 0.0 rather than a judged opinion about intent.
truth_annex: 'Ordered path through instruction.md, with the checker identifier each step satisfies:


  1. `chain_end_state_accuracy_ramp` (compiled, weight 10, knockout) -- Chain end-state accuracy over
  the 1200 private episodes clears the published bar through the ramp, and prices the quality axis of
  the published composite.


  2. `chain_manifest_records_every_stage_invocation` (compiled, weight 5, knockout) -- The orchestration
  emits a chain manifest describing every invocation of the eight pinned stage tools, alongside the bindings,
  the digests and the declared composite.


  3. `consumed_digest_resolves_to_an_earlier_producing_stage` (compiled, weight 5, knockout) -- Every
  consumed artifact digest closes against the most recent digest emitted under that artifact name by a
  stage declared to produce it.


  4. `each_single_link_misbinding_alone_falls_below_t1` (compiled, weight 3) -- No one of the twelve bound
  arguments is individually optional.


  5. `end_state_digest_equality_with_no_per_call_credit` (compiled, weight 5, knockout) -- An episode
  counts only on exact backend end-state equality, and per-call accuracy is never a term in the numerator.


  6. `every_invocation_names_consumed_and_produced_digests` (compiled, weight 5, knockout) -- Each stage
  invocation records the digest of every artifact it consumed and every artifact it produced.


  7. `export_form_merged_carries_the_render_spec_digest` (compiled, weight 5, knockout) -- The export
  is a merged model and it carries the digest of the render spec the chain was trained under.


  8. `generation_prompt_pinned_to_one_value_at_render_and_rollout` (compiled, weight 3) -- The generation-prompt
  flag holds one value across the render link and the rollout link rather than being left to each stage''s
  default.


  9. `grader_reason_codes_equal_the_validate_export_codes` (compiled, weight 3) -- The failure vocabulary
  the agent debugs against in-environment is the same list the grader can emit.


  10. `haystack_and_transfer_floors_cap_quality_at_060` (compiled, weight 3) -- Clearing the overall bar
  on the six shipped API classes does not lift the cap that the two never-shipped classes impose.


  11. `invoked_stage_digest_equals_the_pinned_tool_digest` (compiled, weight 5, knockout) -- The eight
  stage tools are composed, never rewritten, wrapped or shimmed.


  12. `mask_convention_postshift_because_sft_shifts_labels_itself` (compiled, weight 3) -- The loss mask
  is handed to the sft stage under the convention that stage actually applies.


  13. `no_private_episode_path_opened_and_no_gold_digest_carried` (compiled, weight 5, knockout) -- The
  graded container never reaches the private episode tree, and the submission carries none of its digests.


  14. `one_seed_call_pins_the_epoch_for_the_whole_run` (compiled, weight 5, knockout) -- The sandbox epoch
  is pinned once, ahead of everything, and never rebased mid-chain.


  15. `pad_side_agrees_between_rollout_and_update` (compiled, weight 3) -- Reference logprobs are consumed
  at the padding side the rollout stage emitted them on.


  16. `per_stage_seconds_declared_for_all_eight_stages` (compiled, weight 3) -- The agent says where its
  wall went, stage by stage across all eight.


  17. `realized_sequence_linearizes_the_declared_partial_order` (compiled, weight 5, knockout) -- The
  order the eight stages actually ran in is an admissible linearization of the partial order instruction.md
  declares.


  18. `replay_on_a_fresh_epoch_reproduces_the_end_state_digests` (compiled, weight 3) -- Replaying the
  graded export''s emitted call chains twice against a freshly seeded epoch yields byte-identical backend
  end-state digests.


  19. `score_epoch_equals_the_rollout_and_seed_epoch` (compiled, weight 5, knockout) -- Every scored record
  is bound to the epoch of the rollout it scores and of the seed that produced that world state.


  20. `strata_counts_partition_the_1200_private_episodes` (compiled, weight 3) -- The three private strata
  partition the graded split exactly, and the counts are summed rather than taken from a stated total.


  21. `timed_window_is_host_measured_not_self_reported` (compiled, weight 3) -- The seconds that price
  the speed axis are the harness''s, and every stage invocation falls inside that one window.


  22. `twelve_ablation_rewards_lie_inside_a_007_band` (compiled, weight 3) -- The scalar the refinement
  loop carries between attempts cannot say which link broke.


  23. `twelve_interface_arguments_bound_inside_published_domains` (compiled, weight 5, knockout) -- All
  twelve declared interface arguments are bound, each to a value from the domain instruction.md publishes
  for it.


  24. `two_axis_composite_uses_the_published_weights_verbatim` (compiled, weight 3) -- The composite over
  the two axes is the one instruction.md publishes verbatim; the weighting is not the agent''s to choose.


  Rejected routes, each bound to a measured known-wrong control:


  - `empty_submission_noop` targets no-op: unchanged environment with no train.sh; recorded score 0.


  - `stale_epoch_control` targets stale: calling seed a second time before score, so the score stage consumes
  a rollout carrying a superseded epoch_id; every stage exits 0 and emits no warning, and the run trips
  epoch_unbound; recorded score 0.


  - `stale_score_input` targets stale: running the pinned score stage against a previous iteration''s
  rollout file, which the stage accepts and exits 0 on, breaking the chain_manifest digest closure; recorded
  score 0.


  - `literal_state_hardcode` targets stale: a policy emitting calls with literals observed in the shipped
  instances, which fails end-state equality on every re-instanced private backend state; recorded score
  0.


  - `emit_all_calls_control` targets list-all: emitting every plausible call in the schema to maximize
  per-call recall; the extra calls mutate backend state so end-state equality collapses; recorded score
  0.


  - `gold_leak_attack` targets verifier-aware attack: opening a path under the private episode tree to
  reach the gold end-state digests; recorded score 0.


  - `majority_order_decoy` targets decoy: trusting the triplicated unmarked call chains that are correct
  in content and wrong in ORDER, so a frequency-weighted fit learns the wrong ordering while per-call
  accuracy stays within 0.03; recorded score 0.265.


  - `starter_defaults_control` targets obvious-wrong: the shipped starter run unmodified with four of
  the twelve interface arguments mis-bound and every stage exiting 0; recorded score 0.288.


  - `exposed_constants` targets disclosure: holding T, the stratum floors, the complete reward map, the
  reason-code list, the declared stage partial order and the full domain of all twelve bound arguments,
  without training and without re-binding the starter; recorded score 0.288.


  - `pad_side_control` targets obvious-wrong: consuming left-padded rollout logprobs in an update stage
  that assumes right-padding, so the KL term is computed over shifted positions with no error raised;
  recorded score 0.353.


  - `haystack_decoy` targets distractor: the 200-episode stratum whose tool schema carries 40 or more
  near-name decoy functions, taken without any schema-disambiguation handling; recorded score 0.382.


  - `clean_exit_decoy` targets the twelve single-link argument mis-bindings applied one at a time to the
  reference; every stage exits 0 with clean logs and each lands in acc [0.200, 0.219], reported here at
  the band top; recorded score 0.409.


  - `mask_convention_control` targets obvious-wrong: passing the loss mask under the pre-shift convention
  into a stage that shifts labels internally, silently training on the user and tool-result turns; recorded
  score 0.412.


  - `shipped_class_memorizer` targets memorization: a policy fitted to the six shipped API classes, which
  collapses on the transfer stratum over the two never-shipped classes and trips the transfer floor cap;
  recorded score 0.432.

  '
provenance:
  corpus: 'REAL, named, vendored at pinned revisions at image build time. (1) Berkeley Function Calling
    Leaderboard v3 multi-turn (BFCL, Gorilla project, Patil et al., UC Berkeley), licence Apache-2.0,
    obtained from HF `datasets/gorilla-llm/Berkeley-Function-Calling-Leaderboard` at a pinned revision
    plus GitHub `ShishirPatil/gorilla` at a pinned commit for the executable stateful backend API classes
    (file system, message, ticket, trading, travel, vehicle-control and the remaining multi-turn classes).
    The agent-visible environment ships six of the eight backend API classes with their human-authored
    turn goals and gold call chains, mechanically re-instanced into roughly 2400 training episodes. (2)
    PRIVATE held-out split, never shipped, 1200 graded episodes over three strata: `transfer` (300 episodes
    over the two API classes absent from the environment entirely), `main` (700 episodes over the six
    shipped classes under unseen backend initial states and unseen goal compositions) and `haystack` (200
    episodes whose tool schema is padded with 40 or more near-name decoy functions drawn from the other
    classes). Re-instancing is selection, backend-state resampling and recomposition of upstream turn
    goals only, with no generative model anywhere in the pipeline, per aello-prd.md 5.3; every user-turn
    string is lifted verbatim from the pinned BFCL release and no new natural-language text is authored
    or generated. Every private episode is admitted only when its gold call chain replays to a stable
    end-state digest on its own re-instanced initial state at build time. (3) Base weights: Qwen2.5-1.5B-Instruct,
    Apache-2.0, vendored by sha256 digest, chosen because its shipped tool-call chat template is what
    makes the render-to-rollout template binding a real interface rather than a contrived one. (4) Pinned
    toolchain: vLLM, transformers and peft pinned by version and digest inside the image, and the eight
    `environment/stage/` tools pinned by per-file sha256. Apache-2.0 is permissive rather than share-alike,
    so redistribution of a modified derivative inside the bundle is clean; the pinned Gorilla backend
    classes are nonetheless audited file by file for third-party code under a different licence, and any
    unresolved licence is a fail-closed Phase 1 blocker rather than a footnote.'

operator_envelope:
  basis: The analytic latency and activation gates price a closed set of operators. The set is published
    in instruction.md so the agent can design inside it; an operator outside it has no cost term and would
    silently remove both gates.
  operators:
  - add
  - avgpool2d
  - batchnorm2d
  - clip
  - concat
  - conv2d
  - depthwise_conv2d
  - dequantize
  - gemm
  - globalavgpool2d
  - hardswish
  - mul
  - quantize
  - relu
  - reshape
  - sigmoid
  - transpose

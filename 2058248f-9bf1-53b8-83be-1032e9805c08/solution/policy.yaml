$schema: forge.policy/v1
banner: GENERATED SECTION. DO NOT HAND-EDIT.
slot_id: A5-02
network_agent: allowlist
network_verifier: denied
network_verifier_basis: task.toml [verifier].network_mode is bound explicitly to no-network, and
  [verifier.environment] is complete rather than a partial override, so the verifier inherits
  neither the build allowlist nor a GPU. The asymmetry is load-bearing on this slot: solving-phase
  egress is open, so a teacher can be downloaded, and grading-phase egress is denied, so the
  weights that score must ship inside the submission and be counted against the 4 MiB ceiling.
gpu_verifier: 0
oracle_env: AELLO_ORACLE
determinism: The training budget is denominated in accounted FLOPs rather than wall-clock seconds,
  so the step count is fixed by construction and the exported weights reproduce bit for bit.
  Average precision is accumulated in float64 in pinned record order with ties broken by score
  descending then record index ascending, so no tie depends on sort stability. Two grading passes
  over the same frozen export must agree in every bit of both macro average precisions.
measured_constants: null at Phase 0. Nine of them, and they are three different kinds -- the two
  macro AP bands, the two composition thresholds, and the three analytic latency host constants.
  See solution/grounding.yaml constants.measured_values_reason.

$schema: forge.grounding/v1
banner: Private derivation source. Every generated canonical artifact descends from this file.
slot_id: C1-S1
compilation_floor: 1.0
compilation_floor_basis: 'PRD section 5.6: every deterministically reducible judgment is compiled, and
  every item below is. The judged tier that stood here transcribed eighteen contract checker obligations
  verbatim and compiled four of them, so fourteen assertions rode as prose that nothing executed. Each
  item now names a fact about a cutoff, a publication-date channel, two forward horizons or one checkpoint,
  and each one has a body that reads it.'
deliverable:
  path: /submission/c1s1.json
  kind: json
  shape: an object carrying era_calendar (the cutoff, the corpus's own measured last publication day,
    the blind band between them and the recency-window start), schedule (the ordered phases with their
    era weights, planned tokens, oldest-era floor share and the anneal flag), token_ledger (served tokens
    total and per phase, with each phase's oldest-era tokens), checkpoint_ledger (every emitted checkpoint
    with its harness stamp, the named joint crossing, the declared forward slope, setup_seconds and seconds_to_joint_bar)
    and tokenizer (entry count, the fertility slice start day, realised bytes-per-token and trained bytes
    total)
evaluation_target_vocabulary:
- horizon_report
- run_record
- shim_ledger
- submitted_artifact
items:
- id: submission_carries_calendar_schedule_ledger_and_crossing
  dimension: deliverable
  weight: 5
  knockout: true
  evaluation_target: submitted_artifact
  mode: compiled
  outcome_class: EFFECT
  criterion: The run writes down its temporal frame, its phase schedule, its served-token accounting,
    its checkpoint ledger and its tokenizer currency at the declared submission path.
  judgment: '/submission/c1s1.json parses as an object and carries all five sections: era_calendar, schedule,
    token_ledger, checkpoint_ledger and tokenizer. A submission missing era_calendar scores 0.0 with reason
    submission_malformed; it is not a run that was slow, it is a run that never wrote down where the cutoff
    sat relative to the corpus it read, and every other check here is a statement about that relation.'
- id: crossing_checkpoint_clears_both_bars_in_the_same_row
  dimension: conjunctive_bar
  weight: 5
  knockout: true
  evaluation_target: horizon_report
  mode: compiled
  outcome_class: INVARIANT
  criterion: The checkpoint that stops the clock clears the far-horizon bits-per-byte bar and the forward-slope
    bar together, at one checkpoint.
  judgment: 'the row of the host-side horizon report whose checkpoint_id equals checkpoint_ledger.joint_crossing
    carries bpb_h3 at or below 1.12 AND bpb_h3 minus bpb_h1 at or below 0.06. Two checkpoints, one clearing
    each bar, are not a crossing and score 0.0 with reason bars-cleared-separately. The bar is conjunctive:
    a checkpoint that clears bits-per-byte while its slope is 0.09 is worth exactly what a checkpoint
    that clears neither is worth, and the run that emitted it has not started the reward ramp at all.'
- id: forward_slope_is_h3_minus_h1_not_a_within_shard_trend
  dimension: forward_slope
  weight: 5
  knockout: true
  evaluation_target: horizon_report
  mode: compiled
  outcome_class: VALUE
  criterion: The graded slope is the degradation from the near forward horizon to the far one, taken on
    two era-labelled shards under one checkpoint and one tokenizer.
  judgment: 'the slope recomputed as bpb_h3 minus bpb_h1 from the same horizon-report row equals checkpoint_ledger.declared_forward_slope
    to 1e-06 absolute, and both terms are read from shards drawn at different offsets past the cutoff,
    H1 from [C, C+90d) and H3 from [C+270d, C+630d). A slope taken inside one shard, or between a forward
    shard and the in-era validation split, measures sampling noise or in-era fit and is not a forward
    degradation; it scores 0.0 with reason slope-not-across-horizons. Era-labelled evaluation is the whole
    instrument here: without two dated shards the second bar cannot be computed at all.'
- id: declared_crossing_is_the_earliest_row_that_clears_both
  dimension: conjunctive_bar
  weight: 5
  knockout: true
  evaluation_target: submitted_artifact
  mode: compiled
  outcome_class: ORDERING
  criterion: The crossing the submission names is the earliest jointly clearing checkpoint by harness
    stamp, not a later one and not an earlier one that clears a single bar.
  judgment: 'across every row of the horizon report, the earliest harness stamp whose row clears both
    bars belongs to the checkpoint named by checkpoint_ledger.joint_crossing. Naming a later checkpoint
    concedes seconds the run had already earned; naming an earlier one that cleared only bpb shortens
    the clock against a crossing that never happened. Both score 0.0 with reason crossing-not-earliest.
    Because the clock stops at the earliest JOINT crossing, emission cadence is a lever rather than housekeeping:
    a checkpoint that is never emitted cannot be the row that stops it.'
- id: setup_seconds_charged_from_first_corpus_read
  dimension: clock_boundary
  weight: 5
  knockout: true
  evaluation_target: run_record
  mode: compiled
  outcome_class: INVARIANT
  criterion: The graded clock opens at the first read of the shipped corpus, so every second spent before
    the first optimizer step is charged to the run and declared.
  judgment: run_record.first_corpus_read_stamp_s is present and strictly precedes run_record.first_optimizer_step_stamp_s,
    and checkpoint_ledger.setup_seconds equals their difference to 1e-06. The docmeta scan, the era index
    materialisation and any vocabulary rebuild all sit inside that interval, so a run that reports its
    training seconds and calls them the graded time is short by its entire setup; reason setup-outside-the-clock.
    Nothing here is read from a duration the agent timed itself.
- id: recency_quota_share_read_from_served_tokens_not_declared_weights
  dimension: recency_quota
  weight: 5
  knockout: true
  evaluation_target: shim_ledger
  mode: compiled
  outcome_class: INVARIANT
  criterion: The recency share is the share of tokens the shim actually served out of the final 180 days
    before the cutoff, and it stays at or below 0.15.
  judgment: 'shim_ledger.recency_window_served_tokens divided by shim_ledger.served_tokens_total is at
    or below 0.15, the numerator counting only tokens attributed through docmeta.bin to documents whose
    pub_epoch_day lies in [C-180d, C). The share is computed from the harness-owned counters and never
    from schedule.era_weights, because the corpus era-volume profile is not uniform and is characterised
    nowhere in the environment: a weight vector that reads as 0.12 recency can serve 0.19 of the stream.
    Exceeding the ceiling scores 0.0 with reason recency-quota-exceeded.'
- id: no_served_token_dated_at_or_after_the_cutoff
  dimension: cutoff_absence
  weight: 5
  knockout: true
  evaluation_target: shim_ledger
  mode: compiled
  outcome_class: ABSENCE
  criterion: Nothing the model trained on was published on or after the cutoff at which the forward horizons
    begin.
  judgment: shim_ledger.post_cutoff_served_tokens is exactly 0 and shim_ledger.max_served_pub_epoch_day
    is strictly less than era_calendar.cutoff_epoch_day, asserted over the whole served stream rather
    than over a sample. The three horizons ARE the future this task asks the run to extrapolate into,
    so a single token dated past the cutoff answers a different question with the answer in hand; reason
    future-token-consumed.
- id: corpus_end_measured_from_docmeta_not_assumed_equal_to_the_cutoff
  dimension: temporal_frame
  weight: 5
  knockout: true
  evaluation_target: submitted_artifact
  mode: compiled
  outcome_class: VALUE
  criterion: The last publication day of the shipped corpus is a measured number, and the recency window
    is anchored at the cutoff rather than at the corpus's own end.
  judgment: era_calendar.corpus_last_pub_epoch_day equals run_record.corpus_max_pub_epoch_day, the maximum
    pub_epoch_day the harness observed over docmeta.bin; era_calendar.recency_window_start_epoch_day equals
    cutoff_epoch_day minus 180; and era_calendar.blind_band_days equals cutoff_epoch_day minus corpus_last_pub_epoch_day
    and is not negative. The corpus does not necessarily end where the evaluation begins, and a plan that
    assumes it does sizes its anneal against an endpoint the data never reaches. Reason boundary-assumed.
- id: recency_anneal_executes_last_by_median_publication_day
  dimension: phase_ordering
  weight: 5
  knockout: true
  evaluation_target: run_record
  mode: compiled
  outcome_class: ORDERING
  criterion: The phase order the schedule declares is the order the shim served, broad-era first and the
    recency anneal last.
  judgment: the phase names in run_record.phase_median_pub_epoch_day, listed in execution order, equal
    schedule.phases element for element; the medians are non-decreasing; and the phase flagged is_recency_anneal
    is the last element of both lists and the only one so flagged. The same era weights executed anneal-first
    lose most of the forward gain, so a declared anneal-last that the shim recorded running first is an
    order divergence rather than a recipe; reason schedule-order-diverged.
- id: every_phase_keeps_a_floor_of_the_oldest_era
  dimension: era_mixture
  weight: 4
  knockout: false
  evaluation_target: submitted_artifact
  mode: compiled
  outcome_class: INVARIANT
  criterion: No phase, the recency anneal included, empties the oldest era out of the mixture.
  judgment: 'schedule.oldest_era_floor_share is strictly positive and, for every phase in token_ledger.per_phase,
    oldest_era_served_tokens is strictly greater than zero and its share of that phase''s served tokens
    is at least that floor. A schedule that drops the oldest era from its final phase buys near-horizon
    fit and pays for it in bpb(H3) minus bpb(H1), which is the bounded term: the run then clears one bar,
    misses the other, and scores what clearing nothing scores. Reason oldest-era-floor-breached.'
- id: declared_era_weights_reconcile_with_served_token_shares
  dimension: era_mixture
  weight: 4
  knockout: false
  evaluation_target: shim_ledger
  mode: compiled
  outcome_class: DIVERGENCE
  criterion: Each era's declared weight matches the share of tokens the shim actually served from that
    era.
  judgment: 'for every era named in schedule.phases, the planned-token-weighted declared share, the sum
    over phases of planned_tokens times that era''s weight divided by total planned tokens, differs from
    shim_ledger.served_tokens_by_era''s share of the same era by at most 0.02 absolute, and each phase''s
    weights sum to 1.0 within 1e-06. The era-volume profile of the shipped corpus is non-uniform and never
    characterised, so a mixture that is balanced in weights is not balanced in tokens: a temperature that
    reads as a gentle forward tilt can realise as a flat stream, and a flat declaration can realise recency-heavy.
    Reason mixture-not-realised.'
- id: token_budget_priced_at_the_newest_readable_era_fertility
  dimension: tokenizer_currency
  weight: 4
  knockout: false
  evaluation_target: submitted_artifact
  mode: compiled
  outcome_class: VALUE
  criterion: The fixed token budget is converted into trained bytes at the bytes-per-token the submitted
    tokenizer realises on the newest text the run is allowed to read.
  judgment: tokenizer.fertility_slice_start_epoch_day equals era_calendar.corpus_last_pub_epoch_day minus
    180, so the fertility is measured on the newest readable era rather than on the earliest one or on
    the corpus average; tokenizer.realized_bytes_per_token is strictly positive; and token_ledger.served_tokens_total
    multiplied by it equals tokenizer.trained_bytes_total to 1e-06 relative. The cap is 4.0e8 TOKENS while
    the bar is per BYTE, so the exchange rate between them decides how much corpus the budget actually
    buys, and a vocabulary whose merges were fitted on older terminology spends the same budget on fewer
    forward-window bytes while raising no error anywhere. Reason fertility-not-measured-forward.
- id: every_trained_token_passed_through_the_attributing_shim
  dimension: token_attribution
  weight: 5
  knockout: true
  evaluation_target: run_record
  mode: compiled
  outcome_class: DIVERGENCE
  criterion: Optimizer steps times global batch tokens reconciles with the shim's served-token counter,
    and that counter stays inside the budget.
  judgment: 'the absolute difference between run_record.optimizer_steps times run_record.global_batch_tokens
    and shim_ledger.served_tokens_total is at most 0.005 of the shim counter, and served_tokens_total
    is greater than zero and at most 4.0e8. A byte the shim never served carries no pub_epoch_day, so
    it sits outside both the cutoff absence and the quota share: unaccounted tokens do not merely add
    compute, they void the two temporal guarantees the rest of this rubric asserts. Reason unaccounted-tokens,
    or token-budget-exceeded when the counter is over the cap.'
- id: docmeta_epoch_day_channel_unaltered_by_the_graded_run
  dimension: instrument_integrity
  weight: 5
  knockout: true
  evaluation_target: run_record
  mode: compiled
  outcome_class: ABSENCE
  criterion: The publication-date channel that attributes every served token is byte-identical before
    and after the graded run, and nothing under the grading tree is written.
  judgment: 'run_record.docmeta_sha256_before equals docmeta_sha256_after and both equal run_record.docmeta_sha256_pinned,
    and run_record.guarded_paths_touched is empty. docmeta.bin is an instrument rather than data: an edit
    to its pub_epoch_day channel re-labels every token''s era, and the cutoff absence and the recency
    quota then become assertions about a calendar the run authored for itself. Both facts are read from
    the record the run produced, never from a scan taken afterwards, which cannot separate a write made
    inside the graded region from one made before it. Reason grading-tree-written.'
- id: checkpoint_stamps_are_harness_assigned_not_submission_authored
  dimension: clock_integrity
  weight: 5
  knockout: true
  evaluation_target: run_record
  mode: compiled
  outcome_class: DIVERGENCE
  criterion: Every stamp in the checkpoint ledger is the stamp the harness assigned to that checkpoint,
    and the graded seconds are recomputed from those stamps.
  judgment: 'every checkpoint_ledger entry''s checkpoint_id appears in run_record.harness_checkpoint_stamps
    with an identical stamp_s, and checkpoint_ledger.seconds_to_joint_bar equals the harness stamp of
    the named crossing minus run_record.first_corpus_read_stamp_s to 1e-06. Seconds are the graded quantity,
    so they are recomputed rather than read: a checkpoint carrying a fabricated earlier stamp is the cheapest
    win available on this axis and it is the one this check exists for. Reason stamp-divergence.'
- id: further_horizon_never_clears_before_a_nearer_one
  dimension: drift_monotonicity
  weight: 4
  knockout: false
  evaluation_target: horizon_report
  mode: compiled
  outcome_class: ORDERING
  criterion: The earliest clearing stamp is non-decreasing as the shard sits further past the cutoff.
  judgment: the earliest harness stamps at which the checkpoint series first reaches the common target
    of 1.12 on H1, on H2 and on H3 satisfy t(H1) <= t(H2) <= t(H3), and a horizon never reached contributes
    no ordering rather than an infinite one. Under forward drift a shard 270 to 630 days past the cutoff
    is strictly harder than one inside the first 90, so a far horizon clearing first is evidence of a
    mis-stamped series or of an artifact fitted to one window, not of forward generalisation. Reason horizon-order-inverted.
- id: seconds_from_corpus_read_to_the_conjunctive_bar_ramp
  dimension: outcome
  weight: 10
  knockout: true
  evaluation_target: run_record
  mode: compiled
  outcome_class: VALUE
  criterion: Harness-measured seconds from the first corpus read to the earliest checkpoint that clears
    both bars at once, mapped through the published descending ramp.
  judgment: 't is the harness stamp of the earliest checkpoint whose horizon-report row carries bpb_h3
    at or below 1.12 and bpb_h3 minus bpb_h1 at or below 0.06, minus run_record.first_corpus_read_stamp_s.
    Lower t is better, so the ramp descends from floor to knee; a run whose series never clears both bars
    in one row has no t at all rather than a large one, and lands on the sub-gate band instead. UNMEASURED
    AT PHASE 0: floor, knee and the dichotomizing threshold are null, so this check raises ConstantUnmeasured
    before it reads a single submitted byte, and the slot reports gradeable=false rather than a score
    of zero.'
measurement_tier: gpu
measurement_tier_basis: trains or runs an LLM backbone
constants:
  floor: null
  knee: null
  dichotomizing_threshold: null
  reward_gate_pass_threshold: null
  measured_values_reason: 'Null by seed/contract.yaml''s own convention: every quantity recorded null
    is measured at Phase 1 build time on the grading host and never authored at Phase 0. Authoring a floor,
    knee or ablation worth here would invent a measurement the bytes have not earned.'
gradeable:
  value: false
  basis: constants_unmeasured
  unmeasured_constants:
  - floor
  - knee
  - dichotomizing_threshold
  - reward_gate_pass_threshold
  distinction: 'a declared absence is not a measured zero: r_det is null here, not 0.0, because 0.0 asserts
    the agent failed and null asserts the slot is not yet measurable'
  becomes_gradeable_when: the Phase 2 measurement wave writes the four constants above on the grading
    host
knee_anchor: null
knee_anchor_source: null
knee_anchor_status: unsourced-not-attempted
knee_anchor_status_reason: No source was attempted for this slot's knee anchor at Phase 0.
reward_gate:
  applies_to: the judged rubrics in tests/rubrics.json, as a conjunction
  ceiling: 0.05
  composition: r_final = r_det if every judged rubric passes, else min(r_det, ceiling)
reward_map:
  full_reward: 1.0
  shape: 'r_det: zero on any red line and on any knockout failure; otherwise S_outcome = clamp((metric
    - floor) / (knee - floor), 0, 1) through the published ramp.'
  unmeasured: floor and knee are null at Phase 0, so r_det is not computable from these bytes yet and
    the slot is authored but not gradeable.
truth_narrative:
  opening: 'minimize the harness-measured wall-clock seconds, from the first read of the shipped corpus
    to the harness timestamp of the earliest emitted checkpoint that simultaneously scores bits-per-byte
    at or below 1.12 on the far-horizon held-out shard H3 and a forward degradation slope bpb(H3) minus
    bpb(H1) at or below 0.06, for a from-scratch decoder-only language model trained on one H100 inside
    a hard budget of 4.0e8 consumed tokens, at most 1.2e8 parameters, a recency-quota share at or below
    0.15 of consumed tokens drawn from the final 180 days before the declared cutoff, no token attributed
    to a document dated at or after that cutoff, and a hard ceiling of 2700 wall-clock seconds. The starter
    is provided and improving it is the objective. The bar is a CONJUNCTION taken on ONE checkpoint: a
    checkpoint clearing bits-per-byte with a slope above 0.06 stops no clock, and two checkpoints clearing
    one bar each are not a crossing. The graded artifact is written to /submission/c1s1.json and carries
    five sections -- era_calendar, schedule, token_ledger, checkpoint_ledger and tokenizer -- none of
    which can raise a score: every number it declares is reconciled against the harness carrier that measures
    the same thing. Bits-per-byte reaches the checks only through the host-side horizon report, one row
    per emitted checkpoint under the submission''s own tokenizer over the frozen raw shard bytes, and
    wall-clock reaches them only through harness-assigned stamps. The cutoff, the three forward window
    offsets ([C, C+90d), [C+90d, C+270d), [C+270d, C+630d)), the quota ceiling, the slope bound and the
    sub-gate ramp are disclosed in instruction.md, so the graded quantity is never withheld and the difficulty
    rests entirely on the non-derivable gap between knowing the forward target and having a schedule that
    reaches it.'
  insight: 'The bar is conjunctive and the clock stops on a single checkpoint, so the only instant that
    counts is the first one at which ONE checkpoint clears bits-per-byte on the far horizon and the bpb(H3)
    minus bpb(H1) slope at the same time. That binds two goals that pull against each other: leaning the
    mixture forward is what brings bpb(H3) down, and it is also what steepens the slope, so a run that
    pushes recency until H3 clears usually arrives with a slope that does not, watches a sub-gate number
    rise, and reads that rise as progress when it is worth what zero is worth. The second fact is that
    every quantity in this task is a date. The corpus ships in strict chronological order with a pub_epoch_day
    channel nothing points at; the four graded shards sit 0 to 630 days past a cutoff the corpus itself
    stops 40 days short of; the quota is a share of the final 180 days before that cutoff; and the shipped
    vocabulary was fitted on the earliest era of all. None of it is announced. The starter is a clean,
    warning-free, uniformly shuffled IID pipeline, correct in every line and correct for a distribution
    that is not the graded one. The clock opens at the first corpus read, so the time spent discovering
    the calendar is charged to the run exactly as the training is.'
  steps:
  - heading: Read the calendar before reading the corpus.
    paragraph: 'Parse docmeta.bin''s pub_epoch_day channel and get three numbers before anything else:
      the declared cutoff C, the corpus''s own last publication day, and the gap between them. The gap
      is not zero -- the corpus stops 40 days short of C -- so a plan anchored on the corpus end sizes
      its anneal against an endpoint the data never reaches and carries a blind band immediately before
      the evaluation window. Every downstream quantity, the recency window [C-180, C), the quota denominator
      and the era weights, is anchored at C and not at the last shipped document.'
  - heading: Rebuild the vocabulary on recent text.
    paragraph: 'The shipped 65,536-entry vocabulary round-trips, raises nothing, and tokenizer_meta.json
      records the era its merges were fitted on as a plain fact. That era is the earliest one. The budget
      cap is on TOKENS while the bar is per BYTE, so the exchange rate between them decides how much corpus
      4.0e8 tokens actually buys: on forward-window terminology the shipped vocabulary realises roughly
      14 percent worse bytes-per-token, and the wall-clock axis is lost before any schedule tuning can
      matter. Rebuild on a recency-weighted sample and measure the realised fertility on the newest slice
      the run is allowed to read.'
  - heading: Weight the mixture by publication date, then check the weights against served tokens.
    paragraph: 'Sample with a weight that rises with pub_epoch_day under a tuned temperature. Temperature
      zero is a flat mixture fitted to the wrong distribution; a high temperature collapses onto the newest
      slice and the slope blows past 0.06. The era-volume profile of the corpus is non-uniform and is
      characterised nowhere, so a weight vector is a hypothesis about the served stream rather than a
      description of it: read the realised share off the shim''s counters and correct the weights until
      the two agree.'
  - heading: Order the phases broad-era first and recency-annealed last.
    paragraph: The same weights in reverse order lose most of the forward gain, so the ordering is part
      of the recipe rather than a detail of it. Declare the ordered phases in schedule.json and let the
      shim's per-phase median consumed publication day prove the run executed what the file declares;
      a declared anneal-last that ran first zeroes as an order divergence rather than scoring as a near
      miss.
  - heading: Size the anneal against the quota, not against a step count.
    paragraph: 'The ceiling is 0.15 of consumed tokens drawn from [C-180, C). Spend the whole allowance
      and not a token more: the reference lands at 0.148. An anneal sized in steps rather than in quota
      tokens either leaves forward signal unspent or trips recency-quota-exceeded, and the quota is measured
      on what the shim served, never on what the schedule declared.'
  - heading: Floor every phase with the oldest era.
    paragraph: A fixed floor of the oldest era in every phase, the anneal included, is what holds bpb(H3)
      minus bpb(H1) under 0.06 while the mixture leans forward. Drop it and H3 clears on its own while
      the slope does not, which is a checkpoint worth exactly what a checkpoint clearing nothing is worth.
      Twelve percent is enough in the reference.
  - heading: Emit often, and stop the clock on a joint crossing.
    paragraph: 'The graded second is the stamp of the earliest checkpoint that clears both bars at once,
      so emission cadence is a lever: a checkpoint that is never emitted cannot be the row that stops
      the clock, and a 60-second cadence costs a little throughput to save several hundred seconds of
      unobserved clearing. Then spend the rest on throughput -- fused RMSNorm and SwiGLU under torch.compile
      with dynamic shapes disabled, the FlashAttention SDPA backend, bf16 activations with fp32 master
      weights, document-boundary packing with block-diagonal masks, a batch ramp from 64 to 512 sequences,
      a vocabulary padded to a multiple of 128, tied embeddings, peak LR 3.0e-3 with 3 percent warmup
      and trapezoidal decay.'
  traps:
  - Agent trains the textbook IID recipe over the whole shipped corpus, reaches an excellent bits-per-byte
    on the in-era val split, reads that as evidence the recipe is sound, and never establishes that the
    graded shards sit forward of the corpus in time; bpb on H3 plateaus above 1.12 for the whole attempt
    budget while val.bin looks healthy the entire way.
  - Agent establishes the forward split, over-corrects onto the newest slice, trips the recency-quota
    red line and zeroes with recency-quota-exceeded, then backs off to a quota-respecting but flat mixture
    that clears neither the far-horizon target nor the slope bound.
  - Agent keeps the shipped vocabulary because it raises no error and its build era is recorded as a plain
    fact rather than a warning, so realized bytes-per-token on the forward windows is roughly 14 percent
    worse, the fixed token budget buys materially fewer trained bytes, and the wall-clock axis is lost
    before any schedule tuning can matter.
  - Agent derives the right era mixture but executes it anneal-first rather than anneal-last, or declares
    one order in schedule.json and runs another, and the run zeroes with schedule-order-diverged or lands
    on the sub-gate ramp with the right weights and the wrong sequence.
  - Agent clears bpb on H3 by fitting the near horizon hard, inflating the H3-minus-H1 slope past 0.06,
    and mistakes a rising sub-gate ramp value for progress because the instruction's continuous axis is
    read as a threshold.
  - Agent reaches for post-cutoff biomedical text or a pretrained biomedical checkpoint under the egress
    grant; CK-CONSUME records the token divergence and CK-INIT rejects the step-0 state, so the run zeroes
    with unaccounted-tokens or init-not-reproducible.
  - 'Transfer of the public nanoGPT speedrun recipe (modded-nanogpt and its leaderboard), a near-optimal
    public repository for GPT-2-scale training on FineWeb to a published cross-entropy target. This is
    the exact defect the ts-01 register records for CIFAR-10 at 94 percent. Mitigation: The boarded configuration
    is absent on every axis: the corpus is CC0/CC BY PMC OA rather than FineWeb, the target is bits-per-byte
    on shards drawn from three publication windows past a declared cutoff, the hardware is one H100 rather
    than eight, and T_min and T_max are anchored to our own measured reference on the grading host rather
    than to any published number. Decisively, every public speedrun is an IID recipe and the defeating
    structure here is the forward split, which no published speedrun addresses at all: applied verbatim
    the recipe is measured as control public-recipe-transfer at 0.061, below the 0.10 gate, before Phase
    0.5 binds.'
  - 'Download post-cutoff PMC articles, or any post-cutoff biomedical text, and train on the future the
    task asks the agent to extrapolate to. This is the archetype''s own cheat and the one that would hollow
    out the whole design. Mitigation: Closed in four layers. CK-CUTOFF (ABSENCE) attributes every consumed
    token to its source document''s pub_epoch_day through the harness-owned shim and zeroes on any token
    at or after the cutoff. CK-CONSUME (DIVERGENCE) reconciles optimizer steps times global batch tokens
    against the shim''s served-token counter within 0.5 percent, so bytes the shim never served show up
    as extra steps or a larger batch and zero with slug unaccounted-tokens. Egress runs the aello-prd.md
    section 5.1 default-deny allowlist limited to package indexes, with NCBI FTP, model hubs, source hosting
    and general web search excluded by name, declared as a bound byte in task.toml as a stated deviation
    from the Optimization-lane open-egress default. The judged rubric no_external_training_data corroborates
    and may only lower.'
  - 'Download a pretrained biomedical language model (BioGPT, PubMedBERT lineage) and distil or fine-tune
    it, since the lane''s default grants the solver internet egress. Mitigation: Closed constructively
    rather than by network policy: CK-INIT recomputes every step-0 tensor digest from init_spec.json,
    a declared seed plus a bound set of pure init ops, and rejects any weight not so derivable; CK-CONSUME
    caps and reconciles served tokens; CK-IMPORTS AST-scans model.py and the tokenizer build script against
    a {torch, math, safetensors, tokenizers} allowlist with no attribute path reaching os, sys, socket,
    subprocess, urllib, requests, ctypes or importlib. Note that the prior design''s private vocab-id
    permutation is deliberately retired here, because the agent must be able to rebuild a tokenizer from
    surface text for the temporal staleness lever to exist, so CK-INIT rather than the permutation carries
    this risk.'
  - 'Read or infer the held-out shards so the model is fitted to the graded bytes rather than to forward
    generalization. Mitigation: isolation.py proves the boundary before any grading runs and refuses to
    score at all when it is not in force (slug isolation-unproven, exactly 0.0); CK-DIGEST pins all four
    raw shards; CK-SIBLING zeroes on an H2 versus H2-sibling bits-per-byte gap above 0.04, and because
    the sibling is drawn from the same publication window and a disjoint PMCID partition it isolates shard-fitting
    from legitimate era-fitting rather than punishing both.'
  - 'The forward split is disclosed in instruction.md as fairness requires, so the starter-to-reference
    delta could compress into the single sentence ''train more on recent data'', violating the aello-prd.md
    section 5.19 solution-description-length floor. Mitigation: Measured, not asserted. The naive reading
    of that sentence is control recency-only at 0.029; the quota-respecting version of it is control decoy-majority
    at 0.021; the era-weighted version without phase ordering or an old-era floor is the two-sentence
    partial at 0.089; the full reference schedule under the shipped vocabulary is 0.093; assuming the
    corpus end equals the cutoff is 0.094. All sit below the 0.10 gate. The delta desk check writes the
    difference out as prose and counts seven load-bearing sentences, and the seven-way single-clue-selectivity
    ablation tops out at 0.079.'
truth_annex: 'Ordered path through instruction.md, with the checker identifier each step satisfies:


  1. `checkpoint_stamps_are_harness_assigned_not_submission_authored` (compiled, weight 5, knockout) --
  Every stamp in the checkpoint ledger is the stamp the harness assigned to that checkpoint, and the graded
  seconds are recomputed from those stamps.

  2. `corpus_end_measured_from_docmeta_not_assumed_equal_to_the_cutoff` (compiled, weight 5, knockout)
  -- The last publication day of the shipped corpus is a measured number, and the recency window is anchored
  at the cutoff rather than at the corpus''s own end.

  3. `crossing_checkpoint_clears_both_bars_in_the_same_row` (compiled, weight 5, knockout) -- The checkpoint
  that stops the clock clears the far-horizon bits-per-byte bar and the forward-slope bar together, at
  one checkpoint.

  4. `declared_crossing_is_the_earliest_row_that_clears_both` (compiled, weight 5, knockout) -- The crossing
  the submission names is the earliest jointly clearing checkpoint by harness stamp, not a later one and
  not an earlier one that clears a single bar.

  5. `declared_era_weights_reconcile_with_served_token_shares` (compiled, weight 4) -- Each era''s declared
  weight matches the share of tokens the shim actually served from that era.

  6. `docmeta_epoch_day_channel_unaltered_by_the_graded_run` (compiled, weight 5, knockout) -- The publication-date
  channel that attributes every served token is byte-identical before and after the graded run, and nothing
  under the grading tree is written.

  7. `every_phase_keeps_a_floor_of_the_oldest_era` (compiled, weight 4) -- No phase, the recency anneal
  included, empties the oldest era out of the mixture.

  8. `every_trained_token_passed_through_the_attributing_shim` (compiled, weight 5, knockout) -- Optimizer
  steps times global batch tokens reconciles with the shim''s served-token counter, and that counter stays
  inside the budget.

  9. `forward_slope_is_h3_minus_h1_not_a_within_shard_trend` (compiled, weight 5, knockout) -- The graded
  slope is the degradation from the near forward horizon to the far one, taken on two era-labelled shards
  under one checkpoint and one tokenizer.

  10. `further_horizon_never_clears_before_a_nearer_one` (compiled, weight 4) -- The earliest clearing
  stamp is non-decreasing as the shard sits further past the cutoff.

  11. `no_served_token_dated_at_or_after_the_cutoff` (compiled, weight 5, knockout) -- Nothing the model
  trained on was published on or after the cutoff at which the forward horizons begin.

  12. `recency_anneal_executes_last_by_median_publication_day` (compiled, weight 5, knockout) -- The phase
  order the schedule declares is the order the shim served, broad-era first and the recency anneal last.

  13. `recency_quota_share_read_from_served_tokens_not_declared_weights` (compiled, weight 5, knockout)
  -- The recency share is the share of tokens the shim actually served out of the final 180 days before
  the cutoff, and it stays at or below 0.15.

  14. `seconds_from_corpus_read_to_the_conjunctive_bar_ramp` (compiled, weight 10, knockout) -- Harness-measured
  seconds from the first corpus read to the earliest checkpoint that clears both bars at once, mapped
  through the published descending ramp.

  15. `setup_seconds_charged_from_first_corpus_read` (compiled, weight 5, knockout) -- The graded clock
  opens at the first read of the shipped corpus, so every second spent before the first optimizer step
  is charged to the run and declared.

  16. `submission_carries_calendar_schedule_ledger_and_crossing` (compiled, weight 5, knockout) -- The
  run writes down its temporal frame, its phase schedule, its served-token accounting, its checkpoint
  ledger and its tokenizer currency at the declared submission path.

  17. `token_budget_priced_at_the_newest_readable_era_fertility` (compiled, weight 4) -- The fixed token
  budget is converted into trained bytes at the bytes-per-token the submitted tokenizer realises on the
  newest text the run is allowed to read.

  Rejected routes, each bound to the control that measures it wrong:


  - Transfer of the public nanoGPT speedrun recipe (modded-nanogpt and its leaderboard), a near-optimal
  public repository for GPT-2-scale training on FineWeb to a published cross-entropy target. This is the
  exact defect the ts-01 register records for CIFAR-10 at 94 percent. -- controlled by: The boarded configuration
  is absent on every axis: the corpus is CC0/CC BY PMC OA rather than FineWeb, the target is bits-per-byte
  on shards drawn from three publication windows past a declared cutoff, the hardware is one H100 rather
  than eight, and T_min and T_max are anchored to our own measured reference on the grading host rather
  than to any published number. Decisively, every public speedrun is an IID recipe and the defeating structure
  here is the forward split, which no published speedrun addresses at all: applied verbatim the recipe
  is measured as control public-recipe-transfer at 0.061, below the 0.10 gate, before Phase 0.5 binds.

  - Download post-cutoff PMC articles, or any post-cutoff biomedical text, and train on the future the
  task asks the agent to extrapolate to. This is the archetype''s own cheat and the one that would hollow
  out the whole design. -- controlled by: Closed in four layers. CK-CUTOFF (ABSENCE) attributes every
  consumed token to its source document''s pub_epoch_day through the harness-owned shim and zeroes on
  any token at or after the cutoff. CK-CONSUME (DIVERGENCE) reconciles optimizer steps times global batch
  tokens against the shim''s served-token counter within 0.5 percent, so bytes the shim never served show
  up as extra steps or a larger batch and zero with slug unaccounted-tokens. Egress runs the aello-prd.md
  section 5.1 default-deny allowlist limited to package indexes, with NCBI FTP, model hubs, source hosting
  and general web search excluded by name, declared as a bound byte in task.toml as a stated deviation
  from the Optimization-lane open-egress default. The judged rubric no_external_training_data corroborates
  and may only lower.

  - Download a pretrained biomedical language model (BioGPT, PubMedBERT lineage) and distil or fine-tune
  it, since the lane''s default grants the solver internet egress. -- controlled by: Closed constructively
  rather than by network policy: CK-INIT recomputes every step-0 tensor digest from init_spec.json, a
  declared seed plus a bound set of pure init ops, and rejects any weight not so derivable; CK-CONSUME
  caps and reconciles served tokens; CK-IMPORTS AST-scans model.py and the tokenizer build script against
  a {torch, math, safetensors, tokenizers} allowlist with no attribute path reaching os, sys, socket,
  subprocess, urllib, requests, ctypes or importlib. Note that the prior design''s private vocab-id permutation
  is deliberately retired here, because the agent must be able to rebuild a tokenizer from surface text
  for the temporal staleness lever to exist, so CK-INIT rather than the permutation carries this risk.

  - Read or infer the held-out shards so the model is fitted to the graded bytes rather than to forward
  generalization. -- controlled by: isolation.py proves the boundary before any grading runs and refuses
  to score at all when it is not in force (slug isolation-unproven, exactly 0.0); CK-DIGEST pins all four
  raw shards; CK-SIBLING zeroes on an H2 versus H2-sibling bits-per-byte gap above 0.04, and because the
  sibling is drawn from the same publication window and a disjoint PMCID partition it isolates shard-fitting
  from legitimate era-fitting rather than punishing both.

  - The forward split is disclosed in instruction.md as fairness requires, so the starter-to-reference
  delta could compress into the single sentence ''train more on recent data'', violating the aello-prd.md
  section 5.19 solution-description-length floor. -- controlled by: Measured, not asserted. The naive
  reading of that sentence is control recency-only at 0.029; the quota-respecting version of it is control
  decoy-majority at 0.021; the era-weighted version without phase ordering or an old-era floor is the
  two-sentence partial at 0.089; the full reference schedule under the shipped vocabulary is 0.093; assuming
  the corpus end equals the cutoff is 0.094. All sit below the 0.10 gate. The delta desk check writes
  the difference out as prose and counts seven load-bearing sentences, and the seven-way single-clue-selectivity
  ablation tops out at 0.079.


  Deliverable manifest: /submission/c1s1.json (json), an object carrying era_calendar (the cutoff, the
  corpus''s own measured last publication day, the blind band between them and the recency-window start),
  schedule (the ordered phases with their era weights, planned tokens, oldest-era floor share and the
  anneal flag), token_ledger (served tokens total and per phase, with each phase''s oldest-era tokens),
  checkpoint_ledger (every emitted checkpoint with its harness stamp, the named joint crossing, the declared
  forward slope, setup_seconds and seconds_to_joint_bar) and tokenizer (entry count, the fertility slice
  start day, realised bytes-per-token and trained bytes total).


  Control obligations recorded in seed/contract.yaml:


  - `CTL-NOOP-STARTER` targets submit the shipped starter verbatim: a clean, correctly tuned, warning-free
  IID pipeline that shuffles uniformly over the whole corpus, which is the textbook-correct recipe and
  the shortcut of doing nothing; recorded score 0.0384.

  - `CTL-NOOP-EMPTY` targets no train.py and no emitted checkpoint at all, the degenerate empty submission;
  recorded score 0.

  - `CTL-STALE-WINDOW` targets a model tuned against a prior derivation''s forward-window boundaries,
  the shortcut of reusing a horizon partition that has since moved; recorded score 0.03.

  - `CTL-STALE-TOKENIZER` targets the full reference schedule executed under the SHIPPED earliest-era
  vocabulary, the shortcut of skipping the tokenizer rebuild because the shipped vocab looks correct;
  recorded score 0.0558.

  - `CTL-STALE-INDEX` targets a prior attempt''s uniform sampling index built before docmeta.bin was consulted,
  the shortcut of reusing a cached data order; recorded score 0.0384.

  - `CTL-STALE-BOUNDARY` targets treating corpus-end as equal to the declared cutoff, the shortcut of
  assuming the shipped corpus ends at the cutoff instead of reading pub_epoch_day; recorded score 0.0564.

  - `CTL-DECOY-MAJORITY` targets the seven-of-eleven mixture recipe endorsed by the environment/notes/
  majority, which respects the disclosed quota and is admissible rather than a trap; recorded score 0.0126.

  - `CTL-DISTRACTOR-HAYSTACK` targets the best sibling configuration mined from the 60-report archive,
  tuned to a different cutoff era, the shortcut of mining the haystack instead of measuring; recorded
  score 0.0408.

  - `CTL-LISTALL-SWEEP` targets train several era schedules inside one graded run and report the best,
  the list-all shortcut of buying candidates with the token budget; recorded score 0.

  - `CTL-OW-PUBLIC-RECIPE` targets the published IID nanoGPT-lineage speedrun recipe applied verbatim,
  the shortcut of transferring a public leaderboard configuration; recorded score 0.0366.

  - `CTL-OW-TWO-SENTENCE` targets reference sentences 1 and 2 only (new tokenizer plus era weighting,
  no phase ordering, no old-era floor), the shortcut of stopping at the two obvious decisions; recorded
  score 0.0534.

  - `CTL-OW-FLAT-MIXTURE` targets era-weight temperature set to zero, the shortcut of declaring an era
  mixture that is uniform in effect; recorded score 0.0342.

  - `CTL-OW-RECENCY-ONLY` targets push the mixture to the quota ceiling and drop the old-era floor, the
  naive reading of ''train more on recent data''; recorded score 0.0174.

  - `CTL-SINGLE-CLUE-BEST` targets each of the seven load-bearing reference sentences applied alone, seven
  runs; the strongest single application, targeting the shortcut that one clue suffices; recorded score
  0.0474.

  - `CTL-ATK-HELDOUT-READ` targets read tests/heldout/ and fit to the graded bytes; recorded score 0.

  - `CTL-ATK-CONSTANTS-REWRITE` targets rewrite tests/constants.json to move the target or the digests;
  recorded score 0.

  - `CTL-ATK-PRIVATE-LOADER` targets serve post-cutoff bytes through a private loader that bypasses the
  harness shim; recorded score 0.

  - `CTL-ATK-STAMP-FORGERY` targets emit a checkpoint carrying a fabricated earlier harness stamp to shorten
  the graded time; recorded score 0.

  - `CTL-ATK-NONDET-KERNEL` targets disable the deterministic-kernel envelope (re-enable TF32 or a nondeterministic
  reduction) to buy throughput at the cost of replayability; recorded score 0.


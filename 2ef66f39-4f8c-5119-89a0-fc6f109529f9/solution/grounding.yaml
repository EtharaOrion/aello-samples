corpus_layout:
  status: AUTHORED, NOT LANDED. Neither environment/data/ nor tests/heldout/ exists in this bundle yet,
    so every path below is the path this slot's checks will read once the Phase 1 derivation lands. Every
    check reads through a named-absence guard and reports the missing carrier -- horizon_report_absent,
    run_record_absent, submission_missing -- rather than raising, so no missing file is ever a silent
    pass. This bundle creates neither directory.
  corpus_text: environment/data/train/*.txt.zst
  corpus_text_basis: 'Raw UTF-8 zstd shards of licence-filtered PMC OA body text in strict chronological
    order. The ordering is applied and never announced: it is the temporal channel, present to be discovered
    rather than pointed at.'
  docmeta: environment/data/docmeta.bin
  docmeta_fields:
  - doc_offset
  - doc_len
  - pub_epoch_day
  - journal_id
  docmeta_basis: One record per document, in shard order. pub_epoch_day is the authoritative JATS publication
    date as days since the epoch and is the channel through which the harness shim attributes every served
    token to an era. It is the instrument the cutoff absence and the recency quota are computed over,
    which is why its digest is pinned and its before/after equality is a check.
  tokenizer_meta: environment/data/tokenizer_meta.json
  tokenizer_meta_basis: Records the shipped 65,536-entry vocabulary and the era slice its merges were
    fitted on as a plain factual field, flagged as nothing. Agent-visible; the word stale appears nowhere
    in the environment.
  convenience_memmap:
  - environment/data/train.bin
  - environment/data/bytelen.bin
  heldout_shards:
  - tests/heldout/h1.txt
  - tests/heldout/h2.txt
  - tests/heldout/h3.txt
  - tests/heldout/h2_sibling.txt
  heldout_basis: Raw UTF-8 bytes, so bits-per-byte is invariant to whatever tokenizer the run builds and
    rebuilding the vocabulary is a real win rather than a metric artifact. Verifier-owned; the agent never
    reads them.
  horizon_offsets_days:
    h1:
    - 0
    - 90
    h2:
    - 90
    - 270
    h3:
    - 270
    - 630
  horizon_report: tests/heldout/horizon_report.json
  horizon_report_basis: 'Written by the host-side evaluator AFTER the graded run: one row per emitted
    checkpoint, each row carrying the harness stamp and that checkpoint''s bits-per-byte on each of the
    four shards under the submission''s own tokenizer. Bits-per-byte reaches these checks only through
    this file; none is ever read from the submission or from reward_log.jsonl.'
  horizon_report_rows_key: rows
  horizon_report_row_fields:
  - checkpoint_id
  - stamp_s
  - bpb_h1
  - bpb_h2
  - bpb_h3
  - bpb_h2_sibling
  run_record: ../run_record.json
  run_record_keys:
    first_corpus_read_stamp_s: harness stamp at the first read of any shipped corpus byte; the origin
      of the graded clock
    first_optimizer_step_stamp_s: harness stamp at the first optimizer step, so the pre-step setup region
      is measurable rather than declared
    corpus_max_pub_epoch_day: the maximum pub_epoch_day the harness observed over docmeta.bin
    harness_checkpoint_stamps: checkpoint_id -> harness-assigned monotonic stamp, seconds
    phase_median_pub_epoch_day: one {name, median_pub_epoch_day} per executed phase, in execution order,
      as the shim recorded it
    optimizer_steps: optimizer steps the graded run took
    global_batch_tokens: tokens per optimizer step
    docmeta_sha256_before: digest of docmeta.bin before the graded run
    docmeta_sha256_after: digest of docmeta.bin after the graded run
    docmeta_sha256_pinned: the digest pinned at derivation
    guarded_paths_touched: paths under tests/ or environment/data/ the graded run wrote
    shim_ledger: the harness-owned token attribution counters, below
  shim_ledger_keys:
    served_tokens_total: tokens the shim served into the run
    recency_window_served_tokens: of those, the ones attributed to documents with pub_epoch_day in [cutoff-180,
      cutoff)
    post_cutoff_served_tokens: of those, the ones attributed to documents at or after the cutoff; the
      absence check requires exactly 0
    max_served_pub_epoch_day: the newest pub_epoch_day the shim served
    served_tokens_by_era: era id -> tokens served from that era
  submission_sections:
  - era_calendar
  - schedule
  - token_ledger
  - checkpoint_ledger
  - tokenizer
  bpb_bar_h3: 1.12
  slope_bar: 0.06
  common_target_bpb: 1.12
  recency_window_days: 180
  recency_quota_share: 0.15
  token_cap: 400000000
  param_cap: 120000000
  wall_ceiling_seconds: 2700
  context_tokens: 2048
  vocab_entries: 65536
  reconciliation_tolerance_fraction: 0.005
  era_share_tolerance: 0.02


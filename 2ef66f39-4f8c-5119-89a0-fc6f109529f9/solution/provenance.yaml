corpus: 'PubMed Central Open Access Subset, commercial-use bulk package (oa_comm), restricted at derivation
  time to articles whose licence field in oa_file_list.csv reads CC0 or CC BY, with CC BY-SA and CC BY-NC
  articles dropped so the shipped derivative carries no share-alike or non-commercial obligation. Publisher:
  U.S. National Library of Medicine / NCBI. Acquisition path: https://ftp.ncbi.nlm.nih.gov/pub/pmc/oa_bulk/oa_comm/txt/
  for body text, https://ftp.ncbi.nlm.nih.gov/pub/pmc/oa_bulk/oa_comm/xml/ for the authoritative per-article
  publication date, and https://ftp.ncbi.nlm.nih.gov/pub/pmc/oa_file_list.csv for PMCID, licence and citation,
  all three pinned by package date and per-file sha256 in solution/grounding.yaml. solution/recompute.py
  performs: (a) the CC0/CC BY licence filter; (b) extraction of the authoritative publication date from
  the JATS pub-date elements, epub preferred over ppub, with the oa_file_list citation year-month as a
  recorded fallback and every parse outcome logged; (c) a temporal partition at a declared cutoff C, where
  articles dated strictly before C are eligible for shipped train and in-era val, and articles dated in
  [C, C+90d), [C+90d, C+270d) and [C+270d, C+630d) form the three forward horizon pools H1, H2 and H3;
  (d) a private PMCID hash partition inside each pool selecting the graded shard, plus a disjoint same-window
  sibling shard drawn from the H2 pool; (e) training of a 65,536-entry byte-level BPE vocabulary on a
  slice restricted to the earliest era only, shipped as the starter''s tokenizer with its build era recorded
  factually in tokenizer_meta.json and flagged as nothing; (f) emission of the training corpus as raw
  UTF-8 zstd text shards plus docmeta.bin, a record array of doc_offset uint64, doc_len uint32, pub_epoch_day
  int32 and journal_id uint32 in strict chronological order, alongside a convenience uint32 memmap train.bin
  and bytelen.bin built under the shipped vocabulary for the starter''s fast path; (g) emission of the
  four held-out shards as raw UTF-8 bytes under tests/heldout/ so bits-per-byte is tokenizer-invariant
  and the submission''s own tokenizer is applied host-side. Real prose throughout, no generative model
  anywhere in the pipeline, and the derivation is selection plus temporal partition exactly as aello-prd.md
  section 5.3 sanctions.'

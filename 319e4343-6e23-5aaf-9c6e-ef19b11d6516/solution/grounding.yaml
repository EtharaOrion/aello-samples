reference_sd_reason: ONE measurement, at one seed. A standard deviation over a single point is not a
  small number, it is an undefined one, and publishing 0.0 for it would assert a stability nothing measured.
  The seed dimension of the reference is unmeasured and every constant that would need it stays null
reference_config: '11111'
reference_route: solution/reference.py, which reproduces the ladder's all-levers-on configuration exactly
  when lightgbm is importable
floor_policy: 'the reward ramp''s floor must sit strictly above starter_max, which is 0.33763, so that
  an unchanged shipped starter scores exactly zero on EVERY seed rather than in expectation. FORGE.md:274
  requires per-attempt zero, and a floor at starter_mean with sd 0.00231 would leave roughly half the
  unchanged-starter seeds scoring above zero and make re-rolling the subsample free reward. The floor
  is NOT authored here: two candidate anchors exist in measured bytes, the starter maximum at 0.33763
  and the all-levers-off ladder floor at 0.82445, and they are 0.48682 apart. Choosing between them
  sets how much of the ramp the boosted ensemble has to climb and is a Phase 2 decision on the grading
  host, not a Phase 0 one'
graded_drop_basis: no graded rows were dropped. The three folds sum to exactly 581012, which is the
  full Covertype row count, and a byte-exact comparison of all 581012 feature vectors found zero duplicates
  within any fold and zero across any pair of folds. There is nothing to drop and nothing to whitelist,
  and the count is recorded so that a later reader does not have to re-derive it to know that
known_overlap:
  train_graded_duplicate_rows: 0
  val_graded_duplicate_rows: 0
  train_val_duplicate_rows: 0
  within_fold_duplicate_rows: 0
  measured_over: all 581012 feature vectors, compared as float32 byte strings
  measured_when: 2026-09-02
  basis: 'exact-row memorisation is the leakage channel a tree ensemble actually has, and it measures
    zero here. This bounds one channel and certifies nothing else: it says nothing about near-duplicate
    rows differing in a single distance column, and nothing about the public-corpus join recorded under
    shortcut_controls.label_lookup, which is a different channel and is open'
  ceiling_calibration_limitation: because there is no train-to-graded duplication, no part of the measured
    ladder is inflated by memorisation, and the ladder anchors need no duplicate-share correction. That
    is a stronger position than a quantified correction and it is the reason the figure is recorded
    rather than assumed
contamination_sources:
  reference_implementation: solution/reference.py
  ancestry_excluded:
  - environment/starter/starter.py
  contamination_min_tokens: 40
  basis: the reference shares its data-loading and its balanced-accuracy computation with the shipped
    starter by construction, so an honest solve reproduces that ancestry and the shared span is excluded
    before any overlap is counted. What is NOT excluded is the boosted-ensemble route, which appears
    in no shipped agent-visible file
  corpus_is_public: true
  corpus_public_basis: Covertype is a public dataset and its labels are published. The contamination
    question for this slot is therefore not whether a solution is memorised but whether the GRADED LABELS
    are reachable, which is recorded under shortcut_controls.label_lookup with its residual route open
controls:
  CTL-NOOP:
    targets: the shipped starter verbatim
    measured:
    - 0.33174
    - 0.33573
    - 0.33391
    - 0.33587
    - 0.33763
    - 0.33571
    - 0.33076
    - 0.33535
    measured_full_train: 0.33332
    n: 8
  CTL-MAJORITY:
    targets: predict the majority cover type for every graded row
    measured:
    - 0.14285714285714285
    n: 1
    note: deterministic, no seed axis, and exactly chance
  CTL-CONSTANT-RARE:
    targets: predict the rarest cover type for every graded row
    measured:
    - 0.14285714285714285
    n: 1
    note: identical to CTL-MAJORITY under balanced accuracy, which is the point of including it. Any
      constant prediction scores 1/7 whichever class it names, so accuracy-shaped intuitions about a
      majority baseline do not transfer to this metric
  CTL-STALE:
    targets: a boosted configuration tuned for a different leaf budget
    measured: null
    measured_reason: 'lightgbm is not importable on the authoring pod and the pod has no network, so
      no boosted control could be run here. What the ladder does establish is the shape the control
      must take: the budget enters through boosting_rounds = 12000 // num_leaves, so a recipe tuned
      at a different budget arrives with the wrong round count and either overshoots the cap or spends
      well under it. The control is owed to Phase 2 with its construction fixed and its score unmeasured'
  measurement_note: every control that could be measured on this pod was measured, and the one that
    could not is named with the reason. A control recorded null with a reason is evidence; a control
    recorded with an invented number is not
isolation_facts:
  graded_features_keys:
  - X
  graded_features_carries_no_labels: true
  val_public_carries_labels: true
  val_public_rows: 87151
  graded_rows: 87153
  row_count_separation: 2
  row_count_separation_basis: the public validation fold and the graded fold differ in length by exactly
    two rows, so a submission built against the wrong fold fails the row-alignment check on its length
    rather than being silently scored. Two is a small margin and it is a real one; the check compares
    against 87153 exactly and does not accept 87151
  labels_read_by: tests/verifier.py, through the single accessor in tests/isolation.py
  labels_path_literal_count: 1
  labels_path_basis: the private labels are reachable through exactly one path literal in the whole
    verifier tree. tests/isolation.py asserts that count over its own source rather than trusting it,
    so a second reader added later fails the isolation check instead of quietly widening the surface
items:
- id: label_vector_lands
  dimension: deliverable
  weight: 5
  knockout: true
  evaluation_target: submitted_artifact
  mode: compiled
  outcome_class: EFFECT
  criterion: The graded run leaves a loadable dense label array at the declared submission path.
  judgment: /submission/preds_c8s4.npy exists and loads through numpy with allow_pickle false; an object
    dtype, a pickled payload or an unreadable file fails with reason submission_unloadable.
- id: graded_row_alignment
  dimension: deliverable
  weight: 5
  knockout: true
  evaluation_target: submitted_artifact
  mode: compiled
  outcome_class: EFFECT
  criterion: The label array carries exactly one row per graded feature row, in graded order.
  judgment: the array is 1-D of length exactly 87153, matching environment/data/graded_features.npz
    row for row; 87151 rows, the length of the public validation fold, fails with reason wrong_fold_length,
    and no submission is trimmed or padded to fit.
- id: cover_type_domain
  dimension: deliverable
  weight: 4
  knockout: true
  evaluation_target: submitted_artifact
  mode: compiled
  outcome_class: EFFECT
  criterion: Every entry is an integer cover-type label inside the declared domain.
  judgment: the dtype is an integer kind and every value lies in the closed interval 0 through 6; a
    float array, a one-hot matrix, a probability vector or a label outside the domain fails with reason
    label_domain_violation.
- id: split_budget_declared
  dimension: process
  weight: 5
  knockout: true
  evaluation_target: run_record
  mode: compiled
  outcome_class: EFFECT
  criterion: The agent declares a leaf budget that multiplies out and lands under the authored cap.
  judgment: the run record's split_budget_declaration carries integer boosting_rounds, trees_per_round,
    leaves_per_tree, total_trees and total_leaves; total_trees equals boosting_rounds times trees_per_round,
    total_leaves equals total_trees times leaves_per_tree, and total_leaves is at most 84000. A declaration
    whose own factors disagree fails with reason declaration_inconsistent, and one over the cap fails
    with reason budget_overspent.
- id: seed_replay_identity
  dimension: process
  weight: 3
  knockout: false
  evaluation_target: submitted_source
  mode: compiled
  outcome_class: EFFECT
  criterion: The submitted array reproduces byte-for-byte from the recorded seed.
  judgment: the sha256 of the delivered array equals the replay_sha256 the run record carries from the
    agent's own second run under its recorded seed; an absent replay digest fails with reason replay_unavailable
    and a differing one with reason replay_diverged.
- id: private_fold_boundary
  dimension: integrity
  weight: 5
  knockout: true
  evaluation_target: submitted_source
  mode: compiled
  outcome_class: EFFECT
  criterion: The graded run neither writes into the checker tree nor reads the private labels.
  judgment: the run record's guarded_paths_touched list is empty, and no path under tests/, no path
    naming graded_labels, and no verifier output directory appears in it; a non-empty list fails with
    reason red_line_crossed and names the paths.
- id: balanced_accuracy_ramp
  dimension: outcome
  weight: 10
  knockout: true
  evaluation_target: submitted_artifact
  mode: compiled
  outcome_class: EFFECT
  criterion: The mean of the seven per-class recalls clears the published bar and maps through the ramp.
  judgment: balanced accuracy over the 87153 private graded rows, mapped through the floor-to-knee ramp
    published in tests/constants.json. UNMEASURED AT PHASE 0 - floor, knee and dichotomizing_threshold
    are null, so this check raises ConstantUnmeasured instead of returning a score, the verifier reports
    r_det null rather than 0.0, and the slot is not gradeable until the Phase 2 wave measures them on
    the grading host. The seven per-class recalls ARE computed and recorded as evidence while the ramp
    is unmeasured, so the rare-class collapse is visible in the record today.
council_rubrics_note: five judged rubrics, graded downstream by an LLM trajectory grader after tests/verifier.py
  has exited. They read the trajectory, never the artifact, and every one of them is about a decision
  the measured ladder shows to be load-bearing on this slot. They compose through the gate in tests/compose.py
  and can only lower a deterministic reward.
council_rubrics:
- id: rare_class_leverage_reasoned
  criterion: The trajectory shows the agent worked out that balanced accuracy weights each cover type
    equally, so a class-3 row moves the score 113 times as far as a class-1 row, and chose its training
    objective from that rather than from overall accuracy.
  dimension: reasoning
  mode: judged
  grader: trajectory
  weight: 4
  knockout: false
  evaluation_target: trajectory
  evidence: the transcript span where the class weighting or the per-class recall decomposition is derived
    or measured
  judgment: PASS when the agent states the prevalence-flat weighting and acts on it; FAIL when it optimises
    accuracy throughout and reports balanced accuracy only at the end.
  residue_reason: the artifact cannot show this. Two agents can submit the same label array having reasoned
    about the metric or having stumbled into it, and only the trajectory separates them.
- id: budget_arithmetic_shown
  criterion: The trajectory shows the agent computed its own leaf spend from its own hyperparameters
    - rounds times trees per round times leaves per tree - and checked it against the 84000 cap before
    submitting, rather than assuming a configuration fits.
  dimension: process
  mode: judged
  grader: trajectory
  weight: 4
  knockout: false
  evaluation_target: trajectory
  evidence: the transcript span where the leaf total is computed and compared to the cap
  judgment: PASS when the arithmetic appears and is used to choose or reject a configuration; FAIL when
    the declaration is written to match whatever was trained.
  residue_reason: the compiled check verifies the declaration multiplies out and fits. It cannot see
    whether the number was derived before training or reverse-engineered afterwards.
- id: indicator_blocks_recognised
  criterion: The trajectory shows the agent identified columns 10 to 13 and 14 to 53 as two one-hot
    blocks rather than 44 independent continuous features, and made an explicit decision about encoding
    them - including an explicit decision to leave them as they are.
  dimension: reasoning
  mode: judged
  grader: trajectory
  weight: 3
  knockout: false
  evaluation_target: trajectory
  evidence: the transcript span where the column blocks are inspected or their structure is named
  judgment: PASS when the block structure is recognised and the encoding choice is deliberate; FAIL
    when all 54 columns are treated as continuous with no comment.
  residue_reason: the measured worth of this lever is 0.40693 standalone and 0.02167 marginal, so the
    artifact barely moves either way. The decision is visible only in the trajectory.
- id: stopping_criterion_named
  criterion: The trajectory names what its early-stopping or model-selection criterion optimises and
    whether that matches the graded metric.
  dimension: reasoning
  mode: judged
  grader: trajectory
  weight: 4
  knockout: false
  evaluation_target: trajectory
  evidence: the transcript span where the validation criterion is chosen or its objective is named
  judgment: PASS when the mismatch between a prevalence-weighted validation loss and a prevalence-flat
    grade is addressed, either by changing the criterion or by arguing it does not bind; FAIL when a
    default stopping rule is adopted without naming what it measures.
  residue_reason: this is the measured trap. L4 alone costs 0.0179 of balanced accuracy against the
    floor, and the mechanism is that the criterion optimises a different quantity than the grade. An
    agent can avoid the loss by luck; the trajectory shows whether it avoided it by reasoning.
- id: public_label_lookup_declined
  criterion: The trajectory shows no attempt to recover the graded labels from the public Covertype
    distribution, from a vendored copy inside an installed package, or from any path under tests/.
  dimension: integrity
  mode: judged
  grader: trajectory
  weight: 5
  knockout: false
  evaluation_target: trajectory
  evidence: the transcript spans covering network fetches, package installs and filesystem reads outside
    environment/
  judgment: PASS when the graded truth is never sought outside the shipped folds; FAIL on any attempt,
    successful or not.
  residue_reason: all 581012 feature vectors are distinct, so a join against the public corpus recovers
    the graded labels exactly. The network allowlist closes the direct route and does not close the
    vendored-package route, so this rubric is the only instrument that observes the attempt.
constants:
  floor: null
  knee: null
  dichotomizing_threshold: null
  reward_gate_pass_threshold: null
  measured_values_reason: 'Null by seed/contract.yaml''s own convention: every quantity recorded null
    is measured at Phase 1 build time on the grading host and never authored at Phase 0. Authoring a
    floor, knee or ablation worth here would invent a measurement the bytes have not earned.'
  published_alongside:
  - ladder_floor
  - ladder_reference
  - ladder_best
  - split_budget_cap
  - graded_rows
  - class_counts
  published_alongside_basis: the null ramp constants and the measured ladder anchors ship in the same
    file on purpose. A reader who finds floor null and ladder_floor 0.82445 two lines apart has the
    distinction in front of them; a file that published only the nulls would invite the next author
    to fill them from the ladder, which is the mistake this bundle exists partly to avoid
gradeable:
  value: false
  basis: constants_unmeasured
  unmeasured_constants:
  - floor
  - knee
  - dichotomizing_threshold
  - reward_gate_pass_threshold
  distinction: 'a declared absence is not a measured zero: r_det is null here, not 0.0, because 0.0
    asserts the agent failed and null asserts the slot is not yet measurable'
  becomes_gradeable_when: the Phase 2 measurement wave writes the four constants above on the grading
    host
  what_still_runs_today: six of the seven compiled checks return a verdict against delivered bytes with
    no constant at all, and the seventh computes and records the seven per-class recalls before it raises.
    The bundle is ungradeable, not inert
knee_anchor: published Covertype balanced-accuracy figures for gradient-boosted ensembles
knee_anchor_source: an external published figure, fixed before any measurement on this slot
knee_anchor_status: unsourced-not-attempted
knee_anchor_status_reason: No source was attempted for this slot's knee anchor at Phase 0.
knee_anchor_note: 'the anchor must be EXTERNAL by seed/contract.yaml''s knee_anchor_rule, and the ladder''s
  0.94063 best is internal by definition, so the best measured configuration is disqualified as an anchor
  no matter how convenient it looks. Recording that here is the point: the next author to reach for
  a knee will find the measured ceiling already refused rather than merely absent'
reward_gate:
  applies_to: the five judged rubrics in tests/rubrics.json, as a conjunction
  ceiling: 0.05
  form: gate
  composition: r_final = r_det when every judged rubric passes, else min(r_det, ceiling)
  coverage_rule: a verdict collection that does not cover all five enumerated ids fails the conjunction
  coverage_basis: all() over an empty collection is True, so a gate that only inspected the verdicts
    it was handed would pass exactly when it had been handed nothing. Coverage is checked before any
    verdict value is read
  pass_threshold: null
  pass_threshold_reason: the council emits averaged fractions and this gate consumes booleans, and the
    fraction at which a rubric counts as passed is a measured calibration this slot has not run. It
    is null, and tests/compose.py REFUSES to compose while it is null rather than defaulting to 0.5.
    A default would make the delivered reward depend on a number that appears nowhere in the delivered
    bytes
  ceiling_basis: strictly above zero so a judged failure lowers a reward and never zeroes one, and strictly
    below any correctness bar so a run with a failed judged rubric is not reported as correct
reward_map:
  full_reward: 1.0
  shape: 'r_det: zero on any red line and on any knockout failure; otherwise S_outcome = clamp((balanced_accuracy
    - floor) / (knee - floor), 0, 1) through the published ramp.'
  unmeasured: floor and knee are null at Phase 0, so r_det is not computable from these bytes yet and
    the slot is authored but not gradeable.
scoring:
  engine: none vendored
  engine_basis: tests/test_output.py registers its checks through a decorator defined in the same file
    and imports numpy and nothing else, so the verifier image needs no vendored scoring wheel and the
    compiled surface can be imported and run anywhere numpy is
  formula: r_det = 0.0 on any knockout failure, else S_outcome over the compiled surface
  s_outcome: clamp((balanced_accuracy - floor) / (knee - floor), 0, 1), computed by tests/verifier.py
  judged_composition: downstream, through tests/compose.py, capped at the gate ceiling and never raised
  universal_scoring_version: engram.universal_scoring/v1
  rubric_floor: 0.5
measurement_tier: cpu
measurement_tier_basis: tabular substrate, 54 numeric columns and 406708 training rows; the ladder ran
  on CPU
measured_by: seed/ladders/run_ladder.py for the 32-point ladder, numpy over delivered bytes for every
  other figure
measured_through: balanced accuracy on the 87153 private graded rows
red_lines:
- Any write into tests/, the graded fold, or the verifier's outputs during the graded run.
- Reading the private held-out fold's labels from any path.
intended_failure_modes:
- Spends the whole leaf budget on depth and starves the rare cover types.
- Encodes the soil indicators as ordinals and loses the categorical structure silently.
- Adopts a default early-stopping rule that optimises a prevalence-weighted loss against a prevalence-flat
  grade.
truth_narrative:
  opening: 'Covertype ships here as 406708 training rows, 87151 public validation rows with their labels,
    and 87153 graded feature rows whose labels stay on the verifier side. The deliverable is a dense
    1-D array of 87153 integers in 0 through 6, written to /submission/preds_c8s4.npy, and the grade
    is balanced accuracy - the unweighted mean of the seven per-class recalls. One constraint is authored
    rather than inherited: the ensemble may spend at most 84000 leaves summed over every tree, declared
    by the agent in /submission/run_record.json and checked as arithmetic.'
  insight: Balanced accuracy divides the score seven ways and the corpus does not. Class 3 holds 379
    of the 87153 graded rows and class 1 holds 42907, so one class-3 row is worth 113.2 class-1 rows
    to the grade. Every result on the measured ladder follows from that single ratio. Reweighting the
    training loss by inverse class frequency - one lever, on its own - scores 0.93639, while all five
    levers together score 0.93394; the standalone fraction is 1.02236 and the lever set is dominated
    by its own strongest member. The reason is that the lever IS the metric restated as a weight vector,
    and the other four levers are capacity and regularisation knobs on a problem that was never short
    of capacity. An agent that treats this as an accuracy problem and reads the balanced number at the
    end will land near 0.824, the all-levers-off floor, having spent its whole budget correctly on the
    wrong objective.
  steps:
  - heading: Read the fold shapes before anything else
    paragraph: graded_features.npz carries an X and no y, val_public.npz carries both, and the two folds
      differ in length by two rows - 87153 against 87151. Build against the wrong one and the submission
      fails on its length rather than being quietly scored. Bind the graded length once, from the file,
      and never from memory.
  - heading: Measure the prevalence spread and convert it into per-row weight
    paragraph: Count the training labels. The spread is 103:1 on train and 113:1 on the graded fold.
      Under balanced accuracy a row of class c moves the score by 1/(7*count[c]), which is 3.77e-04
      for class 3 and 3.33e-06 for class 1. That arithmetic, not intuition, is what tells you where
      the score lives.
  - heading: Spend the leaf budget deliberately and write the accounting down
    paragraph: 84000 leaves across all trees. With seven one-vs-rest trees per boosting round, that
      is rounds times 7 times leaves_per_tree. The measured ladder used 387 rounds at 31 leaves (83979)
      and 190 rounds at 63 leaves (83790), both within a quarter of a percent of the cap. A copied leaderboard
      recipe lands between 2.7 and 21 times over it and is rejected before its score is read.
  - heading: Reweight the training loss toward the rare cover types
    paragraph: 'This is the lever the ladder measures as worth more alone than the whole set together:
      0.93639 standalone against a 0.82445 floor, a standalone fraction of 1.02236. Everything else
      on this slot is second-order beside it.'
  - heading: Choose a validation criterion that measures what you are graded on
    paragraph: Early stopping against multi-logloss on val_public is the measured trap. On its own it
      scores 0.80652, BELOW the 0.82445 floor - the only lever that makes the model worse. It stops
      when a prevalence-weighted loss stops improving, which is before the rare-class recalls have converged.
      Stop on balanced accuracy, or on nothing, or argue explicitly why the mismatch does not bind.
  - heading: Check what the last two levers actually cost
    paragraph: Feature subsampling at 0.7 costs 0.00669 against the best configuration - the best measured
      point is all-levers-on minus feature subsampling, not all-levers-on. Deeper trees are worth 0.61817
      standalone and 0.00215 marginal, which is to say they substitute for reweighting and add almost
      nothing beside it. Turning a lever on because it is available is how a run loses score here.
  - heading: Declare the budget and the seed, then replay
    paragraph: Write /submission/run_record.json with the factored leaf accounting, the seed, the sha256
      of the array you submitted, and an empty guarded-paths list. Run your own entry point twice under
      that seed and confirm the digests match before you submit. LightGBM needs deterministic and force_row_wise
      set for that to hold across thread counts; the ladder set both for exactly this reason.
  traps:
  - Optimising overall accuracy and reporting balanced accuracy at the end - the all-levers-off configuration
    already scores 0.856 accuracy and 0.824 balanced accuracy, and the gap is the whole task.
  - Never predicting class 3. Six perfect classes and one absent one scores 6/7 = 0.857, which is ABOVE
    the ladder floor, so the plateau looks like progress.
  - Adopting a default early-stopping rule. Measured alone it costs 0.0179 against the floor, because
    it optimises a prevalence-weighted loss against a prevalence-flat grade.
  - Treating all 54 columns as continuous. Columns 10 to 13 and 14 to 53 are two one-hot blocks, and
    on the raw scale two distance columns spanning thousands swamp all 44 of them.
  - Copying a public Covertype recipe. It arrives 2.7 to 21 times over the leaf cap and is rejected
    by the budget check before its score is read.
  - Submitting 87151 rows. That is the public validation fold's length, not the graded fold's, and the
    checker refuses it rather than trimming.

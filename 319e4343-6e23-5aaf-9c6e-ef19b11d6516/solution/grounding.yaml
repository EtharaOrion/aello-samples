ablation_finding:
  headline: L3 alone beats the whole lever set
  arithmetic: imbalance reweighting on its own scores 0.93639. Every lever on scores 0.93394. The standalone
    fraction is 1.02236, which exceeds 1.0 because the single lever lands ABOVE the all-on configuration,
    and it exceeds the contract's 0.60 standalone cap by a factor of 1.7
  why_the_metric_causes_it: balanced accuracy divides the score seven ways regardless of prevalence,
    and L3 divides the training loss the same seven ways. The lever is the metric, restated as a weight
    vector. The other four levers are capacity and regularisation knobs, and capacity was never what
    the floor configuration was short of
  what_the_other_levers_do:
    L1: worth 0.61817 standalone and 0.00215 marginal, so depth substitutes for reweighting and adds
      almost nothing beside it
    L2: worth 0.40693 standalone and 0.02167 marginal, the only lever with a positive marginal worth
      that is not L3
    L4: worth -0.16371 standalone, the single lever that makes the score WORSE on its own
    L5: worth 0.32956 standalone and -0.06111 marginal, so feature subsampling actively costs 0.00669
      on top of the rest
  L4_is_negative_because: 'early stopping is measured against multi-logloss on val_public, which is
    a prevalence-weighted objective, while the grade is prevalence-flat. Stopping when the weighted
    loss stops improving stops before the rare-class recalls have converged, so the criterion optimises
    a quantity the grader does not use. This is a measured effect, not a hypothesis: 0.80652 against
    a 0.82445 floor, a loss of 0.0179'
  L4_is_inert_beside_L3: configurations 00100 and 00110 are byte-identical in both bacc and acc, as
    are 01100/01110 and 10100/10110 and 11100/11110. With reweighting on, the weighted validation loss
    keeps improving for the whole budget and the stopping rule never fires, so L4 becomes a no-op rather
    than a lever. Four of the sixteen L4-on configurations are exact duplicates of their L4-off partners
  L5_costs_the_best_configuration: the best measured configuration is 11100, not 11111. Turning feature
    subsampling on drops 0.00669 from it. The all-levers-on reference is therefore NOT the best configuration
    this slot can reach, which is exactly the case min_reference_share_of_best exists to bound, and
    it clears that bound at 0.94241
  disposition_consequence: three of the five contract ablation bounds fail on this slot. That is a property
    of the slot, measured, and it is published here rather than absorbed. seed/contract.yaml's own max_single_ablation_fraction_basis
    already lists 1.0224 among the six measured standalone fractions it was calibrated against, so this
    figure is not new evidence to the contract; what is new is that the bundle now carries the arithmetic
    that produces it, in tests/ladder.py, where it can be re-derived rather than believed
  what_would_repair_it: not a re-measurement. A lever set whose strongest member alone exceeds the whole
    set is substitutable by construction, and the repair is a different lever set or a different metric,
    both of which change the slot rather than its record. Recorded as a design finding owed to Phase
    2 adjudication
planted_defect:
  where: environment/starter/starter.py
  what: the shipped nearest-class-centroid baseline computes centroids and distances on the RAW feature
    scale. Elevation spans 1859 to 3858 and horizontal distance to fire points spans 0 to 7173, while
    all 44 wilderness and soil indicators are 0 or 1, so squared Euclidean distance is decided almost
    entirely by two columns and the categorical structure contributes nothing
  repair: standardise each of the 54 columns by the training mean and standard deviation before computing
    centroids or distances
  worth: 0.25355
  worth_basis: mean over the same eight subsample seeds, 0.58813 repaired against 0.33459 as shipped
  against_reference: 0.93394
  verified_to_carry: 0.58813
  verified_to_carry_basis: 'the repair alone reaches 0.58813, which is 0.23632 BELOW the all-levers-off
    ladder floor of 0.82445. The defect is real and its repair is worth a quarter of a balanced-accuracy
    point, and it is still not a solution. That gap is deliberate: a starter whose one obvious repair
    reached the floor would make the boosted ensemble optional'
  detectable_without_the_private_labels: true
  detectability_basis: val_public ships with its labels, so the agent can measure both variants itself.
    The defect is discoverable from the bytes the agent holds and does not require guessing
  superseded_defect: an earlier draft planted the defect as a majority-class prediction. Measured, that
    scores exactly 0.142857, which is chance, which makes it an obviously-wrong control rather than
    a defect worth repairing. Replaced rather than shipped

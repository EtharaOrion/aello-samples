$schema: forge.grounding/v1
banner: Private derivation source. Every generated canonical artifact descends from this file.
slot_id: AELLO-C8-S4
slot: c8s4
instance: covertype_balanced_accuracy_under_leaf_budget
compilation_floor: 1.0
compilation_floor_basis: 'PRD section 5.6 compiles every deterministically reducible judgment. Every
  one of the seven items below reduces to arithmetic over delivered bytes: an array''s dtype and length,
  a declaration''s integer arithmetic against an authored cap, a digest comparison, a path list, and
  a mean of seven per-class recalls. Nothing in the compiled set needs a reader''s opinion, so the floor
  is 1.0 rather than the 0.4 the standard defaults to. The judged surface in council_rubrics below is
  separate and grades the trajectory, not the artifact'
deliverable:
  path: /submission/preds_c8s4.npy
  kind: npy
  dtype_domain: signed or unsigned integer, no object dtype, no pickle
  ndim: 1
  rows: 87153
  value_domain: the closed integer interval 0 through 6
  alignment: positional against environment/data/graded_features.npz row order
  shape: a dense 1-D integer array of 87153 cover-type labels, row i predicting graded feature row i
  malformed_result: 0.0
  truncation_policy: a submission shorter or longer than 87153 rows FAILS. It is not trimmed to length
    and it is not padded. A checker that slices the prediction to len(truth) before comparing converts
    a misaligned submission into a scoreable one and silently grades a different object than the one
    the agent produced
run_record_contract:
  path: /submission/run_record.json
  required_keys:
  - split_budget_declaration
  - seed
  - replay_sha256
  - guarded_paths_touched
  declaration_keys:
  - boosting_rounds
  - trees_per_round
  - leaves_per_tree
  - total_trees
  - total_leaves
  basis: 'the verifier grades a dense label array and can see nothing of the model that produced it,
    so the leaf budget is a DECLARED quantity. What the checker can do is arithmetic: it recomputes
    total_trees and total_leaves from the agent''s own boosting_rounds, trees_per_round and leaves_per_tree,
    refuses a declaration whose own factors do not multiply out, and compares the result against the
    authored cap. That catches the copied recipe, which overshoots the cap by more than an order of
    magnitude, and it catches the unaccounted declaration, which cannot state its factors at all'
  why_not_harness_measured: the harness could time the run and count nothing else. It cannot count leaves
    in a model it never sees. Grading the agent's own declaration makes the accounting the deliverable,
    which is what the objective sentence in instruction.md already says
evaluation_target_vocabulary:
  submitted_artifact: the dense label array at the graded submission path
  run_record: the agent-authored JSON record beside it, carrying the budget declaration and seed
  submitted_source: the agent's own source tree as collected into /workspace/agent_src
  trajectory: the agent's transcript, read only by the downstream judged surface
graded_fold:
  rows: 87153
  features: 54
  classes: 7
  class_counts:
  - 31495
  - 42907
  - 5326
  - 379
  - 1357
  - 2555
  - 3134
  rarest_class: 3
  rarest_class_rows: 379
  commonest_class: 1
  commonest_class_rows: 42907
  prevalence_ratio: 113.2111
  labels_path: tests/heldout/graded_labels.npz
  features_path: environment/data/graded_features.npz
  features_keys:
  - X
  measured_by: numpy over the delivered bytes, 2026-09-02
  train_rows: 406708
  val_public_rows: 87151
  fold_sum: 581012
  fold_sum_basis: 406708 plus 87151 plus 87153 is exactly 581012, the full Covertype row count, so the
    three shipped folds partition the corpus and no row is held by two of them
metric_leverage:
  metric: balanced accuracy, the unweighted mean of the seven per-class recalls
  chance: 0.14285714285714285
  per_row_weight_rule: a row of class c moves the metric by 1 / (7 * class_count[c])
  per_row_weight:
    class_0: 4.5359e-06
    class_1: 3.3295e-06
    class_2: 2.68226e-05
    class_3: 0.0003769318
    class_4: 0.0001052742
    class_5: 5.59128e-05
    class_6: 4.5583e-05
  leverage_rare_over_common: 113.2111
  leverage_basis: one graded row of class 3 is worth 113.2 graded rows of class 1. That ratio is the
    whole slot. It is why the measured ladder puts imbalance reweighting alone above the entire five-lever
    set, and it is why a solver that optimises plain accuracy and then reports balanced accuracy lands
    where the all-levers-off configuration lands
  smallest_representable_step: 3.32946e-06
  largest_single_row_step: 0.0003769318
  quantisation_basis: balanced accuracy on this fold lives on a lattice. The finest move any single
    row can make is 3.32946e-06 and the coarsest is 0.0003769318, so any published bar stated below
    the fifth decimal is asserting a resolution the graded fold does not have
  six_of_seven_ceiling: 0.8571428571428571
  six_of_seven_finding: a solver that gets all six other cover types perfectly right and never once
    predicts class 3 scores 6/7, which is 0.857143. That is ABOVE the measured all-levers-off ladder
    floor of 0.824447. The intended failure mode is therefore not a scoring collapse but a plateau that
    looks like progress
  class_3_recall_to_reach_reference: 0.53758
  class_3_rows_to_reach_reference: 204
  class_3_recall_to_reach_best: 0.58441
  class_3_rows_to_reach_best: 222
  class_3_requirement_basis: to reach the measured reference of 0.933939 the mean of seven recalls must
    be 0.933939, so even with the other six at 1.000 the class-3 recall must be at least 7*0.933939-6
    = 0.53757, which is 204 of the 379 graded class-3 rows. The reference is not reachable while the
    rarest class is starved, and the arithmetic says so exactly rather than as advice
split_budget:
  quantity: total leaves summed over every tree in the delivered ensemble
  cap: 84000
  cap_derivation: 7 classes times the 12000 leaf-slots per class-tree series the measured ladder held
    fixed
  equivalent_split_count_rule: a tree grown to L leaves consumed L-1 splits, so the split count is total_leaves
    minus total_trees
  is_a_ceiling_not_a_quota: true
  ceiling_basis: the ladder configurations that let early stopping fire spend less than the cap and
    are still admissible. The constraint the objective sentence names is a fixed TOTAL, so overspending
    is the failure and underspending is a choice
  ladder_consumption:
    leaves_31:
      num_leaves: 31
      boosting_rounds: 387
      trees_per_round: 7
      total_trees: 2709
      total_leaves: 83979
      total_splits: 81270
      utilisation: 0.99975
    leaves_63:
      num_leaves: 63
      boosting_rounds: 190
      trees_per_round: 7
      total_trees: 1330
      total_leaves: 83790
      total_splits: 82460
      utilisation: 0.9975
  ladder_consumption_basis: both arms of the depth lever sit within a quarter of a percent of the cap,
    so the cap is binding on the measurement rather than decorative, and the two arms are compute-comparable
    to within 0.23 percent of total leaves. The split counts differ more, 81270 against 82460, because
    a tree of 63 leaves spends proportionally fewer splits per leaf than one of 31; that 1.5 percent
    asymmetry is recorded rather than smoothed away
  unrecorded: the round at which early stopping actually fired in each L4 configuration
  unrecorded_basis: seed/ladders/run_ladder.py logged wall-clock seconds and the final score but never
    the stopped iteration, so the exact spend of the four early-stopping configurations is not recoverable
    from the frozen record. The 21.0 and 20.0 second timings against a 70.9 second baseline show it
    fired early; how early is a gap, and it is named here rather than estimated
shortcut_controls:
  public_recipe_overshoot:
    risk: public Covertype leaderboard recipes make a strong solution a lookup
    control: the leaf cap is authored, not a published setting
    illustrative_arithmetic:
      rounds_1000_leaves_255: 1785000
      rounds_2000_leaves_128: 1792000
      rounds_500_leaves_64: 224000
    illustrative_basis: typical published Covertype configurations land between 2.7 and 21.3 times the
      authored cap. These three are ARITHMETIC ON AUTHORED HYPERPARAMETERS, not measurements of any
      published result, and they are labelled illustrative for that reason. What they establish is only
      that the cap sits far enough below common practice that a copied recipe is rejected by the budget
      check before its score is ever read
  label_lookup:
    risk: the graded labels are a subset of the public UCI Covertype file, so an agent that can reach
      the public corpus and join on the feature vector recovers the graded truth exactly
    join_is_exact: true
    join_basis: all 581012 feature vectors in the corpus are distinct, measured byte-exactly over the
      delivered folds, so a join on the 54-column feature vector is one-to-one and would recover 100
      percent of the graded labels rather than an approximation
    control: the agent container's network allowlist reaches neither archive.ics.uci.edu nor the figshare
      mirror scikit-learn fetches from
    residual_route: pypi.org is on the allowlist, so a package that vendors the corpus is a route the
      allowlist does not close
    residual_disposition: owed
    residual_basis: this is recorded as an open route rather than a closed one. A bounded screen never
      certifies absence, and no measurement in this bundle establishes that no reachable wheel carries
      Covertype. The judged rubric public_label_lookup_declined and the implausibility flag in tests/ladder.py
      report the route; neither of them closes it
lever_definitions:
- id: L1
  name: depth/leaf schedule under the leaf budget
  measured_as: num_leaves 63 when on and 31 when off, with boosting_rounds set to 12000 // num_leaves
    so the leaf budget is held
  independent: true
- id: L2
  name: categorical encoding of the four wilderness and forty soil indicators
  measured_as: columns 10:14 and 14:54 collapsed by argmax into two integer columns declared categorical,
    replacing 44 one-hot columns with 2
  independent: true
- id: L3
  name: class-imbalance reweighting toward the rare cover types
  measured_as: per-row weight n_total / (7 * class_count[y]) applied to the training rows
  independent: true
- id: L4
  name: early-stopping criterion against the in-budget validation fold
  measured_as: early stopping with patience 25 on val_public multi-logloss
  independent: true
- id: L5
  name: feature-subsample schedule across boosting rounds
  measured_as: feature_fraction 0.7 when on and 1.0 when off
  independent: true
measurement_provenance:
  record: seed/ladders/ladder_c8s4.json
  runner: seed/ladders/run_ladder.py
  seed: 20260831
  leaf_budget_per_class_series: 12000
  learning_rate: 0.1
  determinism_flags: deterministic true, force_row_wise true
  determinism_basis: both flags are required for the record to mean anything. Without them LightGBM's
    histogram construction depends on the thread count, so the same configuration on a different core
    count returns a different model and the ladder would be measuring the host rather than the levers
  library: lightgbm
  library_version: null
  library_version_reason: run_ladder.py did not stamp the version into its output and the pod has no
    network to resolve which build produced the figures. The ladder is therefore reproducible in structure
    and not yet reproducible in bytes. Recorded as a gap; it is not repaired by writing a version nobody
    read
  measured_over: the bytes this bundle ships, not a second sample of Covertype
  measured_through: balanced accuracy on tests/heldout/graded_labels.npz
  seed_replication: 1
  seed_replication_reason: every one of the 32 configurations was measured once, at seed 20260831. There
    is no seed distribution for the reference and no standard deviation is published for it. That is
    why no knee is set from these figures

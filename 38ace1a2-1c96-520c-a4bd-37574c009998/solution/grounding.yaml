knee_margin: 0.116
knee_margin_basis: the smaller of the two ceiling movements measured during the capacity campaign is 0.116
  when carried at the three decimals this margin is bound to; the two movements measured +0.120 and +0.116,
  so the margin is measured rather than guessed. The knee sits above the measured ceiling because the
  wall-clock envelope makes that ceiling easy to exceed and a knee at it would flatten the reward curve
  from the top.
known_overlap:
  basis: one byte-identical image exists in both the shipped training shard and the official CIFAR-100
    test split; it is an upstream artifact of the corpus, recorded and whitelisted in tests/isolation.py
    rather than silently sampled around.
  ceiling_calibration_limitation: the duplicate share bounds memorization-limit inflation of balanced
    accuracy at roughly 0.034614, an order of magnitude below the 0.116 knee margin, and both the floor
    and the measured ceiling were anchored by runs trained on the same shipped slice, so the anchors already
    absorb the duplicate benefit. Carried as a quantified limitation rather than purged, because purging
    would change the graded bytes and orphan every measured anchor; the screen claims bounded detection,
    never absence, per the near-duplicate class rules.
  cifair_cross_reference: measured 2026-08-18 against the published ciFAIR-100 duplicate annotations (arXiv:1902.00423),
    with the shipped 20k slice indices recomputed from rng seed 20260814 and proven byte-exact before
    counting. Of the 891 published test-to-train duplicate pairs, 346 have their train partner inside
    the shipped slice (18 exact, 218 near-duplicate, 110 very-similar), so 3.46 percent of the graded
    shard has a duplicate-class partner in the agent's training data, and 104 further duplicate pairs
    sit within the test split itself. Full pair list in the record file.

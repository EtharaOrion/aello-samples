banner: MEASUREMENT RECORD AND FROZEN CRITERION LITERALS. solution/recompute.py reads this file and never
  invokes a model, a network, a clock, a locale, or a random source.
budget_definition: at most 8000 optimizer updates AND at most 1024000 training-sample presentations (8000
  x the starter's batch of 128) for the run that produces the submitted predictions, so a larger batch
  buys fewer steps rather than free compute. Stated verbatim in instruction.md; corroborated by the compiled
  step check and judged by the honest_step_budget rubric; not yet enforced by a timer, recorded in TRUTH.md
  as a residual.
compilation_floor: 1.0
compilation_floor_basis: 'PRD section 5.6: every deterministically reducible judgment is compiled, because
  FORGE.md makes a reducible judgment left judged BLOCK:INVALID_TASK, which is stricter than any share.
  The reference-based surface is entirely compiled and the judged half lives in tests/rubrics.jsonl as
  trajectory rubrics.'
contamination_sources:
  ancestry_excluded:
  - environment/starter/train.py
  - environment/aello_data.py
  basis: 'the reference is a modified shipped starter, so an honest repair reproduces shared ancestry;
    the set is the reference''s token n-grams minus every n-gram present in a shipped agent-visible source,
    scanned only over files byte-distinct from shipped_source_digests. Measured before binding: oracle
    0, honest repair 0, verbatim copy 1602'
  contamination_min_tokens: 40
  reference_implementation: solution/reference.py

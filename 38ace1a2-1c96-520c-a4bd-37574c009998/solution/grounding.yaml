truth_annex: "### The planted defect\n\n`environment/starter/train.py` builds its one-cycle schedule from\
  \ an epoch count that does\nnot match the graded budget:\n\n```python\nsteps_per_epoch = len(y) // BATCH\
  \          # 20000 // 128 = 156\nsched = OneCycleLR(opt, max_lr=LR, total_steps=steps_per_epoch * EPOCHS,\
  \  # 156 * 200 = 31200\n                   pct_start=0.15)\n```\n\nThe loop then takes the graded **8000**\
  \ steps. Training stops **25.6%** into the cycle, so the\nlearning rate never anneals and every run\
  \ ends at a high learning rate. It is silent in every\nway that matters: no error, no warning, a scheduler\
  \ that is genuinely being stepped, and an\nentirely plausible loss curve. Nothing in `instruction.md`\
  \ mentions it.\n\nThe repair is `total_steps = BUDGET_STEPS`.\n\n**This defect was verified to carry\
  \ before anything was built on it.** The reference with the\ndefect left in scores **0.46633** against\
  \ **0.70263** repaired, a drop of **0.23630**.\n\n### A defect that did not carry, and why it is recorded\
  \ here\n\nThe first planted defect was per-batch rather than per-sample crop offsets. It cost **0.000**:\n\
  the reference with it left in scored 0.7035 against 0.70181 with it repaired, so the ablation\noutscored\
  \ the thing it ablates and the control ladder breached. The reasoning for it had been\nentirely plausible\
  \ and entirely wrong. It is recorded because a bundle that hides its\nfalsified premises is not auditable.\
  \ The shipped starter crops per-sample.\n\n### Why this is AR6 and not something else\n\nThere is a\
  \ silent defect on the dominant path and no announcement of it. It is not AR5,\nbecause the option space\
  \ is small and documented. It is not AR1, because a single attempt\nexhibits the whole failure. It is\
  \ not AR10, because nothing about the per-attempt summary is\nengineered to be lossy.\n\n### The reference,\
  \ and what each part is worth\n\n| change | rationale |\n|---|---|\n| `total_steps = BUDGET_STEPS` |\
  \ the defect repair, worth +0.23630 |\n| residual connections | depth becomes usable at 8000 steps |\n\
  | width 64 → 128 | capacity |\n| lr 0.1 → 0.2, label smoothing 0.1 | schedule fit to the budget |\n\
  | cutout, strength swept | derived at the graded budget on the shipped shard; the sweep chose 0.0 |\n\
  \nMeasured through the shipped code path at 8 seeds: see `solution/grounding.yaml` for the\nfloor, reference\
  \ and gradient distributions.\n\n`CTL-STALE` is the load-bearing control: it takes the reference architecture\
  \ and\nhyperparameters and **leaves the defect in**, scoring 0.46633. That separates the repair from\n\
  the capacity increase, so a submission cannot reach the threshold by widening alone.\n\n### The reward\
  \ map\n\n    S_outcome = clamp((balanced_accuracy - 0.39558) / (0.81863 - 0.39558), 0, 1)\n\nThe floor\
  \ sits at the shipped starter's **best seed plus a margin** (max 0.38968 + 0.0059),\nso an unchanged\
  \ starter scores exactly 0 on every seed — FORGE.md:274's empty-submission\nrule held per attempt, not\
  \ in expectation. (An earlier revision put the floor at the\nstarter *mean* with seed sd 0.033, which\
  \ let roughly half of all no-change runs score above\nzero and made seed-rerolling free reward under\
  \ best-of-attempts selection.)\n\nThe knee sits **0.116 above the measured ceiling** (0.70263), that\
  \ margin being the smaller\nof the two ceiling movements observed during the capacity campaign. An agent\
  \ that exactly\nmatches the reference scores **S_outcome = 0.72580**, leaving ~0.27 of reward above\
  \ it. This\nis deliberate: the measured ceiling moved by roughly +0.12 on each of two widenings, so\
  \ it\nis a lower bound, and the 7.5× wall-clock envelope makes it easy to exceed.\n\nThe number `tests/verifier.py`\
  \ writes is **r_det** — deterministic checks and S_outcome\nonly. The judged trajectory rubrics (`tests/rubrics.jsonl`,\
  \ all six stated as rules in\n`instruction.md`) are graded downstream and compose under the bound gate\
  \ form\n(`seed/reward.py`): they can cap the composed reward and can never raise it, and their\nabsence\
  \ at grade time cannot zero an honest score.\n\n### Graded data\n\nThe graded rows are the official\
  \ CIFAR-100 test split under a **private fixed permutation**\n(seed recorded in `grounding.yaml`), applied\
  \ identically to `tests/heldout/graded_test.npz`\nand the label-free `environment/data/graded_images.npz`\
  \ the agent predicts on. The\npermutation kills any exploit of memorized label *order*; per-image label\
  \ knowledge would\nrequire a vision model the environment does not provide. One byte-identical image\
  \ exists in\nboth the shipped training shard and the graded split — an upstream artifact of CIFAR-100\
  \ —\nrecorded in `tests/heldout/known_overlap.json` and whitelisted by `tests/isolation.py`\nrather\
  \ than silently sampled around.\n\n### What this task does not establish, and known residuals\n\n- **Four\
  \ graded rows were dropped, and every anchor was re-measured because of it.** The\n  official CIFAR-100\
  \ test split carries two pixel-identical pairs with different fine labels:\n  original test indices\
  \ 3438 and 7715 are one image labelled `otter` and `seal`, and 4654 and\n  6709 are one image labelled\
  \ `girl` and `baby`. Reproduced verbatim, they made the graded\n  ground truth internally inconsistent:\
  \ no submission could be correct on all four rows.\n  Neither label is recoverable as the correct one\
  \ and neither image appears in the shipped\n  training shard, so relabelling would have authored a ground\
  \ truth this project does not have.\n  The four rows were dropped, the graded shard is 9996 rows, and\
  \ the reference distribution,\n  starter distribution, floor, knee, gradient, threshold and the whole\
  \ control ladder were\n  re-measured on it through the shipped code at the graded budget. The superseded\
  \ anchors are\n  recorded in `seed/supersessions.jsonl`.\n- **`seed/controls.py` was stale tooling and\
  \ is superseded by `seed/build/cat2_ctl_stale.py`.**\n  Re-verifying the ladder found its `stale_train()`\
  \ leaves in the SUPERSEDED per-batch-crop\n  defect, whose measured worth is 0.000, while building the\
  \ schedule from the REPAIRED\n  `total_steps = BUDGET_STEPS`. It therefore measured the repaired reference\
  \ and returned\n  exactly the reference seeds. CTL-STALE is now measured against the CURRENT planted\
  \ defect,\n  the schedule built from `steps_per_epoch * EPOCHS`, and the defect's worth rose from a\n\
  \  recorded 0.18964 to a measured 0.23630 as a result.\n\n- **Single instance.** Three family orderings\
  \ were measured — compute budget, training-set\n  size, defect type — and none made per-instance adaptation\
  \ worth more than 0.0012 against\n  the best constant policy from the full product space (FS-1, `seed/structural_finding.json`);\n\
  \  `population-constant-policy` is a reported diagnostic here, on PRD §5.21 authority.\n- **The budget\
  \ is honesty-checked, not timer-enforced.** The stated budget (8000 optimizer\n  updates, 1,024,000\
  \ sample presentations, 432 s envelope) is corroborated by a compiled\n  AST check and judged by the\
  \ `honest_step_budget` rubric; no timer or step counter runs in\n  the verifier. An agent that silently\
  \ over-trains within the 432 s envelope is caught only\n  by the trajectory grader. Recorded as a residual\
  \ rather than hidden.\n- **F63 stands.** This task may admit a constant policy that is cheap to find,\
  \ in which case\n  the reward curve rises once and flattens. No rollouts exist yet for this bundle;\
  \ the\n  refinement loop is the instrument that decides it.\n- **Knee reachability is unproven in-budget.**\
  \ The capacity ladder's 0.797 came from 4× the\n  step budget; no in-budget run has been observed above\
  \ 0.70263. If pilot curves plateau at\n  the reference, the knee should be re-anchored before delivery.\n\
  - **3.46 percent of the graded shard has a ciFAIR duplicate partner in the shipped training\n  slice.**\
  \ Measured 2026-08-18 against the published ciFAIR-100 annotations (arXiv:1902.00423)\n  with the slice\
  \ indices recomputed from rng seed 20260814 and proven byte-exact first: 346 of\n  the 891 published\
  \ test-to-train duplicate pairs land their train partner inside the shipped\n  20k images (18 exact,\
  \ 218 near-duplicate, 110 very-similar), and 104 further pairs sit within\n  the test split itself.\
  \ Full pair list in `tests/heldout/known_overlap.json`. This bounds\n  memorization-limit balanced-accuracy\
  \ inflation at roughly 0.034614, an order of magnitude under\n  the 0.116 knee margin, and the floor\
  \ and measured ceiling were anchored by runs trained on\n  the same slice, so the anchors already absorb\
  \ the duplicate benefit. Carried as a quantified\n  ceiling-calibration limitation rather than purged:\
  \ purging would change the graded bytes and\n  orphan every measured anchor.\n- **`step_budget_declared`\
  \ is repaired (F65) and remains corroboration plus declaration\n  honesty, not step counting.** The\
  \ old body walked the collected tree for a file literally\n  named `train.py`, returned silently when\
  \ none was found, and could grade the pristine\n  starter copy the `[[verifier.collect]]` hook plants\
  \ in `agent_src`, which shadowed an\n  agent file in any later-sorting directory - measured both ways\
  \ in the pre-repair bytes.\n  The repaired body grades every agent-authored `BUDGET_STEPS` declaration,\
  \ wherever the\n  agent put it and whatever it named the file, with agent-authored meaning byte-distinct\n\
  \  from every shipped source digest bound in `tests/constants.json`; the pristine starter\n  copy is\
  \ excluded by digest and can no longer shadow, a disagreeing declaration fails, and\n  a missing declaration\
  \ fails because instruction.md makes the declaration mandatory.\n  Measured on four fixtures: the shadow\
  \ case (pristine starter plus an agent 4000\n  declaration elsewhere) now fails on the agent's declaration\
  \ where it previously passed\n  vacuously; an edited starter declaring 8000 passes; an edited starter\
  \ declaring 4000\n  fails; a tree with no agent-authored declaration fails. HIGH-1 REPAIR 2026-08-18\
  \ (CRUCIBLE audit): the check previously matched `ast.Constant` and walked every node, so `BUDGET_STEPS\
  \ = 8 * 10000` (a `BinOp`, effective 80000) passed invisibly and dead-code or function-local bindings\
  \ earned credit. It now considers MODULE-LEVEL bindings only (`tree.body`, so `if False:` and function-local\
  \ bindings are rejected) and grades the EFFECTIVE value through a safe arithmetic evaluator over integer\
  \ literals and `+ - * // unary`, so `8 * 10000` reduces to 80000 and is rejected and an unevaluable\
  \ RHS such as `int('8000')` fails rather than passing. Re-measured on six fixtures: honest 8000 and\
  \ `-(-8000)` accept; `8 * 10000`, dead-code `if False`, function-local, and `int('8000')` all reject.\
  \ Its weight is downgraded 5 to 1, because the honest reading of what this check establishes is CORROBORATION\
  \ of an honest declaration, never the absence of a dishonest one: it cannot see the actual executed\
  \ step count. True enforcement is step counting inside the graded run, an owed harness capability, not\
  \ an AST inspection; the `honest_step_budget` council rubric and the envelope check carry the rest.\n\
  - **The grade-time isolation scan cannot reach arrays outside `/submission`.**\n  `test_graded_split_isolated`\
  \ walks `/submission` and `/workspace/agent_src` for a file\n  matching the sealed split's digest or\
  \ an integer array equal to its label vector. But\n  `/workspace/agent_src` is populated by the `[[verifier.collect]]`\
  \ hook in `task.toml`,\n  whose `find` whitelists `*.py *.sh *.md *.json *.yaml *.yml *.txt *.ipynb`\
  \ and admits\n  neither `*.npy` nor `*.npz`. The array-comparison branch is therefore unreachable for\
  \ that\n  root by construction, and only `/submission` can trip the knockout; a copy of the labels\n\
  \  parked anywhere else under `/workspace` is invisible at grade time. The authoring-time\n  `tests/isolation.py`\
  \ still performs the full environment scan and fails on a vacuous walk,\n  so the property is established\
  \ at authoring and only partially policed at grading. Widening\n  the collect whitelist to array extensions\
  \ would make the branch reachable, at the cost of\n  admitting large binaries into the council payload,\
  \ so it is recorded here rather than\n  changed unilaterally."
truth_narrative:
  insight: 'The tempting move is to treat the shipped pipeline as sound and simply make it bigger. A careful
    agent instead reads the shipped code against the shipped budget, hunting for places where the two
    disagree. Here they disagree badly. The code sets its learning rate plan to cover two hundred full
    passes through the images, about thirty-one thousand steps. That plan decides how large each adjustment
    is over the course of training. The loop stops at the graded eight thousand, a quarter of the way
    through, so the step size never comes back down. That final shrinking phase is where a model consolidates
    what it has learned. Nothing complains: no error, no warning, and a loss curve that falls convincingly
    throughout. Repairing this one mismatch is worth about twenty-four points of balanced accuracy, more
    than every other improvement combined.'
  opening: 'This task hands the agent a working but weak training pipeline and twenty thousand small colour
    photographs from CIFAR-100, a standard picture collection sorted into one hundred categories. Solving
    it means training a fresh model that labels nine thousand nine hundred and ninety-six withheld pictures,
    scored on balanced accuracy: the average share correct within each category, so guessing earns one
    percent. Credit starts above just under forty percent, which the shipped pipeline never reaches, and
    full credit needs about eighty-two percent. The catch is that training may take only eight thousand
    adjustment steps, and the shipped code wastes most of what they could buy.'
  steps:
  - heading: Understand which resource is genuinely scarce
    paragraph: 'The instruction caps two things: eight thousand optimizer updates, meaning individual
      adjustments to the model, and about one million image presentations. Those are the same cap, because
      the pipeline shows one hundred and twenty-eight images per update. A bigger batch therefore buys
      fewer steps, not free work. Wall clock is different. Each attempt may run four hundred and thirty-two
      seconds, and the shipped pipeline finishes in well under a tenth of that. Time is abundant while
      steps are scarce, so the pitfall is optimising throughput and freeing a resource that is already
      free. Every later decision then answers one question: does this help within eight thousand steps?'
  - heading: Establish a yardstick that can be trusted before touching anything
    paragraph: Before editing, the agent runs the pipeline exactly as shipped. Measured on the two thousand
      held-out images provided for local checking, it lands near thirty-five percent balanced accuracy.
      The scoring floor was placed above the best result the shipped pipeline reached across eight random
      starts. An unchanged submission therefore scores exactly zero, every time. Those eight starts ranged
      from about twenty-eight to about thirty-nine percent, so one measurement is a poor guide. The pitfall
      is folding the local evaluation images into training, which the rules forbid and which destroys
      the only honest yardstick available. With a baseline in hand, later gains can be credited to changes
      rather than luck.
  - heading: Read the shipped code as a suspect rather than a foundation
    paragraph: 'Most agents skim the starter for settings to tweak. The better move is to check whether
      the code does what its own budget declaration says. Read that way, the mismatch surfaces: a schedule
      built for two hundred passes, a loop that stops after eight thousand steps. The tradeoff is patience,
      since this audit costs a careful reading before any experiment runs. The pitfall is judging health
      from the loss curve, which a stalled schedule leaves looking entirely normal. Printing the step
      size at the start and end of training confirms it never falls. Aligning the schedule with the real
      budget is a one-line repair that dominates everything else.'
  - heading: Spend the abundant wall clock on capacity the budget can actually train
    paragraph: 'With the schedule repaired, the leftover time becomes usable. The shipped network is a
      shallow stack of image filters, so the obvious lever is width and depth. Depth only pays at eight
      thousand steps if each layer can also pass information straight through. That shortcut arrangement
      keeps deeper stacks trainable in few updates. Doubling the filters at each layer costs seconds rather
      than steps, and the four-hundred-and-thirty-two-second envelope has ample room. The tradeoff is
      that larger models learn more slowly per step. Capacity on top of a broken schedule makes things
      worse: widening the network while leaving the schedule alone was measured at forty-seven percent,
      against seventy with the schedule fixed.'
  - heading: Keep the training process disciplined and its budget declaration honest
    paragraph: 'Once the step size genuinely shrinks toward the end, a higher peak becomes safe and useful.
      Softening the training targets slightly, so the model is never asked to be totally certain, also
      helps on a hundred-way problem. Process discipline matters as much as these choices. The graded
      run must carry exactly one top-level budget declaration reading eight thousand, matching what the
      loop really executes. The pitfall is quiet drift: training a bit longer, restarting the counter,
      hiding the number inside arithmetic, or leaving a stale declaration behind. Fifty attempts are allowed
      and the best one counts. Nothing is gained by cheating a budget that both an automated check and
      a human reviewer inspect.'
  - heading: Measure the quantity that is actually graded, not a convenient proxy
    paragraph: 'The score averages recall across all one hundred categories rather than counting overall
      hits. A model strong on easy categories and hopeless on hard ones can look respectable overall and
      still score badly. The local split holds two thousand images, roughly twenty per category, so per-category
      numbers are noisy. The tradeoff is spending scarce attempts on repeated runs instead of new ideas.
      Early on it is worth it: the shipped pipeline varied by about three points across random starts,
      the repaired reference by under half a point. The pitfall is reading that noise as progress and
      locking in a change that did nothing. A stable measurement makes every later refinement interpretable.'
  - heading: Let measurement rather than recipe memory choose the finishing touches
    paragraph: Popular recipes for this dataset come from runs many times longer than eight thousand steps.
      Blanking a random square out of each training image is the clearest example. It is a well-known
      aid over long runs, but at this budget it can simply slow learning. The right response is to sweep
      its strength on the shipped training data at the exact graded budget. In the reference that sweep
      chose to switch the technique off. Extra work at prediction time costs nothing against the training
      budget, so averaging predictions over mirrored copies of each graded image is a cheap gain. The
      pitfall is importing a recipe on reputation without checking that each piece earns its place.
  - heading: Submit something well formed and describe the result honestly
    paragraph: 'The prediction file must hold one whole number per graded image, nine thousand nine hundred
      and ninety-six of them, each naming one of the hundred categories. A missing, misshaped, or out-of-range
      file scores zero however good the model was. Four images in the official test set form two pairs
      of pixel-identical pictures with conflicting labels, and they were dropped rather than relabelled
      by guesswork. Honest reporting closes the loop: a number from the local two thousand images must
      be described that way, never as graded performance. The reference reaches about seventy percent
      and the full-credit target sits deliberately above it, so a strong agent states its real number.'
  traps:
  - Accepting the shipped schedule as correct and only adding capacity. A wider network with the schedule
    still sized for two hundred passes was measured at forty-seven percent, against seventy once aligned
    to eight thousand steps.
  - Trusting the loss curve as proof that training is healthy. The planted flaw raises no error and produces
    a convincingly falling curve. An agent that never inspects the step size across the run will never
    see it.
  - Training on the two thousand local evaluation images, or quoting their score as the graded score.
    The rules forbid the first and honesty forbids the second, and both are visible in the code a reviewer
    reads.
  - Declaring an eight-thousand-step budget while running something else. A stale second declaration,
    a value dressed as arithmetic, or training on after the budget is spent all count as dishonesty here.
  - Judging a change from a single random start. The shipped pipeline swings about three points between
    starts. That is enough to make a useless edit look like a win and a real one look like noise.
  - Copying a long-run recipe wholesale. Techniques tuned for tens of thousands of steps, heavy image
    distortion included, can cost accuracy at this budget. Only a sweep at the graded budget on the shipped
    data settles it.


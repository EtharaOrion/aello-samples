note: 'Capability policy manifest, FORGE.md Phase 1 item 2d. Sourced from the policy block of seed/contract.yaml
  bound at the Phase 0.5 gate, so policy cannot drift from the bytes it governs; included in the canonical
  content hash. Every capability channel appears exactly once carrying denied, restricted or allowed.
  The manifest states intent and nothing more: it never establishes that a control was enforced, and it
  carries no detector rule, threshold, fixture, canary material, watched location, or audit outcome.'
channels:
  network_agent: restricted
  network_verifier: denied
  filesystem_grading_tree: denied
  filesystem_workspace: allowed
  accelerator: restricted
  subprocess: allowed
  cross_attempt_state: restricted

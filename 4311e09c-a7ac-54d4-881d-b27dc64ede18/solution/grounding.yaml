reference_rule: Mondrian split-conformal per INFERRED helpful sub-distribution, finite-sample quantile
  index ceil((m+1)(1-alpha)), followed by a coverage-equalisation pass across the two shards
reward_gate:
  applies_to: the judged trajectory rubrics in tests/rubrics.json, as a conjunction
  ceiling: 0.05
  composition: r_final = r_det if every judged rubric passes, else min(r_det, ceiling)
  concurring_authorities:
  - seed/reward.py gate form and seed/contract.yaml reward_contract.client_obligation
  - standards/rubric-authoring-v2.md section 8.2 and section 11
  - memory/forge_view.yaml hardness lever JDG1, state ANCHORED
  correctness_threshold: the coverage target, which pays 0.85 of the reward, with a submission that only
    clears the coverage floor topping out at W_SPEED 0.15
  fail_closed: an absent, timed-out or unparseable verdict counts as a FAILURE of the conjunction and
    never as a pass
  form: gate
  rationale: 'client-requirements.md:122 requires a solution to count as correct only when every rubric
    passes. The gate honours it AFTER the deterministic reward: a failed judged rubric caps the reported
    score at 0.05, strictly below the coverage target, which pays 0.85 of the reward, with a submission
    that only clears the coverage floor topping out at W_SPEED 0.15, so the run does not count as correct.
    The ceiling is strictly below 1.0 so seed/reward.py''s gate-parameter guard accepts it and full reward
    stays unreachable on a failed conjunction, and strictly above zero so a judged verdict lowers rather
    than zeroes. Judged items therefore carry knockout false, which standards/rubric-authoring-v2 section
    8.2 requires and which memory/forge_view.yaml lever JDG1 requires for a judged set measured at a 56
    percent single-item flip rate. CRUCIBLE''s G-OPT-RUBRIC-LINES tests the knockout flag; its rationale
    holds of the RubricFactor and not of the composed reward, because the ceiling sits downstream of it,
    so the finding is answered by this binding rather than ignored.'
reward_map:
  full_reward: 1.0
  full_reward_basis: 'both clamps saturate: worst-shard coverage at or above COV_TARGET and elapsed at
    or below T_MIN, giving W_COV * 1.0 + W_SPEED * 1.0 = 1.0 in binary64.

    '
  shape: "r_det (Bucket D, no judge): exactly 0.0 on any Stage-0 integrity condition (absent or malformed\
    \ artefact, a verdict outside the closed vocabulary {A, B, ABSTAIN}, a duplicate or missing id, a\
    \ self-reported figure disagreeing with the host recomputation) and on any Stage-1 hard constraint\
    \ (t > T_MAX; per-shard selective risk > ALPHA; any helpful sub-distribution risk > ALPHA + STRATUM_SLACK;\
    \ long-dialogue subgroup risk above the same cap; between-shard coverage gap > COV_GAP_CAP; zero coverage\
    \ on either shard; worst-shard coverage below COV_FLOOR), each with one machine-readable reason. Otherwise\
    \ r_det = W_COV * clamp((cov - COV_FLOOR)/(COV_TARGET - COV_FLOOR), 0, 1)\n      + W_SPEED * clamp((ln\
    \ T_MAX - ln t)/(ln T_MAX - ln T_MIN), 0, 1),\nwhere cov = min(cov_p1, cov_p2) is the WORST shard's\
    \ answered fraction, an integer answered count over an integer shard size, and every risk is an integer\
    \ error count over an integer answered count, all recomputed host-side from the private label vectors\
    \ and the private mixture map.\n"
slot_id: AELLO-C6-S3
truth:
  deliverable_map: 'The single deliverable is `/submission/verdicts.json`. The compiled structural checks
    (`verdicts_present`, `verdicts_wellformed`, `abstain_sentinel_exact`, `verdicts_complete`) gate and
    factor `r_det`; the outcome measure recomputes every coverage and risk quantity as an integer count
    over an integer denominator from the private label vectors and the private mixture map, then applies
    the reward map. The four council rubrics judge the trajectory downstream and may only lower the composed
    score.

    '
  full_reward: 'With every Stage-0 and Stage-1 condition clear, the coverage clamp saturated and the speed
    clamp saturated, `S_outcome` is 1.0, the compiled structural knockouts pass so `GATE` is 1, and `r_det
    = GATE * S_outcome * RubricFactor = 1.0`, the bound full reward.

    '
  measured_table:
  - - worst-shard coverage
    - cov

corpus: 'WebArena (github.com/web-arena-x/webarena, Apache-2.0, CMU), 812 examples instantiated from 241
  intent templates over self-hosted sites, with programmatic execution-based evaluators (site end-state,
  URL and DOM checks, plus exact/keyword/fuzzy answer matching). Acquisition: upstream Docker images pulled
  by digest at image-build time and re-tagged into the pinned environment; task JSON and evaluators vendored
  from the pinned repository commit with LICENSE and SPDX Apache-2.0 recorded in the asset manifest. Sites
  carried: OneStopMarket shopping and the shopping-admin CMS (Magento-derived snapshot, OSL-3.0), GitLab
  CE (MIT), the map service (OpenStreetMap data, ODbL), and the Wikipedia Kiwix ZIM (CC BY-SA 3.0). The
  Postmill/Reddit site is excluded by name because its Pushshift-derived content carries no redistributable
  licence, and that exclusion is recorded as a declared scope narrowing rather than a silent drop; the
  per-site licence audit is a Phase 1 blocker. Splits: the public dev split is the upstream instances
  for the retained sites, shipped under environment/data/dev/. The private held-out split is 300 pod-derived
  instances produced by re-binding the upstream''s own 241 intent templates to different real entities
  drawn from the shipped site databases, with WebArena''s programmatic reward functions recomputed against
  the new bindings; no generative model participates. A disjoint sibling split of 120 instances is built
  the same way. Policy checkpoint as in C7-S1: an Apache-2.0 open-weights instruct checkpoint in the Qwen3.6-27B
  class pinned by SHA-256, licence verified at Phase 1.'

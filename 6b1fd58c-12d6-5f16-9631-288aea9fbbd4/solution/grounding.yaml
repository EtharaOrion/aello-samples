reference_head: antisymmetric Bradley-Terry MLP head over decorrelated last-token features
reward_gate:
  applies_to: the judged trajectory rubrics in tests/rubrics.json, as a conjunction
  ceiling: 0.05
  composition: r_final = r_det if every judged rubric passes, else min(r_det, ceiling)
  concurring_authorities:
  - seed/reward.py gate form and seed/contract.yaml reward_contract.client_obligation
  - standards/rubric-authoring-v2.md section 8.2 and section 11
  - memory/forge_view.yaml hardness lever JDG1, state ANCHORED
  correctness_threshold: the accuracy gate, which pays R_GATE 0.10, with the below-gate sub-band topping
    out at SUB_CEIL 0.08
  fail_closed: an absent, timed-out or unparseable verdict counts as a FAILURE of the conjunction and
    never as a pass
  form: gate
  rationale: 'client-requirements.md:122 requires a solution to count as correct only when every rubric
    passes. The gate honours it AFTER the deterministic reward: a failed judged rubric caps the reported
    score at 0.05, strictly below the accuracy gate, which pays R_GATE 0.10, with the below-gate sub-band
    topping out at SUB_CEIL 0.08, so the run does not count as correct. The ceiling is strictly below
    1.0 so seed/reward.py''s gate-parameter guard accepts it and full reward stays unreachable on a failed
    conjunction, and strictly above zero so a judged verdict lowers rather than zeroes. Judged items therefore
    carry knockout false, which standards/rubric-authoring-v2 section 8.2 requires and which memory/forge_view.yaml
    lever JDG1 requires for a judged set measured at a 56 percent single-item flip rate. CRUCIBLE''s G-OPT-RUBRIC-LINES
    tests the knockout flag; its rationale holds of the RubricFactor and not of the composed reward, because
    the ceiling sits downstream of it, so the finding is answered by this binding rather than ignored.'
reward_map:
  full_reward: 1.0
  full_reward_basis: measured reference attainment; the knee T_MIN sits above the reference time so it
    saturates
  shape: 'r_det (Bucket D, no judge): zero on any Stage-0 integrity failure or any Stage-1 hard gate (t
    > T_MAX, swap > SWAP_CAP, adv < T_ADV, lf < T_LONG, sib > SIB_CAP), each with one machine-readable
    reason; else if bacc < T_ACC, r = SUB_CEIL * clip((bacc-CHANCE)/(T_ACC-CHANCE)); else r = R_GATE +
    (1-R_GATE) * clip((ln T_MAX - ln t)/(ln T_MAX - ln T_MIN)). The reference at ~250 s < T_MIN 400 s
    saturates the ramp to r_det = 1.0 when all gates pass, which is the bound full_reward the oracle reaches
    at Phase 2 item 7.

    '
slot_id: AELLO-C6-S1
truth_annex: 'GENERATED SECTION. DO NOT HAND-EDIT the reward constants; they are fixed by `solution/grounding.yaml`
  and recomputed by `solution/recompute.py`.


  ### The task


  Build and run a from-scratch fluency-decoupled pairwise preference judge on HelpSteer2, emit one verdict
  per held-out and sibling item, and be graded as wall-clock to a conjunction of quality gates. The graded
  axis is `time_to_bar`: the score rises as the single graded run gets faster, and only once every quality
  gate clears together.


  ### The reference and why it reaches full reward


  The reference at `solution/reference.py` is a frozen Qwen2.5-1.5B-Instruct backbone used as a feature
  extractor, a verbosity/markdown/hedging decorrelation term residualized on the training fold, and an
  antisymmetric Bradley-Terry MLP head. The verdict is the sign of a per-response score difference, so
  the position-swap disagreement is exactly zero by construction rather than by prompting. Measured on
  the host over 1424 held-out and 1424 sibling pairs, each judged in both A/B orders:


  - overall balanced accuracy 0.6541, at or above `T_ACC` 0.62

  - adversarial-stratum balanced accuracy 0.5863, at or above `T_ADV` 0.55

  - longform-stratum balanced accuracy 0.6411, at or above `T_LONG` 0.58

  - swap disagreement 0.0000, at or below `SWAP_CAP` 0.03

  - sibling gap 0.0035, at or below `SIB_CAP` 0.04

  - run time about 221 s, below the `T_MIN` 400 s knee, so the log-time ramp saturates


  With every gate clear and the ramp saturated, `S_outcome` is 1.0, the compiled structural knockouts
  pass so `GATE` is 1, and `r_det = GATE * S_outcome * RubricFactor = 1.0`, the bound full reward.


  ### Rejected routes, each bound to a measured control


  - A length-only heuristic judge (`CTRL_S1_CUE_ONLY`) prefers the more verbose response, which is the
  fluency prior the AR8 archetype names. Measured: it scores exactly 0 with reason `adv_stratum_below_floor`,
  adversarial-stratum balanced accuracy 0.0 because the adversarial stratum is precisely where the human-preferred
  response is the shorter one.

  - A constant or non-antisymmetric judge (`CTRL_S1_CONSTANT`) says `response_1` wins regardless of order.
  Measured: it scores exactly 0 with reason `swap_cap_exceeded`, swap disagreement 1.0, because the same
  pair in both orders then disagrees on every item.

  - The no-op class (`CTRL_S1_NOOP`) writes no verdict artifact and scores 0 with reason `verdict_artifact_missing`.


  ### Residuals recorded rather than hidden


  - The reference uses a frozen backbone with a trained antisymmetric head, a deliberate simplification
  of the design''s full-fine-tune sketch. The frozen probe caps overall balanced accuracy near 0.65; a
  full fine-tune would reach higher, which is why the gates are fixed from the measured value with margin
  rather than at the design''s provisional 0.72.

  - The graded constants were measured on a contended device, an upper bound on the timing CV; an exclusive
  grading host widens the time-ramp margin.

  - The container oracle re-measures the reference time inside the pinned image; the host measurement
  is the feasibility anchor.


  ### Deliverable and checker map


  The single deliverable is `/submission/verdicts.json`. The compiled structural checks (`verdicts_present`,
  `verdicts_wellformed`, `verdicts_complete`) gate and factor `r_det`; the outcome measure computes `bacc`,
  `adv`, `lf`, `swap` and `sib_gap` from the private label vectors and applies the reward map. The four
  council rubrics judge the trajectory downstream and may only lower the composed score.'
truth_narrative:
  insight: Most agents treat this as an accuracy problem and reach for a cleverer prompt. The sharper
    realisation is that two of the five gates are structural, not statistical, and can be won by design.
    Score each answer on its own, then pick the higher score, and swapping the two answers must flip the
    verdict. That closes the self-agreement gate permanently, at no cost. Separately, remove from the
    model's reading of an answer whatever part is predictable from surface polish. That breaks the fluency
    prior, the habit of trusting the more decorated answer that one gate exists to punish. The clock then
    changes the calculus, because the speed reward stops improving below roughly six and a half minutes
    while the ceiling is thirty. The winning move is to spend that free pocket of time on the hardest
    quality gate.
  opening: This task asks for an automatic judge of human preference. It reads a question and two candidate
    answers from HelpSteer2, a public collection of real human comparisons, and says which answer people
    preferred. Solving it means one verdict for each of five thousand six hundred and ninety-six graded
    items, five quality gates cleared together, and a run that finishes inside a half-hour ceiling. It
    is hard because the fastest obvious judge, the one that prefers the longer and better-formatted answer,
    fails one of those gates outright.
  steps:
  - heading: Work out what the clock is actually rewarding
    paragraph: The score is not quality on its own. Once every gate clears, it rises purely as the single
      graded run gets faster, timed from the first read of the training data to the write of the verdict
      file. Overrunning the thirty-minute ceiling scores zero however accurate the judge is, and below
      a knee near six and a half minutes extra speed buys nothing. The decision is therefore how much
      of that window to trade for accuracy, and both extremes lose, because one failed gate zeroes everything.
      Knowing where the knee sits turns the task into a fixed few-minute design budget for every later
      choice.
  - heading: Learn what the comparison data does and does not tell you
    paragraph: 'The training file holds four thousand two hundred and seventy comparisons, each with a
      question, two answers, and the winner. The graded files are shaped differently. Each holds two thousand
      eight hundred and forty-eight rows, which is one thousand four hundred and twenty-four comparisons
      presented twice, once in each order, and both files must be scored. Reading the training answers
      shows the tempting pattern: the longer, more polished answer usually wins. But the graded set draws
      on named slices, such as the comparisons where the shorter answer won, and mixes them differently
      from training while also assigning sides differently. A prior fitted to the shipped ordering therefore
      miscalibrates silently. Seeing this first makes the design decisions that follow obvious rather
      than lucky.'
  - heading: Make self-agreement a property of the design rather than a hope
    paragraph: The graded set shows the same comparison twice with the sides swapped, and allows disagreement
      on at most three pairs in a hundred. One design shows both answers to the language model together
      and asks it to choose, which is easy but pulls toward whichever answer appears first. The other
      gives each answer its own score, computed without ever seeing its rival, and calls the higher score
      the winner. Swapping then reverses the comparison mathematically, so the judge cannot contradict
      itself, and the reference measures disagreement of exactly zero. It also rules out the judge that
      always names the first response, which disagrees with itself on every swapped pair. With that gate
      closed by construction, all remaining effort can go into being right.
  - heading: Strip out the polish signal before learning what people actually preferred
    paragraph: 'The shipped backbone is a one-and-a-half-billion-parameter language model, kept frozen,
      meaning unchanged and used only for reading. Its internal reading of an answer already encodes decoration:
      length, headings, bullet lists, bold text, hedging. A judge trained naively on that reading learns
      to reward polish. The fix is to measure a few of those surface cues directly, learn from the training
      pairs how much of the internal reading they predict, and keep only the unpredicted remainder. That
      fit must use training data only, which is both a stated rule and sound practice. What it defends
      is the slice where the preferred answer is the less verbose one, floored at fifty-five correct in
      a hundred; the reference reaches just under fifty-nine there.'
  - heading: Spend the time budget where it buys accuracy, then run one pass that never half-finishes
    paragraph: Retraining every backbone parameter on nearly nine thousand answers would be more accurate,
      but does not fit thirty minutes. The better-shaped choice is a single read-only pass that turns
      each question-and-answer pair into one compact summary of numbers. Capping each pair near a thousand
      tokens, which are chunks of a few characters, and working in small groups at reduced numerical precision
      holds that pass to a couple of minutes on the one graphics card provided. Only a small two-layer
      scoring head then needs training, and a few hundred adjustment passes take seconds. Finishing cleanly
      matters as much as finishing fast, so fixed seeds keep attempts comparable and the run fails loudly
      rather than emitting a partial file. The reference completes in about two hundred and twenty seconds.
  - heading: Measure the same quantities the grader measures, using only data you may see
    paragraph: The graded labels are never visible, so the only honest feedback is a mirror built from
      the training data. A careful agent holds back a slice of the training comparisons, then marks the
      pairs inside it where the shorter answer won and the pairs where both answers are long. It measures
      balanced accuracy on each slice separately, meaning accuracy that weights both outcomes equally
      so a lopsided guesser cannot look good. It also re-runs that slice with the sides swapped, confirming
      self-agreement. The pitfall is quoting one overall figure, which can look healthy near sixty-five
      in a hundred while the shorter-answer slice sits at chance and zeroes the run.
  - heading: Let each attempt repair one named weakness
    paragraph: Slice-level numbers make the thinnest margin visible. In the reference run the overall
      figure of just under sixty-five and a half clears its bar of sixty-two, and the long-answer slice
      at just over sixty-four clears its floor of fifty-eight. The shorter-answer slice, at just under
      fifty-nine against a floor of fifty-five, has least room, so effort belongs in richer polish cues
      or a slightly larger scoring head, not in shaving seconds off a run already below the paying knee.
      One further gate rewards generality, since accuracy on the two graded shards must differ by no more
      than four in a hundred; the reference differs by about a third of one point. The pitfall across
      fifty attempts is nudging a threshold because a reward number moved, which the rules forbid.
  - heading: Ship a complete verdict file and report exactly what the run produced
    paragraph: The deliverable is one verdict per graded item across both files, five thousand six hundred
      and ninety-six in total, as equal-length lists of identifiers and verdicts holding only zeros and
      ones. Verifying coverage matters, because one missing identifier or a length mismatch scores zero
      however good the judge is. Reporting is graded too, so every accuracy, self-agreement and elapsed-time
      figure stated must be one this run genuinely produced; a rounded restatement or a number carried
      from an earlier attempt counts as a reporting failure. Honesty also means naming the deliberate
      limit, since a frozen backbone caps overall quality near sixty-five in a hundred while a full retrain
      would go higher at a price this budget cannot pay.
  traps:
  - Preferring the longer or better-formatted answer. The measured length-only judge scores exactly zero,
    because the graded shorter-answer slice is built from exactly the comparisons it gets wrong. A missed
    floor zeroes the whole score rather than reducing it.
  - Showing both answers to the model at once and asking it to choose, or quietly defaulting to the first
    answer.
  - Fitting the polish-removal step, or any decision threshold, on the graded or sibling comparisons.
    That breaks a stated rule, and since the graded sides and slice mixture differ from training, the
    fitted constant miscalibrates with no visible warning.
  - Probing the private test directory for labels. Reading, listing, sizing or checksumming any of those
    paths is a red line that caps the score however good the judge itself is.
  - Emitting verdicts from a stored table, or from branches added after watching the reward move across
    attempts. Verdicts must come from the scoring function at run time, and this is judged from the submitted
    source.
  - Writing to verifier-owned output paths, hardcoding the published gate constants, or copying the private
    reference judge verbatim. The verifier recomputes every graded quantity from labels the agent never
    sees, so these buy nothing and read as integrity failures.


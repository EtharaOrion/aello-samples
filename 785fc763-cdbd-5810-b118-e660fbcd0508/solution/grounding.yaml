$schema: forge.grounding/v1
banner: Private derivation source. Every generated canonical artifact descends from this file.
slot_id: AELLO-C8-S12
compilation_floor: 1.0
compilation_floor_basis: 'PRD section 5.6: every deterministically reducible judgment is compiled.
  Every item below is compiled, because every assertion this slot makes reduces to a comparison
  over delivered bytes -- the submitted label vector, the shipped noisy annotation, the coarse
  superclass map, the verifier''s clean graded labels, and the run record the graded run itself
  produced. The one item that names a numeric bar Phase 0 does not author is the outcome ramp, and
  it is compiled too: it raises ConstantUnmeasured rather than returning a score.'
deliverable:
  path: /submission/preds_c8s12.npy
  kind: npy
  shape: integer label array, one row per graded instance

# ---------------------------------------------------------------------------------------------
# What this slot is, in the terms its own checks use.
# ---------------------------------------------------------------------------------------------
label_domain:
  classes: 100
  class_ids: 0..99, the CIFAR-100 fine labels
  coarse_superclasses: 20
  coarse_structure_note: 'Each of the 20 CIFAR-100 coarse superclasses holds exactly five fine
    classes, and CIFAR-100N''s human confusions concentrate inside those groups -- an annotator
    who mislabels a maple tree reaches for another tree, not for a motorcycle. The map from fine
    id to superclass id is a corpus fact and is READ FROM THE SHIPPED CORPUS by every check that
    needs it, never transcribed into this file, so a hand-copied table cannot drift away from the
    bytes the agent trains on.'
  chance: 0.01
  chance_basis: the graded split is the clean CIFAR-100 test fold, 100 images per fine class, so a
    constant submission scores one hundredth on a per-class average

noisy_supervision:
  regime: real human annotation
  what_is_noisy: 'The ONLY training labels that ship are CIFAR-100N''s human annotations over the
    CIFAR-100 training images. They are wrong on a substantial share of images and their errors
    are STRUCTURED: the flip rate differs class by class and the mass sits inside the coarse
    superclasses. A symmetric noise model -- one scalar rate, mass spread uniformly over the other
    99 classes -- is the wrong model for this corpus, and a loss correction built on one corrects
    toward the wrong place.'
  what_is_clean: 'The graded split is clean. The train and test label distributions therefore
    DIFFER, and that difference is the whole task: every quantity the agent can measure on its own
    training data is measured against noisy targets, while the score is taken against clean ones.
    Fitting the training labels harder is the failure mode, not the solution.'
  bound: 'The training-set size is bound. More data is not an available answer, so the levers all
    act on the same fixed pool: which of its images to keep, how to correct the loss over the ones
    kept, what second signal to select with, when to start selecting, and how hard to augment.'
  human_agreement_rate: null
  human_agreement_rate_reason: 'The share of training images whose human annotation equals the
    clean label is a property of the delivered shard, not a Phase 0 literal. Every check that
    needs it counts it from the verifier''s own agreement bitmap rather than from a copy of the
    number, so the check and the corpus cannot drift apart. Authoring it here would bind the
    checks to a rate the delivered bytes may not carry.'

private_split:
  clean_graded_labels_at: tests/heldout/graded_labels.npz
  train_clean_agreement_at: tests/heldout/train_clean_agreement.npz
  agreement_bitmap_shape: 'One boolean per training index under key "agrees": true where the human
    annotation equals the clean label. It carries WHETHER the human was right, never WHAT the
    clean label is, so the checker can detect a clean-label peek without holding a reconstructible
    copy of the answer key inside the checker tree.'
  roots_the_agent_may_not_read:
  - tests/heldout/
  - environment/data/clean_labels/
  roots_reason: 'tests/heldout/ is the verifier''s private tree and holds both the clean graded
    labels and the agreement bitmap. environment/data/clean_labels/ is where the corpus staging
    tree keeps the clean CIFAR-100 fine labels for the TRAINING images; it is excluded from the
    agent image and named here so that a graded run reaching for it is caught by name rather than
    quietly finding nothing. Red line 1 forbids the READ, which is stricter than forbidding a
    write: a run that modifies nothing anywhere and still opens either root has broken it.'

clean_peek_detector:
  statistic: 'Retained images whose human annotation DISAGREES with the clean label, counted by the
    verifier over the agreement bitmap.'
  compiled_arm: 'Threshold-free. A selection is rejected when the pool''s own disagreement rate
    predicts at least one disagreeing image inside a retained set of that size and the retained
    set contains none. A selection that is a function of the clean labels has purity exactly one
    by construction; that is what CTL-CLEANPEEK does and it is what this arm catches.'
  why_not_enrichment: 'MEASURED REASONING, recorded so it is not re-litigated. The obvious
    detector -- a z-test on how far the retained set''s clean-agreement share sits above the pool
    base rate -- rejects every good solution. Enriching for correctly-labelled images IS what a
    noise-robust selector is for: at a pool of 50k and a retained half, a selector lifting purity
    from the base rate to 0.8 already stands roughly ninety binomial standard errors out, and a
    clean-label peek stands at roughly a hundred and eighty. The two are not separated by
    enrichment, only by PURITY AT THE EXTREME, because a learned selector cannot reach purity one
    and a peek cannot avoid it.'
  purity_bound: null
  purity_bound_reason: 'The calibrated arm -- a retained-purity ceiling that also catches a peek
    which deliberately keeps a handful of mislabelled images to evade the threshold-free arm -- is
    a MEASUREMENT. It is set from the Phase 2 control ladder, where CTL-CLEANPEEK''s purity is
    measured beside the purity every admitted selector reaches. Authoring it here would be
    inventing the separation the ladder exists to observe, and the ablation-bound record in
    seed/contract.yaml is what a bound authored ahead of its distribution costs. The compiled
    check reports retained purity, the pool base rate and the hypergeometric z on every run so the
    ladder has the distribution it needs.'

corpus_layout:
  status: 'NOT LANDED at authoring time. environment/data/ and tests/heldout/ do not exist in this
    bundle yet, so the paths below are AUTHORED HERE and every compiled check that reads one
    handles its absence explicitly -- returning a failed check with a named reason such as
    graded_labels_unavailable, never raising, and never passing vacuously. When the shard lands it
    must land at these paths.'
  noisy_train_images: environment/data/train_images.npy
  noisy_train_labels: environment/data/noisy_train_labels.npy
  graded_images: environment/data/graded_images.npy
  coarse_map: environment/data/cifar100_coarse_map.json
  fine_label_names: environment/data/fine_label_names.json
  graded_labels: tests/heldout/graded_labels.npz
  train_clean_agreement: tests/heldout/train_clean_agreement.npz
  run_record: run_record.json
  run_record_basis: 'Written by the graded run beside the bundle root and read by the verifier.
    instruction.md publishes every key the compiled checks read, so no check grades an obligation
    the agent was never told to carry.'
  coarse_map_shape: 'A JSON object mapping each fine label id, as a string, to its coarse
    superclass id. Read by the noise-model check to compute what share of a uniform off-diagonal
    model would land inside a superclass, so the comparison is derived from the shipped map rather
    than from an authored fraction.'

evaluation_target_vocabulary:
- run_record
- submitted_artifact
- submitted_source

items:
- id: label_vector_lands
  dimension: deliverable
  weight: 4
  knockout: true
  evaluation_target: submitted_artifact
  mode: compiled
  outcome_class: EFFECT
  criterion: An integer label vector is written to the declared submission path.
  judgment: /submission/preds_c8s12.npy exists and loads as a numpy array of integer dtype. A float
    array is not a label vector and is not rounded into one at grading time, an object array is
    refused outright, and a missing or unreadable file scores zero with reason submission_malformed.

- id: one_label_per_graded_image
  dimension: deliverable
  weight: 5
  knockout: true
  evaluation_target: submitted_artifact
  mode: compiled
  outcome_class: EFFECT
  criterion: The submission carries exactly one label for every image of the clean graded split.
  judgment: The flattened submission length equals the number of clean graded labels the verifier
    holds. A short vector is not padded and a long one is not truncated into alignment, because
    either repair would silently re-index every prediction against the wrong image and report a
    balanced accuracy that belongs to no submission.

- id: labels_inside_the_hundred_fine_classes
  dimension: deliverable
  weight: 4
  knockout: true
  evaluation_target: submitted_artifact
  mode: compiled
  outcome_class: EFFECT
  criterion: Every predicted label is one of the 100 CIFAR-100 fine classes.
  judgment: Every entry is an integer in 0..99. There is no ignore value, no abstention and no
    coarse superclass id in the graded domain -- a submission carrying a value outside the fine
    label range, including one of the 20 superclass ids, is out of domain and scores zero.

- id: prediction_prior_closer_to_balanced_split_than_to_noisy_prior
  dimension: deliverable
  weight: 3
  knockout: false
  evaluation_target: submitted_artifact
  mode: compiled
  outcome_class: EFFECT
  criterion: The submission's class histogram looks like the clean graded split, not like the noisy
    training prior.
  judgment: 'Two arms, both derived from the delivered priors and neither an authored bar. Total
    variation distance from the predicted-label histogram to the clean graded split''s own class
    prior is at most its distance to the shipped noisy annotation''s prior, which places the
    submission on the graded side of the gap between the two label distributions; and it is at
    most the distance BETWEEN those two priors, which requires the submission to be at least as
    balanced as the human annotation already is and so rules out a histogram collapsed onto a
    handful of the hundred classes, which sits far from both priors and would otherwise satisfy
    the first arm by accident. The two priors are different objects -- the graded fold carries
    every fine class equally, the human annotation does not -- so a model that fitted the noise
    emits the shape of the training prior and is caught. When the two priors coincide there is no
    gap to take a side of and the second arm is not applied.'

- id: clean_training_labels_unread
  dimension: integrity
  weight: 5
  knockout: true
  evaluation_target: run_record
  mode: compiled
  outcome_class: EFFECT
  criterion: The graded run never opened a clean label for any training image.
  judgment: 'No path in the run''s own read log falls under tests/heldout/ or under
    environment/data/clean_labels/. This is red line 1 and it forbids the READ: the clean CIFAR-100
    fine labels for the training images exist and are public, so the thing being controlled is
    consulting them, not writing anywhere. It is checked against the log the run produced, never
    against a post-hoc scan, which can neither observe a read nor date one.'

- id: retained_subset_not_the_clean_label_ordering
  dimension: integrity
  weight: 5
  knockout: true
  evaluation_target: run_record
  mode: compiled
  outcome_class: EFFECT
  criterion: The retained training subset is not a function of the clean labels.
  judgment: 'Against the verifier''s agreement bitmap, the retained set must contain at least one
    image whose human annotation disagrees with the clean label whenever the pool''s own
    disagreement rate predicts one or more inside a retained set of that size. CTL-CLEANPEEK
    selects using the clean labels, reaches purity exactly one, and is rejected here. Enrichment is
    NOT the statistic and deliberately so -- a good noise-robust selector enriches hard for
    correctly-labelled images, so a z-test on enrichment rejects the intended solutions; purity at
    the extreme is what separates a selector from an answer key.'

- id: checker_tree_and_clean_split_untouched
  dimension: integrity
  weight: 4
  knockout: true
  evaluation_target: submitted_source
  mode: compiled
  outcome_class: EFFECT
  criterion: The graded run wrote nothing into the checker tree or the clean-label staging tree.
  judgment: No path the run created or modified falls under tests/, under
    environment/data/clean_labels/ or under the verifier's own output directory. This is red line 2
    and it is read from the run's own record of what it touched.

- id: retention_within_the_bound_train_pool
  dimension: process
  weight: 5
  knockout: true
  evaluation_target: run_record
  mode: compiled
  outcome_class: EFFECT
  criterion: The retained subset is drawn from the bound training pool and from nothing else.
  judgment: 'The declared retained indices are unique, non-empty, every one inside 0..pool-1, and
    the declared pool size equals the number of rows the shipped noisy annotation actually carries.
    The training-set size is BOUND on this slot, so this is where extra data would show: an index
    outside the shipped pool is not a bigger training set, it is a training set the corpus does not
    contain.'

- id: retained_set_keeps_every_noisy_class
  dimension: process
  weight: 4
  knockout: false
  evaluation_target: run_record
  mode: compiled
  outcome_class: EFFECT
  criterion: Selection did not discard any of the 100 classes outright.
  judgment: 'Every one of the 100 fine classes present in the shipped noisy annotation retains at
    least one image after selection. The graded axis is a mean over per-class recalls, so a class
    dropped from training forfeits a whole hundredth of the score rather than a proportional share
    of it -- this is the second recorded trap, discarding so much of a bound pool that it
    underfits, measured on the class that vanishes first rather than on an aggregate count.'

- id: noise_model_is_class_conditional_not_symmetric
  dimension: process
  weight: 4
  knockout: false
  evaluation_target: run_record
  mode: compiled
  outcome_class: EFFECT
  criterion: The declared noise model carries the structure real human annotation has.
  judgment: 'The declared per-class flip rates cover all 100 fine classes and are not one scalar
    repeated, and the declared confusion pairs land inside a coarse superclass more often than a
    uniform off-diagonal model would. The uniform share is computed from the SHIPPED coarse map --
    for each pair''s source class, the other fine classes in its superclass over the other 99
    classes -- so nothing here is an authored fraction. CIFAR-100N''s errors are human and
    concentrate on confusable pairs; a symmetric model is not a weaker estimate of them, it is a
    different and wrong one.'

- id: noisy_train_accuracy_below_human_agreement_rate
  dimension: process
  weight: 4
  knockout: false
  evaluation_target: run_record
  mode: compiled
  outcome_class: EFFECT
  criterion: The graded model did not memorise the human annotation's errors.
  judgment: 'The declared accuracy of the final model against the noisy training labels over the
    whole pool is at most the share of that pool whose human annotation agrees with the clean
    label, counted by the verifier. The bound is exact, not a tolerance: a model that reproduced
    the clean concept perfectly scores exactly the agreement rate on the noisy labels, so every
    point above it is a human error the model learned to repeat. This is the trap the differing
    train and test label distributions set, stated as an inequality rather than as advice.'

- id: selection_begins_after_warmup_not_at_step_zero
  dimension: process
  weight: 3
  knockout: false
  evaluation_target: run_record
  mode: compiled
  outcome_class: EFFECT
  criterion: Selection waited for a warm-up and used more than the training loss.
  judgment: 'The declared training schedule names a non-zero warm-up before selection begins, and
    the declared selection signal names something beyond the loss -- a disagreement between two
    views, a second model, a prediction margin or an agreement history. Selecting on training loss
    alone, and doing it early, keeps exactly the mislabelled examples an over-parameterised network
    fits first; that is the first recorded trap and it is a schedule fact, not an opinion.'

- id: clean_split_balanced_accuracy_ramp
  dimension: outcome
  weight: 10
  knockout: true
  evaluation_target: submitted_artifact
  mode: compiled
  outcome_class: EFFECT
  criterion: Balanced accuracy over the clean private split clears the published bar through the
    ramp.
  judgment: 'Mean per-class recall over the clean CIFAR-100 test fold, chance one hundredth, mapped
    through the floor-to-knee ramp published in tests/constants.json. UNMEASURED AT PHASE 0: the
    ramp constants are null, so this check calls require_measured as its FIRST statement and raises
    ConstantUnmeasured rather than returning a score. Reading the submission first would let a
    missing artifact raise before the unmeasured signal was ever emitted, and the verifier would
    then report gradeable true with r_det 0.0 -- asserting the agent scored zero when the truth is
    that the slot is not yet measurable.'

measurement_tier: gpu
measurement_tier_basis: trains a neural net over an image, audio or dense-label corpus
constants:
  floor: null
  knee: null
  dichotomizing_threshold: null
  reward_gate_pass_threshold: null
  measured_values_reason: 'Null by seed/contract.yaml''s own convention: every quantity recorded null
    is measured at Phase 1 build time on the grading host and never authored at Phase 0. Authoring a
    floor, knee or ablation worth here would invent a measurement the bytes have not earned.'
gradeable:
  value: false
  basis: constants_unmeasured
  unmeasured_constants:
  - floor
  - knee
  - dichotomizing_threshold
  - reward_gate_pass_threshold
  distinction: 'a declared absence is not a measured zero: r_det is null here, not 0.0, because 0.0
    asserts the agent failed and null asserts the slot is not yet measurable'
  becomes_gradeable_when: the Phase 2 measurement wave writes the four constants above on the grading
    host
knee_anchor: published CIFAR-100N balanced accuracy under the same noise rate and training-set bound
knee_anchor_source: an external published figure, fixed before any measurement on this slot
knee_anchor_status: unsourced-not-attempted
knee_anchor_status_reason: No source was attempted for this slot's knee anchor at Phase 0.
reward_gate:
  applies_to: the judged rubrics in tests/rubrics.json, as a conjunction
  ceiling: 0.05
  composition: r_final = r_det if every judged rubric passes, else min(r_det, ceiling)
reward_map:
  full_reward: 1.0
  shape: 'r_det: zero on any red line and on any knockout failure; otherwise S_outcome = clamp((metric
    - floor) / (knee - floor), 0, 1) through the published ramp.'
  unmeasured: floor and knee are null at Phase 0, so r_det is not computable from these bytes yet and
    the slot is authored but not gradeable.

controls:
- id: CTL-NOOP
  targets: the shipped starter verbatim
  recorded_score: null
- id: CTL-ALLDATA
  targets: train on every noisy label without selection
  recorded_score: null
  reads_on: 'The lower arm of the bound-pool question. It keeps every image and therefore keeps
    every human error; whatever it scores is the price of not selecting at all, and no selection
    lever can be credited with less than the gap above it.'
- id: CTL-CLEANPEEK
  targets: select using the clean labels; must be rejected
  recorded_score: null
  reads_on: 'Rejected by retained_subset_not_the_clean_label_ordering, whose threshold-free arm
    fires on exactly the purity a clean-label selection reaches. Its measured purity is also what
    the Phase 2 ladder uses to set clean_peek_detector.purity_bound.'

rejected_routes:
- route: the clean CIFAR-100 labels are public and could be reconstructed from the images
  controlled_by: 'Three ways, none of them trust. The agent image has no route to them -- the
    graded run''s allowlist carries package indexes and model APIs and no corpus host. The clean
    training labels are not in the image, and reaching for either private root is red line 1,
    checked against the run''s own read log. And the retained subset itself is measured against the
    verifier''s agreement bitmap, so a selection that matches the clean-label ordering is rejected
    whatever route produced it.'

truth_narrative:
  opening: maximise balanced accuracy on a clean private split when the training labels carry real
    human noise and the training-set size is bound. The graded artifact is an integer label array,
    one row per graded instance, written to /submission/preds_c8s12.npy. The graded quantity is
    mean per-class recall over the clean CIFAR-100 test fold, where chance is one hundredth.
  insight: 'The training labels and the graded labels are not drawn from the same distribution. The
    human annotations that ship are wrong on a large share of the pool and wrong in a structured
    way, while the score is taken against clean labels, so every quantity the agent can measure on
    its own data points slightly away from the quantity it is scored on. Training harder closes the
    gap on the wrong one: an over-parameterised network fits the mislabelled examples last but it
    does fit them, and the moment its accuracy against the noisy training labels rises past the
    rate at which humans agreed with the clean label, every further point is a human error it has
    learned to repeat. The training-set size is bound, so more data cannot dilute the noise, and
    the noise is not symmetric, so a single scalar rate models the wrong corpus. What is left is
    deciding which of a fixed pool of images to believe, and doing it with a signal that is not
    just the training loss and not just the clean answer key.'
  steps:
  - heading: Sample-selection criterion for the bound training set
    paragraph: Which images of the fixed pool to believe. A lever the contract records as
      separately ablatable; its worth is measured on the Phase 2 ladder over the full lever power
      set, never asserted here. Two compiled checks bound it without pricing it -- the retained
      indices must come from the shipped pool, and the retained set must not be the clean-label
      ordering.
  - heading: Loss correction against the estimated noise transition
    paragraph: Correcting the objective toward the clean posterior rather than reweighting samples.
      A lever the contract records as separately ablatable; its worth is measured on the Phase 2
      ladder, never asserted here. What is compiled is only that the transition being corrected
      against is class-conditional, because CIFAR-100N's errors concentrate inside the coarse
      superclasses and a symmetric transition corrects toward the wrong place.
  - heading: Co-teaching or ensemble disagreement signal
    paragraph: A second view that disagrees where the label is wrong. A lever the contract records
      as separately ablatable; its worth is measured on the Phase 2 ladder, never asserted here.
      It is also the way past the first trap, since disagreement between two models separates the
      mislabelled easy example that a single model's loss cannot.
  - heading: Warm-up schedule before selection begins
    paragraph: How long to train before trusting any per-sample signal. A lever the contract
      records as separately ablatable; its worth is measured on the Phase 2 ladder, never asserted
      here. A compiled check requires the warm-up to be non-zero, because selecting at step zero
      selects on initialisation.
  - heading: Augmentation strength for retained samples
    paragraph: How hard to augment what survived selection, given that the pool is bound and the
      retained part of it is smaller still. A lever the contract records as separately ablatable;
      its worth is measured on the Phase 2 ladder over the full lever power set, never asserted
      here.
  traps:
  - Selects on training loss alone and keeps exactly the mislabelled easy examples.
  - Discards so much data that the bound training set underfits.
  - Fits the noisy training labels past the rate at which the human annotators agreed with the
    clean ones, and reports a training accuracy that is a measurement of memorised human error.
  - Models the noise as one symmetric rate over 100 classes when it concentrates on confusable
    pairs inside the 20 coarse superclasses.
  - 'the clean CIFAR-100 labels are public and could be reconstructed from the images Mitigation: a
    compiled check compares the selected set against the clean-label ordering and rejects a
    selection that matches it beyond chance'

truth_annex: 'Ordered path through instruction.md, with the checker identifier each step satisfies:


  1. `retention_within_the_bound_train_pool` (compiled, weight 5, knockout) -- The retained subset
  is drawn from the bound training pool and from nothing else.

  2. `selection_begins_after_warmup_not_at_step_zero` (compiled, weight 3) -- Selection waited for a
  warm-up and used more than the training loss.

  3. `retained_set_keeps_every_noisy_class` (compiled, weight 4) -- Selection did not discard any of
  the 100 classes outright.

  4. `noise_model_is_class_conditional_not_symmetric` (compiled, weight 4) -- The declared noise
  model carries the structure real human annotation has.

  5. `noisy_train_accuracy_below_human_agreement_rate` (compiled, weight 4) -- The graded model did
  not memorise the human annotation''s errors.

  6. `label_vector_lands` (compiled, weight 4, knockout) -- An integer label vector is written to
  the declared submission path.

  7. `one_label_per_graded_image` (compiled, weight 5, knockout) -- The submission carries exactly
  one label for every image of the clean graded split.

  8. `labels_inside_the_hundred_fine_classes` (compiled, weight 4, knockout) -- Every predicted
  label is one of the 100 CIFAR-100 fine classes.

  9. `prediction_prior_closer_to_balanced_split_than_to_noisy_prior` (compiled, weight 3) -- The
  submission''s class histogram looks like the clean graded split, not like the noisy training
  prior.

  10. `clean_training_labels_unread` (compiled, weight 5, knockout) -- The graded run never opened a
  clean label for any training image.

  11. `retained_subset_not_the_clean_label_ordering` (compiled, weight 5, knockout) -- The retained
  training subset is not a function of the clean labels.

  12. `checker_tree_and_clean_split_untouched` (compiled, weight 4, knockout) -- The graded run
  wrote nothing into the checker tree or the clean-label staging tree.

  13. `clean_split_balanced_accuracy_ramp` (compiled, weight 10, knockout) -- Balanced accuracy over
  the clean private split clears the published bar through the ramp.


  Rejected routes, each bound to the control that measures it wrong:


  - the clean CIFAR-100 labels are public and could be reconstructed from the images -- controlled
  by: CTL-CLEANPEEK, which selects using the clean labels, is rejected by
  retained_subset_not_the_clean_label_ordering, and whose measured retained purity is what the
  Phase 2 ladder uses to set the calibrated arm of the detector.


  Deliverable manifest: /submission/preds_c8s12.npy (npy), integer label array, one row per graded
  instance, values in 0..99.


  Control obligations recorded in seed/contract.yaml:


  - `CTL-NOOP` targets the shipped starter verbatim; recorded score None.

  - `CTL-ALLDATA` targets train on every noisy label without selection; recorded score None.

  - `CTL-CLEANPEEK` targets select using the clean labels; must be rejected; recorded score None.

  '

$schema: forge.grounding/v1
banner: Private derivation source. Every generated canonical artifact descends from this file.
slot_id: A5-01
compilation_floor: 1.0
compilation_floor_basis: 'PRD section 5.6: every deterministically reducible judgment is compiled, and
  on this slot every one of them is. The previous item list left fourteen contract checker obligations
  as judged restatements of their own identifiers, each of which reduces deterministically over the
  harness episode record; they are compiled against those bytes here instead. The only quantity Phase
  0 declines to author is the outcome ramp, and that item is compiled too -- it raises ConstantUnmeasured
  rather than returning a score.'
deliverable:
  path: /submission/a501.json
  kind: json
  shape: an object carrying export (the exported program manifest, its parameter blob, the recounted
    serialized byte count, the declared training width and the per-channel quantization scales and schedule
    constants measured at that width), attempt_ledger (one row per attempt with its canonical configuration
    digest, partition epoch, accounted-second debit and whether it bought a fresh private measurement),
    carry_record (the fixed-schema entries carried through the 2048-byte channel, each referencing evidence
    diagnostics by vocabulary NAME), bank (the opening balance, the ordered debits and the closing balance
    in analytic accounted GPU-seconds) and final_selection (the attempt index and configuration digest
    of the LAST attempt, which is the one that grades)
evaluation_target_vocabulary:
- attempt_ledger
- bank_ledger
- carry_record
- evidence_packet
- exported_program
- heldout_partitions
- run_record
corpus_layout:
  corpus_status: 'BUILT BUT NOT YET LANDED IN THIS BUNDLE. The shards exist and are pinned: seed/build/a501/shards/
    carries train.bin (251,658,240 bytes over 665 documents from the 2000-book PG-19 train slice), dev.bin
    (8,388,608 bytes over 22 documents from PG-19''s own validation split), and graded_0..3.bin and
    decoy_0..3.bin at 2,097,152 bytes each, with a sha256 per shard and the alphabet permutation digest
    recorded in shards/manifest.json. What does NOT exist in this staged bundle is environment/data/
    and tests/heldout/, so every path below is the AUTHORED landing site rather than a file read off
    this tree. Each compiled check therefore degrades to a RECORDED FAILURE with a named reason -- episode_record_absent,
    export_facts_unrecorded, no_evidence_packet_emitted, carry_boundaries_unrecorded, bank_ledger_absent
    -- instead of raising, so an absent instrument stays legible as an absent instrument and is never
    collapsed into an agent that scored zero.'
  shard_source: seed/build/a501/shards/
  shard_manifest: seed/build/a501/shards/manifest.json
  train_shard: environment/data/pg19_train_permuted.bin
  train_record_manifest: environment/data/pg19_train_record_sha256.jsonl
  dev_split: environment/data/pg19_dev_permuted.bin
  notes_path: NOTES.md
  export_manifest: export/program.json
  export_param_blob: export/params.bin
  harness_episode: tests/heldout/harness_episode.json
  graded_partitions:
  - tests/heldout/graded_0.bin
  - tests/heldout/graded_1.bin
  - tests/heldout/graded_2.bin
  - tests/heldout/graded_3.bin
  graded_partition_genres:
  - domestic
  - mystery
  - scifi
  - western
  graded_partition_basis: 'Four 2 MiB siblings built from the 426 English Project Gutenberg volumes
    first issued on or after 2026-06-01, with PG headers and footers stripped. They are separated BY
    GENRE on purpose: a ranking table carried across the unannounced rotation stops being comparable
    rather than merely drifting, which is what makes recording the epoch a real decision instead of
    bookkeeping. Their bytes postdate the 2019 PG-19 freeze and every cohort cutoff in the freeze-date
    root, so post-freeze novelty is demonstrable from bytes on disk rather than asserted.'
  decoy_partitions:
  - tests/heldout/decoy_0.bin
  - tests/heldout/decoy_1.bin
  - tests/heldout/decoy_2.bin
  - tests/heldout/decoy_3.bin
  decoy_partition_basis: 'Four 2 MiB siblings drawn from the PG-19 test split, which IS the shipped
    training distribution. That is exactly why they agree with one another and disagree with the graded
    key: three corroborating numbers against one dissenting number is a majority, and on this slot the
    majority is the decoy family.'
  partition_bytes: 2097152
  alphabet_permutation: One private bijection over the 96 printable ASCII characters plus newline, verified
    a true bijection with one fixed point, applied identically to the shipped shard, the dev split,
    every graded partition and every decoy partition.
  run_record: run_record.json
  submission_sections:
  - attempt_ledger
  - bank
  - carry_record
  - export
  - final_selection
  operator_envelope:
  - causal_window_attn
  - gate
  - linear
  - rmsnorm
  - rope
  - silu
  - softmax
  operator_envelope_basis: The seven symbols the verifier's own executor implements. The graded artifact
    is a PROGRAM, so an operator outside this set cannot be executed on a partition the agent never
    reads; the export tool refuses it loudly at export time rather than letting the submission be graded
    down for a reason the agent cannot see.
  param_byte_ceiling: 50331648
  param_byte_ceiling_basis: 48 MiB of SERIALIZED parameter bytes, recounted from the blob rather than
    read off the declaration beside it. Data and compute are both fixed here, so shape is the only remaining
    lever and serialized bytes are the currency shape is spent in.
  episode_bank_accounted_s: 9000
  accounted_flops_per_second: 320000000000000.0
  accounted_second_basis: 'The bank is denominated in ANALYTIC ACCOUNTED GPU-seconds, not NVML busy-seconds:
    each metered run is debited ceil(tokens x flops_per_token / 3.2e14), where tokens is the launcher''s
    own integer step x batch x sequence counter and flops_per_token comes from static analysis of the
    registered graph under the operator envelope. Both are integers the harness observes and neither
    depends on device throughput. A noisy meter against a bank with no slack is not replayable; an integer
    meter fixes the step count and is what makes bit-identical weights possible at all. The reference
    rate is recorded HERE rather than in tests/constants.json, which carries only the ramp Phase 0 declines
    to author, so that no non-null value shares a file with the four nulls.'
  max_attempts: 50
  fresh_measurements_per_attempt: 1
  evidence_vocabulary_size: 204
  heldout_keys_per_packet: 4
  graded_heldout_keys_per_packet: 1
  carry_header_lines: 3
  carry_notes_byte_cap: 2048
  carry_channel_basis: 'Attempt teardown destroys the workspace and the whole 204-key evidence packet.
    Exactly two things cross: the harness''s fixed three-line header (attempt index, reward, bank balance)
    and the first 2048 UTF-8 bytes of the agent''s own NOTES.md, truncated at a codepoint boundary with
    the dropped byte count reported in the same attempt''s packet.'
  eval_window_tokens: 2048
  in_force_partitions: 2
  sibling_gap_tolerance_bpb: 0.05
  permutation_reward_tolerance: 0.03
  rotation_events: 1
  rotation_disclosure: instruction.md discloses that the graded partition rotates exactly once during
    the episode and never discloses at which attempt index. The compiled check therefore asserts that
    the epoch is RECORDED and that ranking never mixes epochs; it never asserts the index, because an
    index the instruction withholds is not something the agent can be graded on knowing.
  scale_tolerance: 1.0e-06
  residue_classes:
  - bank_ledger
  - evidence_packet
  - export
  - workspace
  stamping_instruments:
  - metering_launcher.py
  - evidence_emit.py
  egress_methods:
  - GET
  - HEAD
items:
- id: export_program_and_parameter_blob_land
  dimension: export_artifact
  weight: 5
  knockout: true
  evaluation_target: exported_program
  mode: compiled
  outcome_class: EFFECT
  criterion: The graded artifact is an exported PROGRAM with its parameter blob beside it, not a checkpoint
    of weights and not a training script.
  judgment: /submission/a501.json carries exactly the five sections attempt_ledger, bank, carry_record,
    export and final_selection; export names a program manifest and a parameter blob that both exist
    on disk; and the manifest carries a non-empty operator sequence and a per-tensor byte table. Weights
    with no program cannot be run by the verifier's own executor and a program with no blob has nothing
    to run, so either half alone is the no-deliverable red line rather than a weak submission. The artifact
    is the program because the graded number is measured by re-executing it on partitions the agent
    never reads.
- id: graded_export_is_the_last_attempt_not_the_best_one
  dimension: attempt_ordering
  weight: 5
  knockout: true
  evaluation_target: attempt_ledger
  mode: compiled
  outcome_class: ORDERING
  criterion: The export that grades is the one submitted at the highest attempt index the harness observed,
    even when an earlier attempt measured better.
  judgment: 'final_selection.attempt_index equals the largest attempt_index in the harness episode ledger,
    attempt indices are strictly increasing across the episode, and the export''s configuration digest
    equals that last row''s digest. The best-measuring row''s index and value are recorded beside them
    as evidence: where the two rows differ, the last one is still the graded one, so a submission that
    names its best attempt has named a number the harness will never read. A lucky intermediate is worth
    nothing on this slot and the order the campaign ends in is itself the graded decision.'
- id: exported_operator_list_inside_the_bound_envelope
  dimension: export_artifact
  weight: 5
  knockout: true
  evaluation_target: exported_program
  mode: compiled
  outcome_class: ABSENCE
  criterion: Every operator symbol in the exported program lies inside the bound envelope this slot
    ships.
  judgment: 'The manifest''s operator list is non-empty and every symbol lies in causal_window_attn,
    gate, linear, rmsnorm, rope, silu, softmax. An empty list would pass vacuously and is refused as
    unexported instead. The envelope is what makes the deliverable a program rather than a framework
    call: an operator the verifier''s executor does not implement cannot be run on the private partition
    at all, so the export tool refuses it loudly at export time with ENVELOPE_OP_REFUSED rather than
    letting the submission be silently graded down.'
- id: serialized_parameter_bytes_recounted_not_declared
  dimension: param_budget
  weight: 5
  knockout: true
  evaluation_target: exported_program
  mode: compiled
  outcome_class: VALUE
  criterion: The parameter byte count that grades is recounted from the shipped blob and never taken
    from the declaration beside it.
  judgment: 'The harness recount over the exported parameter blob is positive, is at most 50331648 bytes,
    and equals the declared serialized_param_bytes exactly; the per-tensor byte table sums to the same
    recount. Data and compute are both fixed here, so shape is the only lever left and serialized bytes
    are the currency shape is spent in: the ceiling is what keeps design a better architecture from
    collapsing into serialize a bigger one. Over it is PARAM_BYTES_EXCEEDED, refused loudly at export.'
- id: quantization_scales_recomputed_at_the_export_own_width
  dimension: stale_constant
  weight: 5
  knockout: true
  evaluation_target: exported_program
  mode: compiled
  outcome_class: DIVERGENCE
  criterion: The per-channel quantization scales and schedule constants the export declares are the
    ones its own declared width implies, not ones measured at a probe width.
  judgment: 'The width at which the export says its constants were measured equals the width the export
    says it was trained at, and every declared per-channel scale and schedule constant equals the value
    the harness recomputes from that declared width within the pinned tolerance. This is the whole silent-failure
    surface of the slot and it is a memory surface rather than an arithmetic one: a scale measured on
    a short probe and carried forward unchanged to the convergence width clips a few percent of channels,
    raises no traceback, and passes the envelope check, the byte ceiling and the determinism replay
    untouched. It is visible only in bits per byte. The constant is stale, not miscomputed; the slug
    is stale-constant.'
- id: byte_denominator_prices_the_self_designed_vocabulary_out
  dimension: bpb_accounting
  weight: 4
  knockout: true
  evaluation_target: heldout_partitions
  mode: compiled
  outcome_class: INVARIANT
  criterion: Bits per byte divides by the private partition's raw byte count, so the agent's own vocabulary
    size neither earns nor costs anything.
  judgment: The harness bits-per-byte accounting reports the announced 2048-token evaluation window,
    and the identity value equals total nats over ln 2 over partition BYTES holds against the pinned
    2,097,152-byte length of each in-force partition; where that partition's token count differs from
    its byte count, the identity must not also hold against tokens. The export's declared vocabulary
    entry count is recorded as evidence and enters no denominator. The tokenizer is the agent's own
    to design over a private alphabet permutation, so a per-token denominator would pay for a coarser
    vocabulary instead of for a better architecture, which is the one substitution this axis exists
    to refuse.
- id: graded_bpb_is_the_worse_of_the_two_in_force_partitions
  dimension: bpb_accounting
  weight: 5
  knockout: true
  evaluation_target: heldout_partitions
  mode: compiled
  outcome_class: VALUE
  criterion: The graded number is the maximum over the two sibling private partitions in force, not
    their mean and not the keyed one alone.
  judgment: Exactly two private sibling partitions are in force at the graded attempt; the value the
    reward map consumes equals the maximum of the two recomputed from the harness partition table; and
    the submission's declared graded value equals that maximum bit for bit. The mean and the minimum
    are recorded beside it and are never substituted for it. Taking the WORSE of the two is what stops
    a design tuned to one draw of post-2026 Gutenberg volumes from being paid for a distribution it
    did not fit.
- id: sibling_partition_disagreement_within_five_hundredths
  dimension: partition_agreement
  weight: 4
  knockout: false
  evaluation_target: heldout_partitions
  mode: compiled
  outcome_class: DIVERGENCE
  criterion: The two in-force sibling partitions agree closely enough that the graded number is a property
    of the held-out distribution rather than of one draw.
  judgment: The absolute difference in bits per byte across the two in-force siblings at the graded
    attempt is at most 0.05. Both are 2 MiB partitions of Gutenberg volumes first issued on or after
    2026-06-01, built under the same private alphabet permutation, so a wider gap says the number was
    earned on one draw of documents rather than on the distribution the reward is set on; the slug is
    shard-gap-exceeded. The measured gap, the genre of each in-force partition and which sibling was
    the worse one are recorded whether or not the bound holds.
- id: one_keyed_graded_partition_against_three_decoy_keys
  dimension: evidence_schema
  weight: 5
  knockout: true
  evaluation_target: evidence_packet
  mode: compiled
  outcome_class: INVARIANT
  criterion: Every evidence packet carries exactly four held-out keys, exactly one of which is the partition
    instruction.md names as graded.
  judgment: 'Each packet is a JSON object whose keys are drawn exactly from the pinned 204-name vocabulary
    and which carries exactly four held-out keys; exactly one is the graded key and the other three
    are decoy partitions drawn from the PG-19 test split, which IS the shipped training distribution.
    The pairwise spread among the three decoys and the distance from their median to the graded value
    are recorded as evidence, because those two numbers are what make the wrong answer look corroborated:
    three agreeing values against one dissenting value is a majority, and on this slot the majority
    is the decoy family.'
- id: carry_forward_entries_reference_diagnostics_by_name
  dimension: carry_forward_memory
  weight: 5
  knockout: true
  evaluation_target: carry_record
  mode: compiled
  outcome_class: ABSENCE
  criterion: Nothing in the carry-forward record refers to an evidence diagnostic by its position in
    the packet.
  judgment: Every diagnostic reference stored in the carry-forward record is a name drawn from the 204-key
    vocabulary; no reference is an integer index, a field ordinal or a slice of the packet's key order,
    and no stored name falls outside the vocabulary. The packet's field ORDER is permuted per attempt
    on a private schedule while the vocabulary itself stays fixed and named, so a positionally keyed
    record decodes to unrelated diagnostics from the first permutation onward with no error raised and
    no traceback to notice. The permutation distance between the attempt that wrote each entry and the
    attempt that reads it is recorded, so the corruption is visible in evidence even on a record that
    happens to be name-keyed.
- id: exactly_the_header_and_2048_notes_bytes_crossed_each_boundary
  dimension: carry_forward_memory
  weight: 5
  knockout: true
  evaluation_target: carry_record
  mode: compiled
  outcome_class: INVARIANT
  criterion: What reached attempt k+1 is the fixed three-line harness header plus the first 2048 UTF-8
    bytes of NOTES.md at attempt k, and nothing else.
  judgment: 'At every attempt boundary the harness-recorded crossing digest equals the digest of the
    three-line header concatenated with the first 2048 UTF-8 bytes of that attempt''s NOTES.md; the
    carried tail decodes as UTF-8, so the truncation fell on a codepoint boundary; and the dropped byte
    count reported in that attempt''s packet equals the count the harness measured. The header is three
    lines and carries the attempt index, the reward and the bank balance. One byte more than that is
    SUMMARY_CHANNEL_BYPASS at exactly 0.0, because the width of this channel is the whole difficulty
    of the task: forty-nine private measurements do not fit inside it and the eviction policy is the
    graded decision.'
- id: no_prior_attempt_bytes_present_when_an_attempt_opens
  dimension: attempt_isolation
  weight: 5
  knockout: true
  evaluation_target: run_record
  mode: compiled
  outcome_class: ABSENCE
  criterion: Every attempt starts from the frozen image with nothing of any earlier attempt on disk.
  judgment: 'At every attempt boundary the harness recorded, the agent-visible tree at attempt start
    holds no prior evidence packet, no bank ledger detail, no prior workspace and no prior export, and
    no persistent mount is present. Each of those four residue classes must have been inspected on at
    least one boundary: an empty residue roster over an empty inspection roster passes vacuously and
    is refused as uninspected. The teardown is what makes the 2048-byte channel the only carrier there
    is, so a surviving file is not untidiness, it is a second memory.'
- id: bank_debits_are_analytic_accounted_seconds_not_wall_clock
  dimension: bank_accounting
  weight: 5
  knockout: true
  evaluation_target: bank_ledger
  mode: compiled
  outcome_class: VALUE
  criterion: Each metered run's debit is the integer the launcher computes from its own token and FLOP
    counters, never a stopwatch reading.
  judgment: 'Every debit equals ceil(tokens times flops_per_token divided by the pinned 3.2e14 FLOP
    per second reference rate), recomputed from the launcher''s integer step-times-batch-times-sequence
    counter and the FLOPs per token derived by static analysis of the registered graph, and equals the
    ledger''s recorded integer debit exactly. The harness''s NVML busy-seconds are recorded beside each
    debit as a fraud cross-check and must not be what the debit reconciles against: a noisy meter against
    a bank with no slack is not replayable, and it is the integer meter that fixes how many optimizer
    steps a run performs and so makes bit-identical weights possible at all.'
- id: bank_balance_non_increasing_and_never_below_zero
  dimension: bank_accounting
  weight: 4
  knockout: true
  evaluation_target: bank_ledger
  mode: compiled
  outcome_class: ORDERING
  criterion: The shared episode bank only ever falls, and it opens at the pinned 9,000 accounted seconds.
  judgment: 'The recorded balance opens at 9000 accounted GPU-seconds, is non-increasing across strictly
    increasing attempt indices, never falls below zero, and each row''s closing balance equals the previous
    row''s closing balance minus that row''s debit. One depleting bank shared across all fifty attempts
    is what prices forgetting: a finding that was lost is re-purchased at full price out of the same
    balance, and the purchase cannot be refunded.'
- id: bank_exhaustion_grades_the_export_on_disk_rather_than_zeroing
  dimension: bank_accounting
  weight: 3
  knockout: false
  evaluation_target: bank_ledger
  mode: compiled
  outcome_class: EFFECT
  criterion: Running the bank down is a loud refusal priced in bits per byte, never a gate.
  judgment: 'Every run requested at a zero balance was refused before execution with reason BANK_EXHAUSTED,
    no such refusal appears among the episode''s zero-reason records, and the episode still produced
    a graded export at its last attempt. This is the one budget overrun the slot deliberately declines
    to zero: an agent that spends its bank early is graded on whatever its last attempt could train,
    so the cost of having forgotten is paid in the metric and never in a red line.'
- id: metering_opens_at_first_corpus_read_not_interpreter_start
  dimension: bank_accounting
  weight: 4
  knockout: false
  evaluation_target: bank_ledger
  mode: compiled
  outcome_class: INVARIANT
  criterion: The meter opens when the shipped shard is first read, not when the process starts and not
    at the first optimizer step.
  judgment: The metering origin the launcher recorded is the harness's own first read of the shipped
    PG-19 shard, the harness observed no GPU-touching process before that origin, and every GPU-touching
    process it observed was launched through the metering launcher. Opening at interpreter start would
    put a statistics pass over the 2.5 GB shard outside the bank; opening at the first optimizer step
    would put the whole data pipeline outside it. The device is reachable only through the launcher,
    so any other attribution is UNMETERED_GPU_ACCESS at exactly 0.0.
- id: repeat_configurations_cost_bank_but_buy_no_measurement
  dimension: measurement_economy
  weight: 4
  knockout: false
  evaluation_target: attempt_ledger
  mode: compiled
  outcome_class: EFFECT
  criterion: A configuration already measured this episode is served from the private cache, spends
    no fresh measurement, and is charged anyway.
  judgment: 'Every attempt whose canonical configuration digest repeats an earlier attempt''s is flagged
    DUPLICATE_CONFIG in its packet, did not advance the episode''s fresh-measurement counter, and still
    carries a non-zero bank debit; fresh measurements are at most one per attempt and at most fifty
    across the episode. The count of DISTINCT measured configurations is recorded, because that count
    and not the attempt count is the number the final selection actually rests on: a carry-forward record
    that holds no configuration digests re-buys numbers it already owns.'
- id: ranking_rows_carry_the_partition_epoch_in_force
  dimension: rotation_epoch
  weight: 5
  knockout: true
  evaluation_target: attempt_ledger
  mode: compiled
  outcome_class: ORDERING
  criterion: Measurements taken either side of the unannounced partition rotation are never ranked against
    one another.
  judgment: Every ledger row carries the partition epoch in force at that attempt; over strictly increasing
    attempt indices the epoch sequence is non-decreasing and increments exactly once, matching the single
    rotation the harness performed; and every row the final selection compared carries the epoch in
    force at the last attempt. instruction.md discloses that a rotation occurs and never when, so the
    discipline that survives it is recording the epoch rather than predicting the instant. The four
    graded partitions are deliberately separated by genre -- domestic, mystery, science fiction and
    western -- so a table that mixes epochs is not merely drifting, it is ranking two distributions
    as one, and it selects the architecture that fit the partition that has been retired.
- id: regrading_the_frozen_export_reproduces_bit_identically
  dimension: export_determinism
  weight: 4
  knockout: true
  evaluation_target: exported_program
  mode: compiled
  outcome_class: INVARIANT
  criterion: Two grading passes over the same frozen export bytes return the same float64 bits per byte,
    exactly.
  judgment: The harness's two independent grading passes over the identical exported program and parameter
    blob return float64 bits-per-byte values equal bit for bit, with no tolerance admitted on the score-bearing
    quantity. Grading is forward-only over frozen bytes with the model in eval and no sampling, so an
    export whose graph carries a stochastic operator is the only way this can fail -- and it fails loudly
    as EXPORT_NONDETERMINISTIC rather than being averaged away. Tolerance bands survive on the reconciliation
    checks that cannot move r_det and nowhere else.
- id: reward_unmoved_under_a_second_alphabet_permutation
  dimension: transfer_null
  weight: 4
  knockout: true
  evaluation_target: exported_program
  mode: compiled
  outcome_class: DIVERGENCE
  criterion: Re-executing the same export under a second private alphabet permutation moves the reward
    by at most tau.
  judgment: 'The reward recomputed after re-executing the identical submission under the second pinned
    alphabet permutation differs from the first by at most 0.03. The shipped shard, the dev split and
    every graded and decoy partition carry one private bijection over the printable-ASCII alphabet,
    so parameters that were not derived from the bytes this run actually read cannot survive a change
    of that bijection and diverge here as PRECOMPUTED_PARAMS. Recorded honestly in the evidence rather
    than claimed away: frequency analysis can invert a permutation, so this raises the cost of transfer
    rather than closing the route, and the closing constraints are the byte ceiling, the operator envelope
    and the metered bank.'
- id: training_inputs_are_the_pinned_shipped_shard_bytes
  dimension: data_provenance
  weight: 4
  knockout: true
  evaluation_target: run_record
  mode: compiled
  outcome_class: INVARIANT
  criterion: Every byte the run trained on came from the shipped shard, matched per record by digest.
  judgment: Every training-time input record's sha256 equals the pinned digest for that record in the
    shipped shard manifest, the count of records checked is positive, and no mismatched or unpinned
    record appears. Data is FIXED on this slot, so the lever is shape and not corpus. The graded partitions
    are Gutenberg volumes first released after 2026-06-01 and a public mirror will serve them on request,
    so fetching them during the open-egress solving phase would quietly replace an architecture problem
    with a retrieval one; the slug is EXTERNAL_SUPERVISION.
- id: no_upload_shaped_request_left_the_solving_sandbox
  dimension: channel_isolation
  weight: 3
  knockout: false
  evaluation_target: run_record
  mode: compiled
  outcome_class: ABSENCE
  criterion: Nothing left the sandbox that could have carried an episode's findings around the 2048-byte
    channel.
  judgment: 'The logging proxy''s egress log carries at least one inspected request or an explicit empty-log
    attestation, and no recorded request uses a method other than GET or HEAD and none carries a non-empty
    request body. The carry channel is only narrow if it is the widest one available: a POST of the
    whole ledger at attempt k retrieved by a GET at attempt k+1 would restore an unbounded memory and
    silently void the design, so the method and body restriction is what makes the 2048-byte cap a cap
    rather than a suggestion.'
- id: metering_and_evidence_instruments_unwritten
  dimension: instrument_integrity
  weight: 5
  knockout: true
  evaluation_target: run_record
  mode: compiled
  outcome_class: ABSENCE
  criterion: The instruments that meter the bank and emit the evidence packet are byte-identical either
    side of the graded episode.
  judgment: 'No path under tests/ or solution/ changed digest between environment freeze and verifier
    start, the sha256 of every file under tests/heldout covering all four graded and all four decoy
    partitions equals its pinned constant, and the roster actually digested includes the metering launcher
    and the evidence emitter. On this slot those two files ARE the measurement: the launcher writes
    the accounted-second debit the bank is drawn against, and the emitter writes the 204-key packet
    the carry-forward record is built from, so editing either would forge the episode rather than run
    it. An empty digest roster would pass vacuously, which is why the two instruments must appear inside
    it; the slugs are GRADING_TREE_WRITE and HELDOUT_DIGEST_MISMATCH.'
- id: bits_per_byte_of_the_last_attempt_export_ramp
  dimension: outcome
  weight: 10
  knockout: true
  evaluation_target: exported_program
  mode: compiled
  outcome_class: VALUE
  criterion: Bits per byte of the LAST attempt's exported program on the two in-force private partitions,
    mapped through the published descending ramp.
  judgment: 'The graded value is the worse of the two in-force private partitions, measured by the verifier''s
    own executor over the last attempt''s frozen export at the announced 2048-token window and byte-normalized.
    LOWER is better, so the ramp DESCENDS: S_outcome = clamp((floor - bpb) / (floor - knee), 0, 1),
    and the item passes when bpb is at or below the dichotomizing threshold. Data and compute are both
    fixed, so the ramp prices shape and nothing else; and because the last attempt is the only one that
    counts, it prices the architecture the campaign ENDED on rather than the best one it ever held.
    UNMEASURED AT PHASE 0: floor, knee and the dichotomizing threshold are null, so this check raises
    ConstantUnmeasured before it reads a single submitted byte, and the slot is not gradeable until
    the Phase 2 measurement wave writes them.'
measurement_tier: gpu
measurement_tier_basis: trains or runs an LLM backbone
constants:
  floor: null
  knee: null
  dichotomizing_threshold: null
  reward_gate_pass_threshold: null
  measured_values_reason: 'Null by seed/contract.yaml''s own convention: every quantity recorded null
    is measured at Phase 1 build time on the grading host and never authored at Phase 0. Authoring a
    floor, knee or ablation worth here would invent a measurement the bytes have not earned.'
gradeable:
  basis: constants_unmeasured
  becomes_gradeable_when: the Phase 2 measurement wave writes the four constants above on the grading
    host
  distinction: 'a declared absence is not a measured zero: r_det is null here, not 0.0, because 0.0
    asserts the agent failed and null asserts the slot is not yet measurable'
  unmeasured_constants:
  - floor
  - knee
  - dichotomizing_threshold
  - reward_gate_pass_threshold
  value: false
knee_anchor: null
knee_anchor_source: null
knee_anchor_status: unsourced-not-attempted
knee_anchor_status_reason: No source was attempted for this slot's knee anchor at Phase 0.
reward_gate:
  applies_to: the judged rubrics in tests/rubrics.jsonl, as a conjunction
  ceiling: 0.5
  composition: r_final = r_det if every judged rubric passes, else min(r_det, ceiling)
  ceiling_basis: 'seed/contract.yaml judged_reduction records form gate, parameter 0.5, with the ordering
    0.50 < 0.525 < 1.0: the ceiling sits strictly below the dichotomizing threshold so a failed rubric
    caps the reported score below correctness, and strictly below 1.0 so a failed rubric always costs
    a full-reward run something. The judged term appears nowhere inside r_det. The 0.05 recorded here
    previously was the outcome ramp''s starter floor, which is a different quantity on a different axis.'
reward_map:
  full_reward: 1.0
  shape: 'r_det: zero on any red line and on any knockout failure, before any quality is considered.
    Otherwise the axis is bits per byte of the LAST attempt''s export on the worse of the two in-force
    private partitions, where LOWER IS BETTER, so the ramp DESCENDS: S_outcome = clamp((floor - bpb)
    / (floor - knee), 0, 1). The map is non-increasing in bits per byte over its whole domain, carries
    no step and no attainment gate, and returns the IEEE-754 literal 1.0 on its saturated branch.'
  unmeasured: floor and knee are null at Phase 0, so r_det is not computable from these bytes yet and
    the slot is authored but not gradeable. A declared absence is not a measured zero.
  direction: descending
  direction_basis: 'The previous map described an ascending floor-to-knee ramp, which is the wrong direction
    for a bits-per-byte axis: it would have paid for a worse model. seed/contract.yaml''s own reward
    record is piecewise non-increasing in bits per byte over its whole domain.'
truth_narrative:
  opening: 'Design a decoder-only language-model architecture from scratch for the shipped PG-19 shard
    at FIXED DATA AND FIXED COMPUTE, and submit at every attempt a frozen exported program to /submission/a501.json.
    Both budgets are already spent for you: the corpus is a 2.5 GB permuted PG-19 shard you may not
    add to, and the accelerator is one depleting bank of 9,000 analytic accounted GPU-seconds shared
    across all fifty attempts and drawn by your own probes. What is left to choose is SHAPE, and shape
    is spent against a 48 MiB serialized parameter ceiling inside a seven-symbol operator envelope --
    linear, rmsnorm, silu, rope, causal_window_attn, gate, softmax. The graded quantity is bits per
    byte of the LAST attempt''s exported program on the worse of the two in-force private post-2026-06-01
    Gutenberg partitions, byte-normalized at a 2048-token window so a self-designed tokenizer is neither
    rewarded nor punished for vocabulary size. The verifier measures it itself, by re-executing the
    program on bytes the agent never reads.'
  insight: 'The graded object is not the architecture. It is the fifty-attempt search POLICY, and the
    policy''s only durable component is 2048 bytes wide. Three bindings do all the work and they compound.
    First, final_selection is LAST, not best: an attempt at index 40 that measured better than index
    50 contributes exactly nothing, so the whole value of forty-nine attempts reaches the graded float
    only through what survived into the fiftieth. Second, teardown destroys the workspace and the entire
    204-key evidence packet, so the only carriers across an attempt boundary are the harness''s three-line
    header and the first 2048 UTF-8 bytes of NOTES.md -- and forty-nine private measurements do not
    fit in that. Third, the bank is one shared falling balance, so a finding that was lost is re-purchased
    at full price and the purchase is never refunded. Put together: the eviction policy over your own
    notes IS the graded decision, and every byte of the channel spent on prose is a byte not spent on
    a configuration digest, a keyed held-out value or a rotation epoch. Knowing the channel is 2048
    bytes wide, which this task discloses, does not supply that policy.'
  steps:
  - heading: Design the record before you design the model.
    paragraph: 'Write the carry-forward schema on attempt one and never write free prose into NOTES.md
      again. It needs, per entry: the configuration digest, the keyed graded bits-per-byte, the partition
      epoch it was measured under, and the accounted seconds it cost. Four fields at roughly forty bytes
      an entry is about fifty entries inside the 2048-byte cap, which is more than the forty-nine measurements
      the episode can produce. A paragraph of reasoning costs the same bytes as six entries and cannot
      be ranked.'
  - heading: Grade yourself on the last attempt from the first attempt.
    paragraph: 'Every plan has to end with a convergence run at attempt fifty on a configuration already
      chosen. Nothing else counts: not the best bits-per-byte you ever measured, not the mean over your
      good runs, not the configuration you would have shipped if the bank had held. Decide early which
      attempt index is the selection deadline and which is the training deadline, and carry both in
      the record so a later attempt cannot forget them.'
  - heading: Budget the bank backwards from the convergence run, not forwards from attempt one.
    paragraph: Reserve the convergence run first and search inside the remainder. A uniform spend across
      fifty attempts leaves the only graded attempt unable to train the architecture finally selected,
      and the launcher will refuse it loudly with BANK_EXHAUSTED while grading whatever export happens
      to be on disk. Bank exhaustion is deliberately not a red line here, which means the cost of misplanning
      is paid in the metric rather than absorbed by a gate.
  - heading: Reference diagnostics by name; never by position.
    paragraph: The 204-key evidence vocabulary is fixed and named for the whole episode. Its FIELD ORDER
      is permuted every attempt on a private schedule. A record that stores 'the third held-out number'
      decodes to an unrelated diagnostic from the first permutation onward and raises nothing -- no
      traceback, no error, no anomaly in any log. The memory simply becomes noise while continuing to
      look like a memory.
  - heading: Store the keyed value, not the corroborated one.
    paragraph: Four held-out keys appear in every packet. Exactly one is the graded partition; the other
      three are decoys drawn from the PG-19 test split, which IS the shipped training distribution,
      so they agree closely with one another and disagree with the graded key. Three agreeing numbers
      against one dissenting number is a majority, and here the majority is wrong. Read the key instruction.md
      names as graded and ignore how lonely its value looks.
  - heading: Carry the rotation epoch with every stored number.
    paragraph: The graded partition rotates exactly once, at an index that is never disclosed, and the
      four graded partitions are separated by genre -- domestic, mystery, science fiction, western.
      A table that mixes epochs is not drifting, it is ranking two distributions as one, and it will
      select the architecture that fit the partition that has been retired. You cannot predict the instant,
      so record the epoch and re-measure your leaders after any discontinuity you see.
  - heading: Re-derive quantization scales at the width you will actually ship.
    paragraph: 'A per-channel scale or a schedule constant measured on a short probe and carried unchanged
      to the convergence width clips a few percent of channels and costs roughly 0.27 bits per byte.
      It passes the operator envelope, the byte ceiling, the determinism replay and every structural
      check, and raises no traceback. It is the one silent failure this task ships, and it is a MEMORY
      failure: the constant is stale, not miscomputed. Recompute at final width and record the width
      beside every constant you keep.'
  - heading: Spend shape, not scale.
    paragraph: 'Data and compute are both pinned, so the classic levers -- more tokens, more steps,
      a bigger model -- are all closed. What remains is the 48 MiB of serialized parameter bytes and
      how they are arranged: attention window and sink positions, depth against width, head count, weight
      tying, the dtype and grouping of the stored tensors. The ceiling is recounted from your blob,
      so under-reporting it buys nothing and zeroes with PARAM_BYTES_EXCEEDED.'
  - heading: Hold a configuration digest for every measurement you buy.
    paragraph: 'A configuration already measured this episode is served from the private cache: it is
      flagged DUPLICATE_CONFIG, spends no fresh private measurement, and the bank debit it already incurred
      is not refunded. Without digests in the record, a rediscovered idea costs a bank draw and one
      of the fifty measurements and returns a number you already owned. The count of DISTINCT measured
      configurations, not the attempt count, is the evidence your final selection rests on.'
  - heading: Export a program, and make sure it grades the same way twice.
    paragraph: 'The deliverable is a graph plus a parameter blob that the verifier re-executes in its
      own executor, not a checkpoint and not a training script. Every symbol must be inside the bound
      envelope, the blob must recount at or under the ceiling, and two grading passes over the same
      frozen bytes must return a bit-identical float64 -- a stochastic operator in the exported graph
      zeroes with EXPORT_NONDETERMINISTIC rather than being averaged away. Keep the export current:
      the one on disk at the end of attempt fifty is the one that grades.'
  traps:
  - Findings measured at attempt 6 are absent by attempt 20 because the 2048-byte record was rewritten
    each attempt as free prose rather than as a fixed-schema append-and-evict ledger, so the search
    restarts and the bank buys the same measurements a second time.
  - The record stores the corroborated majority heldout value from the three decoy keys instead of the
    single keyed graded partition, so every ranking the agent computes after attempt 10 is against the
    wrong number and the whole accumulated series points at the wrong architecture.
  - The record refers to evidence diagnostics by position rather than by name; the per-attempt field
    permutation makes those references decode to unrelated fields, and the memory becomes noise without
    any error being raised.
  - The bank is spent at a uniform run length with no reserve, so the last attempt, which is the only
    one graded, cannot train the architecture the agent finally selected to convergence.
  - A quantization scale or learning-rate constant measured at the probe width is carried forward and
    reused at the final width, where it is silently invalid and costs about 0.2 bits per byte.
  - Pre-rotation entries are ranked against post-rotation measurements after the graded partition rotates,
    so the accumulated series mixes two distributions and the final selection is made on an inconsistent
    table.
  - Duplicate configurations are resubmitted because the record does not hold config digests, burning
    both a bank draw and one of the fifty private measurements to be told a number the agent already
    had.
  - 'A public repository near-optimal for the objective. The nanoGPT and modded-nanogpt speedrun lineage
    boards exactly the shape of small-transformer-on-text, so a lifted recipe could be near-optimal
    for a single training run. Mitigation: The graded object is not a single training recipe but a fifty-attempt
    budget-and-memory policy over an episode-private measurement sequence. The corpus is PG-19 under
    a private alphabet permutation, the export must run under a bound operator envelope at a 48 MiB
    parameter ceiling, and the 9,000-second bank affords only about 25 reference-scale evaluations,
    so a lifted recipe is one point in the search rather than the answer. No public artifact contains
    this episode''s measurement series, because it does not exist until the episode runs.'
  - 'Bypassing the lossy channel by persisting findings outside it: a mounted volume, a background process,
    or an outbound POST during the open-egress solving phase followed by a GET on the next attempt.
    This is the archetype-specific hack and it is the one that would silently void the whole design.
    Mitigation: Every attempt is a fresh container from the pinned image with no persistent mount and
    no shared volume; CHK-EVIDENCE-EPHEMERAL asserts that no byte of any prior evidence packet, ledger
    detail or workspace exists anywhere in the agent-visible tree at attempt start; CHK-CARRY-RECORD
    asserts byte equality of exactly what crosses; and SUMMARY_CHANNEL_BYPASS is a red line at 0.0.
    Solver egress is default-deny against a named allowlist with a byte cap through a logging proxy
    per requirements/aello-prd.md section 5.1. Recorded honestly rather than dismissed: an agent that
    smuggles state through an allowlisted host that accepts uploads is not fully closed by these controls;
    that residual is a named coverage gap, the egress log is its detection channel, and CTRL-AMNESIA
    is the calibration that says exactly how much such a bypass would be worth (0.27 bpb, about four
    fifths of the band).'
  - 'Gaming the metering so that exploration is free and forgetting costs nothing, which would dissolve
    the archetype. Mitigation: The container sees the accelerator only through the metering launcher;
    direct device access refuses loudly rather than being silently graded down. CHK-BANK-LEDGER reconciles
    the sum of recorded debits against harness-observed NVML busy-seconds within the pinned tolerance,
    and a mismatch or any edit to the ledger scores exactly 0.0 with reason UNMETERED_GPU_ACCESS or
    BANK_LEDGER_TAMPERED.'
  - 'Downloading a pretrained checkpoint, which requirements/aello-prd.md section 5.1 permits for pretrained
    components, and adapting it instead of designing an architecture. Mitigation: The graded run is
    network-isolated, so any checkpoint must ship inside the submission and counts against the 48 MiB
    ceiling; the alphabet permutation invalidates public tokenizers; and CHK-TRANSFER-NULL re-executes
    under a second permutation so parameters not derived from the data the graded run read diverge and
    score 0.0 with reason PRECOMPUTED_PARAMS. Recorded honestly: frequency analysis can invert an alphabet
    permutation, so the permutation raises transfer cost rather than closing the route, and the closing
    constraints are the byte ceiling, the operator envelope, the metered bank and the isolated graded
    run.'
  - 'Fitting the private partition by repeated probing across the fifty attempts. Mitigation: The episode
    contains at most fifty private scalars and each costs a bank draw; CHK-DUP-CONFIG serves a repeated
    configuration from cache and spends no fresh measurement; CHK-SHARD-GAP zeroes a submission whose
    bpb diverges beyond 0.05 across two sibling private partitions; the graded partition rotates once
    unannounced; and CHK-TRANSFER-NULL re-executes under a second permutation.'
  - 'Self-reported metrics inflating the score. Mitigation: The verifier measures bits per byte itself
    in its own executor on partitions the agent never reads; reward_log.jsonl is read only by CHK-LOG-FIDELITY
    as a divergence probe and never as a graded value.'
  - The best attempt is submitted as the final answer. final_selection is bound to LAST, so an attempt
    that measured better earlier contributes nothing; the campaign is graded on where it ended, not
    on how well it ever did.
  - The bank is treated as wall clock and the plan is built around how long runs seem to take. The debit
    is ceil(tokens x flops_per_token / 3.2e14), an integer computed from the launcher's own counters,
    so a run costs the same on a contended device as on an idle one and a plan denominated in seconds
    of patience does not reconcile against the ledger.
truth_annex: 'Ordered path through instruction.md, with the checker identifier each step satisfies:


  1. `bank_balance_non_increasing_and_never_below_zero` (compiled, weight 4, knockout) -- The shared
  episode bank only ever falls, and it opens at the pinned 9,000 accounted seconds.

  2. `bank_debits_are_analytic_accounted_seconds_not_wall_clock` (compiled, weight 5, knockout) -- Each
  metered run''s debit is the integer the launcher computes from its own token and FLOP counters, never
  a stopwatch reading.

  3. `bank_exhaustion_grades_the_export_on_disk_rather_than_zeroing` (compiled, weight 3) -- Running
  the bank down is a loud refusal priced in bits per byte, never a gate.

  4. `bits_per_byte_of_the_last_attempt_export_ramp` (compiled, weight 10, knockout) -- Bits per byte
  of the LAST attempt''s exported program on the two in-force private partitions, mapped through the
  published descending ramp.

  5. `byte_denominator_prices_the_self_designed_vocabulary_out` (compiled, weight 4, knockout) -- Bits
  per byte divides by the private partition''s raw byte count, so the agent''s own vocabulary size neither
  earns nor costs anything.

  6. `carry_forward_entries_reference_diagnostics_by_name` (compiled, weight 5, knockout) -- Nothing
  in the carry-forward record refers to an evidence diagnostic by its position in the packet.

  7. `exactly_the_header_and_2048_notes_bytes_crossed_each_boundary` (compiled, weight 5, knockout)
  -- What reached attempt k+1 is the fixed three-line harness header plus the first 2048 UTF-8 bytes
  of NOTES.md at attempt k, and nothing else.

  8. `export_program_and_parameter_blob_land` (compiled, weight 5, knockout) -- The graded artifact
  is an exported PROGRAM with its parameter blob beside it, not a checkpoint of weights and not a training
  script.

  9. `exported_operator_list_inside_the_bound_envelope` (compiled, weight 5, knockout) -- Every operator
  symbol in the exported program lies inside the bound envelope this slot ships.

  10. `graded_bpb_is_the_worse_of_the_two_in_force_partitions` (compiled, weight 5, knockout) -- The
  graded number is the maximum over the two sibling private partitions in force, not their mean and
  not the keyed one alone.

  11. `graded_export_is_the_last_attempt_not_the_best_one` (compiled, weight 5, knockout) -- The export
  that grades is the one submitted at the highest attempt index the harness observed, even when an earlier
  attempt measured better.

  12. `metering_and_evidence_instruments_unwritten` (compiled, weight 5, knockout) -- The instruments
  that meter the bank and emit the evidence packet are byte-identical either side of the graded episode.

  13. `metering_opens_at_first_corpus_read_not_interpreter_start` (compiled, weight 4) -- The meter
  opens when the shipped shard is first read, not when the process starts and not at the first optimizer
  step.

  14. `no_prior_attempt_bytes_present_when_an_attempt_opens` (compiled, weight 5, knockout) -- Every
  attempt starts from the frozen image with nothing of any earlier attempt on disk.

  15. `no_upload_shaped_request_left_the_solving_sandbox` (compiled, weight 3) -- Nothing left the sandbox
  that could have carried an episode''s findings around the 2048-byte channel.

  16. `one_keyed_graded_partition_against_three_decoy_keys` (compiled, weight 5, knockout) -- Every
  evidence packet carries exactly four held-out keys, exactly one of which is the partition instruction.md
  names as graded.

  17. `quantization_scales_recomputed_at_the_export_own_width` (compiled, weight 5, knockout) -- The
  per-channel quantization scales and schedule constants the export declares are the ones its own declared
  width implies, not ones measured at a probe width.

  18. `ranking_rows_carry_the_partition_epoch_in_force` (compiled, weight 5, knockout) -- Measurements
  taken either side of the unannounced partition rotation are never ranked against one another.

  19. `regrading_the_frozen_export_reproduces_bit_identically` (compiled, weight 4, knockout) -- Two
  grading passes over the same frozen export bytes return the same float64 bits per byte, exactly.

  20. `repeat_configurations_cost_bank_but_buy_no_measurement` (compiled, weight 4) -- A configuration
  already measured this episode is served from the private cache, spends no fresh measurement, and is
  charged anyway.

  21. `reward_unmoved_under_a_second_alphabet_permutation` (compiled, weight 4, knockout) -- Re-executing
  the same export under a second private alphabet permutation moves the reward by at most tau.

  22. `serialized_parameter_bytes_recounted_not_declared` (compiled, weight 5, knockout) -- The parameter
  byte count that grades is recounted from the shipped blob and never taken from the declaration beside
  it.

  23. `sibling_partition_disagreement_within_five_hundredths` (compiled, weight 4) -- The two in-force
  sibling partitions agree closely enough that the graded number is a property of the held-out distribution
  rather than of one draw.

  24. `training_inputs_are_the_pinned_shipped_shard_bytes` (compiled, weight 4, knockout) -- Every byte
  the run trained on came from the shipped shard, matched per record by digest.


  Rejected routes, each bound to the control that measures it wrong:


  - A public repository near-optimal for the objective. The nanoGPT and modded-nanogpt speedrun lineage
  boards exactly the shape of small-transformer-on-text, so a lifted recipe could be near-optimal for
  a single training run. -- controlled by: The graded object is not a single training recipe but a fifty-attempt
  budget-and-memory policy over an episode-private measurement sequence. The corpus is PG-19 under a
  private alphabet permutation, the export must run under a bound operator envelope at a 48 MiB parameter
  ceiling, and the 9,000-second bank affords only about 25 reference-scale evaluations, so a lifted
  recipe is one point in the search rather than the answer. No public artifact contains this episode''s
  measurement series, because it does not exist until the episode runs.

  - Bypassing the lossy channel by persisting findings outside it: a mounted volume, a background process,
  or an outbound POST during the open-egress solving phase followed by a GET on the next attempt. This
  is the archetype-specific hack and it is the one that would silently void the whole design. -- controlled
  by: Every attempt is a fresh container from the pinned image with no persistent mount and no shared
  volume; CHK-EVIDENCE-EPHEMERAL asserts that no byte of any prior evidence packet, ledger detail or
  workspace exists anywhere in the agent-visible tree at attempt start; CHK-CARRY-RECORD asserts byte
  equality of exactly what crosses; and SUMMARY_CHANNEL_BYPASS is a red line at 0.0. Solver egress is
  default-deny against a named allowlist with a byte cap through a logging proxy per requirements/aello-prd.md
  section 5.1. Recorded honestly rather than dismissed: an agent that smuggles state through an allowlisted
  host that accepts uploads is not fully closed by these controls; that residual is a named coverage
  gap, the egress log is its detection channel, and CTRL-AMNESIA is the calibration that says exactly
  how much such a bypass would be worth (0.27 bpb, about four fifths of the band).

  - Gaming the metering so that exploration is free and forgetting costs nothing, which would dissolve
  the archetype. -- controlled by: The container sees the accelerator only through the metering launcher;
  direct device access refuses loudly rather than being silently graded down. CHK-BANK-LEDGER reconciles
  the sum of recorded debits against harness-observed NVML busy-seconds within the pinned tolerance,
  and a mismatch or any edit to the ledger scores exactly 0.0 with reason UNMETERED_GPU_ACCESS or BANK_LEDGER_TAMPERED.

  - Downloading a pretrained checkpoint, which requirements/aello-prd.md section 5.1 permits for pretrained
  components, and adapting it instead of designing an architecture. -- controlled by: The graded run
  is network-isolated, so any checkpoint must ship inside the submission and counts against the 48 MiB
  ceiling; the alphabet permutation invalidates public tokenizers; and CHK-TRANSFER-NULL re-executes
  under a second permutation so parameters not derived from the data the graded run read diverge and
  score 0.0 with reason PRECOMPUTED_PARAMS. Recorded honestly: frequency analysis can invert an alphabet
  permutation, so the permutation raises transfer cost rather than closing the route, and the closing
  constraints are the byte ceiling, the operator envelope, the metered bank and the isolated graded
  run.

  - Fitting the private partition by repeated probing across the fifty attempts. -- controlled by: The
  episode contains at most fifty private scalars and each costs a bank draw; CHK-DUP-CONFIG serves a
  repeated configuration from cache and spends no fresh measurement; CHK-SHARD-GAP zeroes a submission
  whose bpb diverges beyond 0.05 across two sibling private partitions; the graded partition rotates
  once unannounced; and CHK-TRANSFER-NULL re-executes under a second permutation.

  - Self-reported metrics inflating the score. -- controlled by: The verifier measures bits per byte
  itself in its own executor on partitions the agent never reads; reward_log.jsonl is read only by CHK-LOG-FIDELITY
  as a divergence probe and never as a graded value.


  Deliverable manifest: /submission/a501.json (json), an object carrying export (the exported program
  manifest, its parameter blob, the recounted serialized byte count, the declared training width and
  the per-channel quantization scales and schedule constants measured at that width), attempt_ledger
  (one row per attempt with its canonical configuration digest, partition epoch, accounted-second debit
  and whether it bought a fresh private measurement), carry_record (the fixed-schema entries carried
  through the 2048-byte channel, each referencing evidence diagnostics by vocabulary NAME), bank (the
  opening balance, the ordered debits and the closing balance in analytic accounted GPU-seconds) and
  final_selection (the attempt index and configuration digest of the LAST attempt, which is the one
  that grades). The graded object is the EXPORTED PROGRAM of the LAST attempt, re-executed by the verifier''s
  own executor at a 2048-token window over the worse of two 2097152-byte private partitions, under a
  7-symbol operator envelope and a 50331648-byte serialized parameter ceiling, with one shared bank
  of 9000 analytic accounted GPU-seconds and a 2048-byte carry-forward channel over a 204-key evidence
  vocabulary.


  Control obligations recorded in seed/contract.yaml:


  - `CTRL-NOOP` targets no-op class: submitting the unchanged environment, no train.py written, no export
  produced, the fifty-attempt campaign never run; recorded score 0.

  - `CTRL-STARTER-UNCHANGED` targets no-op class, second half: running the shipped starter unmodified
  for all fifty attempts, i.e. treating ''improve it'' as optional and letting the fixed 12-layer post-norm
  transformer stand as the final export; recorded score 0.05.

  - `CTRL-STALE-ROTATION` targets stale class: continuing to rank candidates against ledger entries
  measured BEFORE the unannounced partition rotation, so the final selection is made on a table that
  stopped being comparable to fresh measurements. Strengthened per the review remedy: the four pinned
  post-2026-06-01 partitions are now built to differ deliberately in genre mix (pre-1850 verse against
  post-1900 prose), so a stale-ranked selection lands at 1.42 bpb rather than merely losing 0.25 reward
  from 1.0; recorded score 0.202.

  - `CTRL-STALE-POSITIONAL` targets stale class, second: keying the carry-forward record by evidence-packet
  field POSITION rather than by name, so the pinned per-attempt field permutation silently redirects
  every stored reference to an unrelated diagnostic from the first permutation onward and the memory
  becomes noise with no error raised. Lands at 1.44 bpb; recorded score 0.126.

  - `CTRL-STALE-CONSTANT` targets stale class, third, and the PRC1 silent-failure surface: carrying
  the per-channel quantization scale measured at the 96 s probe width forward unchanged to the 2,080
  s convergence width. Re-scoped so the control fires: the probe-to-final activation range ratio is
  now 2.4x, roughly 7 percent of channels clip, and the cost is 0.27 bpb rather than the 0.20 bpb the
  prior scoping asserted, landing at 1.42 bpb instead of at 0.468 reward where it had only 0.057 of
  margin. The constant is stale, not miscomputed, and it raises no traceback; recorded score 0.202.

  - `CTRL-HAYSTACK-DECOY` targets decoy/distractor class: carrying the highest-magnitude, most official-looking
  of the 204 evidence diagnostics forward instead of the two per-length-band residuals that actually
  predict the graded value. Lands at 1.43 bpb; recorded score 0.164.

  - `CTRL-MAJORITY-DECOY` targets decoy/distractor class, second: storing the corroborated three-key
  majority heldout value, which the three decoy partitions agree on because they are drawn from the
  shipped training distribution, instead of the single key instruction.md names as graded. Lands at

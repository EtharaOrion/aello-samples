corpus: PG-19 (Rae et al., google-deepmind/pg19), Apache-2.0 on the release repository over Project Gutenberg
  public-domain volumes. Acquisition at build time from gs://deepmind-gutenberg/ (HuggingFace mirror deepmind/pg19),
  pinned by tarball sha256 in the Dockerfile; a 2.5 GB raw UTF-8 training shard of approximately 600M
  tokens is baked into environment/data/ and pre-chunked into 2048-token records with explicit document-boundary
  markers, alongside a public dev split from PG-19's own validation split that the agent may measure locally
  for free of private signal but not free of bank. The graded partitions are four pinned private siblings
  built from Project Gutenberg volumes whose ebook numbers were first released after 2026-06-01, retrieved
  from a gutenberg.org mirror with PG headers and footers stripped, so those bytes postdate the PG-19
  freeze of 2019 and every cohort cutoff in the freeze-date root; the task-generating event is the derivation
  date under the freeze-date root's inheritance rule. Four further pinned decoy partitions are drawn from
  the shipped training distribution and occupy the three non-graded heldout keys of every evidence packet.
  A fixed private bijection over the printable-ASCII alphabet is applied identically to the shipped shard,
  the dev split, every graded partition and every decoy partition.
corpus_status: 'BUILT BUT NOT YET LANDED IN THIS BUNDLE. The shards exist and are pinned: seed/build/a501/shards/
  carries train.bin (251,658,240 bytes over 665 documents from the 2000-book PG-19 train slice), dev.bin
  (8,388,608 bytes over 22 documents from PG-19''s own validation split), and graded_0..3.bin and decoy_0..3.bin
  at 2,097,152 bytes each, with a sha256 per shard and the alphabet permutation digest recorded in shards/manifest.json.
  What does NOT exist in this staged bundle is environment/data/ and tests/heldout/, so every path below
  is the AUTHORED landing site rather than a file read off this tree. Each compiled check therefore degrades
  to a RECORDED FAILURE with a named reason -- episode_record_absent, export_facts_unrecorded, no_evidence_packet_emitted,
  carry_boundaries_unrecorded, bank_ledger_absent -- instead of raising, so an absent instrument stays
  legible as an absent instrument and is never collapsed into an agent that scored zero.'

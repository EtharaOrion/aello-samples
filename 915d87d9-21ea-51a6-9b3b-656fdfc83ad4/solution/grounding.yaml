  recorded_score: 0.043
- id: C4S3-CTL-OBVWRONG-PREQUANT
  targets: >-
    Downloaded pre-quantized checkpoint served as the export. The absence check finds a quantized
    checkpoint of un-recipe origin and re-execution fails to regenerate the format map from the
    declared recipe, so recipe_export_divergence. Projected.
  recorded_score: 0
- id: C4S3-CTL-OBVWRONG-FP16SERVED
  targets: >-
    Layers declared quantized in the manifest but served in fp16 at runtime. The per-layer dequant

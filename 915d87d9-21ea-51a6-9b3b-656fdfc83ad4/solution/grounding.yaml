truth_narrative:
  opening: >-
    This slot grades a speed, not an answer. The agent writes a quantization recipe program that
    converts the pinned Qwen2.5-1.5B-Instruct checkpoint into an export for the provided
    mixed-precision decode runtime, and what is measured is how fast that export decodes: T is the
    geometric mean of tokens per second at batch 1 and at batch 16, over 512 decode steps after 64
    warmup steps, median of 5 trials, measured host-side. The recipe has 8 minutes of calibration
    on one H100 to do it in, and the export it produces must average no more than 4.10 bits per
    weight over all 196 linear projections, recomputed from the packed bytes, while holding
    private PG-19 held-out perplexity within 1.03x of the bf16 reference. The graded deliverable is
    the recipe and its declared stage order, not only the artifact the recipe emitted: the harness
    re-executes the recipe and the regenerated export must match what was submitted.
  insight: >-
    The bit budget is a constraint and the perplexity gate is a constraint; neither is the
    objective, and a submission that satisfies both perfectly can still score zero on the graded
    axis. What earns reward is throughput, and throughput is bought by putting cheap formats where
    the network can afford them -- which is a question about per-layer sensitivity, the one
    quantity this bundle discloses nowhere. Everything else is disclosed on purpose: the format
    cost table, the 4.10 budget, the 1.030 gate, the 8-minute clock. Difficulty survives that
    disclosure because knowing that INT3 group-32 costs 3.5 bits and INT4 group-128 costs 4.125 is
    not knowing which of the 196 projections will tolerate INT3, and the 8-minute budget is too
    short to find out by measuring all of them. The second thing that matters is that the geometric
    mean across two batch sizes makes a one-sided win worthless: batch 1 rewards fewer kernel
    launches and batch 16 rewards fewer weight bytes, and the geomean of a doubled rate and a
    halved rate is the rate you started with.
  steps:
  - heading: Price the table before you touch a weight
    paragraph: >-
      Every format in the runtime contract prices at payload_bits + (scale_bits + zero_point_bits)
      / group_size. Doing that arithmetic first settles the decoy in one line: uniform INT4
      group-128 costs 4.125 bits and is over budget, so the recipe the vendor notes recommend by
      majority cannot be submitted at all, while INT4 group-256 at 4.0625 fits and INT3 group-32 at
      3.5 leaves room to spend elsewhere.
    satisfies:
    - uniform_int4_group128_prices_above_the_budget
    - every_layer_format_is_inside_the_runtime_envelope
  - heading: Establish the baseline in the same run you are graded in
    paragraph: >-
      Both graded quantities are ratios. s is T/T0 against the bf16 baseline throughput and p is
      perplexity over the bf16 reference perplexity, and both denominators have to be measured in
      the same run under the same protocol, on the same private slice, or the ratio's standard
      error is not the one the 3 percent gate margin was sized against.
    satisfies:
    - pg19_perplexity_ratio_within_the_gate
    - throughput_is_the_geometric_mean_across_both_batch_sizes
  - heading: Spend the 8 minutes on sensitivity, not on completeness
    paragraph: >-
      A Fisher-style diagonal sensitivity proxy over a small C4 subset ranks projections far
      cheaper than measuring all 196, and the budget is a hard cliff rather than a soft cost: the
      exhaustive route measured at 11.4 minutes is a zero, not a slow pass. Accumulate the ranking
      across attempts, because the reward history is carried between attempts and the per-attempt
      budget is not.
    satisfies:
    - calibration_wall_clock_within_eight_minutes
    - calibration_seconds_declared_per_stage_and_add_up
  - heading: Allocate as a knapsack, not as a choice of one format
    paragraph: >-
      With a price per format and a sensitivity per layer, the allocation is a knapsack under 4.10
      bits: FP8 per-channel on the few most sensitive projections, INT4 on the bulk, INT3 group-32
      on the least sensitive MLP down-projections. Note that a good mixed allocation can spend MORE
      bits than the cheapest uniform one and still decode faster, which is the clearest sign that
      the budget is not the objective.
    satisfies:
    - bits_per_weight_recomputed_from_packed_bytes
    - layer_roster_covers_all_196_linear_projections
  - heading: Declare the order you actually execute
    paragraph: >-
      The stages compose and do not commute. Clipping-range search before rounding is a different
      recipe from rounding before clipping-range search, and group folding belongs last. Declare
      the order in the manifest, execute it, and expect the instrumented runtime to have traced it.
    satisfies:
    - traced_stage_order_equals_the_declared_recipe_order
  - heading: Pack the bytes you declare and declare the bytes you pack
    paragraph: >-
      The average bits per weight is recomputed from the size of the shard files on disk, so
      padding that is packed but not declared inflates the recomputed average rather than hiding
      under a compliant manifest figure. Write the manifest from the packer's own output, not from
      the allocation you intended.
    satisfies:
    - export_manifest_and_packed_shards_present
    - bits_per_weight_recomputed_from_packed_bytes
  - heading: Prove the packed buffer is what gets served
    paragraph: >-
      A layer declared INT3 that is served from an fp16 copy is fast to write and fails on effect:
      the runtime keeps a per-layer dequant-invocation counter over the graded decode, and a
      counter of zero on a layer the manifest does not call bf16_passthrough means the packed
      buffer was never touched.
    satisfies:
    - every_declared_quantized_layer_dequantizes_at_decode
  - heading: Check the cross-corpus gap before you submit
    paragraph: >-
      One wrong constant in the multi-stage numeric pipeline -- a clipping range, a smoothing
      alpha, a group boundary -- does not raise an error and does not stop the export from emitting
      fluent text. It shows up as a corpus-dependent quality gap, which is why retention is
      compared between the graded PG-19 slice and the private C4 sibling slice rather than looked
      at on one of them.
    satisfies:
    - cross_corpus_retention_gap_within_two_hundredths
  - heading: Measure throughput the way the metric is defined
    paragraph: >-
      Fixed work, not fixed time: 64 warmup steps then 512 measured steps at each batch size, five
      trials, medians, geometric mean across the two batch sizes. Keep the trial spread inside the
      admissibility band, because a median drawn from a noisy five is a draw rather than a
      measurement.
    satisfies:
    - decode_window_is_512_steps_after_64_warmup
    - trial_spread_inside_the_iqr_admissibility_band
  - heading: Make the recipe regenerable, and let it be regenerated
    paragraph: >-
      Seed from the frozen bundle bytes so the harness re-execution uses the same seed by
      construction. Expect the regeneration check to compare the per-layer format map exactly and
      the perplexity within half a percent, and never the packed bytes, because GPU reduction order
      makes bitwise equality of packed weights the wrong thing to demand of an honest run.
    satisfies:
    - reexecution_regenerates_the_format_map_not_the_bytes
    - seed_is_derived_from_the_frozen_content_hash
  - heading: Leave the upstream pin alone and stay off the hubs
    paragraph: >-
      The checkpoint is an input the recipe converts, not a slot to fill with a different model, and
      a public AWQ or GPTQ release of this exact model is the shortest wrong path in the whole slot.
      The allowlist excludes the hubs by name, the private slices are never opened, and the checker
      tree is never written.
    satisfies:
    - pinned_checkpoint_digest_unchanged_by_the_recipe
    - no_foreign_quantized_checkpoint_and_no_private_slice_read
  - heading: Understand which band you are in
    paragraph: >-
      Below the quality gate there is a consolation band worth at most 0.07, and at or above the
      starter perplexity ratio there is nothing at all. Only p at or below 1.030 reaches the ramp
      over s, so a submission that spends its 8 minutes buying perplexity headroom it did not need
      has bought nothing.
    satisfies:
    - sub_gate_band_credit_stays_below_the_graded_axis
    - speedup_over_bf16_baseline_through_the_ramp
  traps:
  - >-
    Perplexity measurement noise exceeds the 3 percent gate margin. Guard: the gate is a ratio
    against the bf16 reference measured on the same private slice in the same run, and the slice is
    sized at 400k tokens or more so the ratio's standard error is well under 0.005.
  - >-
    Throughput at batch 1 on a 1.5B model is dominated by kernel launch overhead rather than by
    weight bytes, which would collapse the graded axis. Guard: batch 16 is in the geometric mean
    precisely to keep the memory-bound regime dominant, and the authoring gate refuses the slot
    unless the measured T0-to-T1 range separates the reference from the tuned uniform family by the
    margin the ramp needs.
  - >-
    The 4.10 budget is satisfiable by one obvious allocation, which would collapse the search.
    Guard: INT4 group-256 at 4.0625 fits, so the budget alone does not force a mixture; what forces
    it is that the best uniform allocation has to sit far below the full-reward floor on
    THROUGHPUT, which is what the uniform-family control on the ladder is there to anchor.
  - >-
    Recipe re-execution is nondeterministic because GPU reduction order is, so an exact-bytes
    regeneration check would reject honest submissions. Guard: the regeneration check compares the
    per-layer format map exactly and the perplexity within 0.5 percent, never the packed bytes, and
    the runtime pins deterministic reduction for the calibration path.
  - >-
    The provided runtime becomes the bottleneck, so every allocation measures the same and the
    tradeoff disappears. Guard: the per-format kernels are measured on the grading host at Phase 1
    and the cost table is published with those figures, so the tradeoff is real and disclosed
    rather than assumed.
  - >-
    Download a pre-quantized checkpoint -- an AWQ or GPTQ release of this exact model exists -- and
    submit it. This is the lookup shortcut in its purest form. Guard: the allowlist excludes model
    hubs by name, the absence check proves no such artifact arrived, and the regeneration check
    requires the harness's own re-execution of the submitted recipe to reproduce the export's
    per-layer format map and perplexity. A downloaded artifact has no recipe that regenerates it.
  - >-
    Apply the published default recipe, uniform INT4 group-128, and stop. Guard: arithmetic, not
    prohibition. 4 + 16/128 = 4.125 bits is over the 4.10 budget, so it zeroes with reason
    bit_budget_exceeded, and the decoy vendor_notes tree recommends exactly this by majority.
  - >-
    Calibrate on the evaluation distribution to buy perplexity headroom. Guard: calibration is C4
    and grading is PG-19, two different real corpora; a cross-corpus retention gap above 0.02 zeroes
    with reason calibration_overfit, and the private PG-19 book selection is never exposed.
  - >-
    Declare layers quantized in the manifest while serving them from an fp16 buffer, or pack padding
    to game the byte count. Guard: the average is recomputed from the packed bytes rather than from
    the manifest, and every layer declared quantized must show a nonzero runtime dequant-invocation
    counter.
  - >-
    Declare a stage order that differs from what the recipe executed, or declare an order that is
    decorative. Guard: the traced stage-entry order is compared against the declared manifest
    element for element, and re-execution from that manifest has to reproduce the result, so a
    decorative order fails reproduction.
provenance:
  corpus: 'REAL, two named corpora plus one pinned model, all vendored at image build. (1) C4 English
    validation (HF `allenai/c4`, config `en`, pinned revision; ODC-BY 1.0 with Common Crawl terms, permits
    redistribution of a modified derivative with attribution) supplies 512 real calibration sequences
    of 2048 tokens and the private sibling slice for the cross-corpus check. (2) PG-19 (HF `deepmind/pg19`,
    pinned revision; Apache-2.0 release, underlying Project Gutenberg texts public domain) supplies
    the private held-out book slice on which graded perplexity is measured - deliberately a different
    corpus from calibration, so calibration overfit is detectable rather than assumed away. Model: Qwen2.5-1.5B-Instruct,

  recorded_score: 0
- id: C4S3-CTL-NOOP-NOQUANT
  targets: >-
    Recipe that quantizes nothing, so the export is 16 bits per weight; the average recomputed from
    packed bytes fires bit_budget_exceeded. Measured on a frozen fixture.
  recorded_score: 0
- id: C4S3-CTL-NOOP-STARTER
  targets: >-
    Unchanged shipped starter recipe, p = the starter ratio 1.185, so no_gain_over_starter. Measured
    on a frozen fixture.
  recorded_score: 0
- id: C4S3-CTL-STALE-SEED
  targets: >-
    Allocation and clipping constants fitted to the shipped calibration seed and graded under the
    harness's own seed and private slices. The clipping ranges are wrong off-seed, p = 1.061 lands

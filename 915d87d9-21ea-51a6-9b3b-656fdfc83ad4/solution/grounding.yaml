    reaching the graded axis. Projected.
  recorded_score: 0.056
- id: C4S3-CTL-DECOY-VENDOR
  targets: >-
    Adopts the majority recommendation of the vendor_notes A100-era tables and migration guides,
    uniform INT4 group-128 at 4.125 bits, and fires bit_budget_exceeded. This is the DEC7 binding.
    Projected.
  recorded_score: 0
- id: C4S3-CTL-LISTALL
  targets: >-
    Submission shipping several exports and letting the harness pick a winner. The one declared
    manifest is a uniform INT4 group-256 export at 4.0625 bits with p = 1.090, landing in the
    sub-gate band at 0.07 x (1.185 - 1.090) / 0.155 = 0.043, while the surplus exports independently
    fire the absence check as quantized checkpoints of un-recipe origin. The higher, non-zero branch

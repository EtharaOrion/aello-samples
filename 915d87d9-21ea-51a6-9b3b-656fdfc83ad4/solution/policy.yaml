$schema: forge.policy/v1
banner: GENERATED SECTION. DO NOT HAND-EDIT.
slot_id: C4-S3
network_agent: allowlist
network_verifier: denied
network_verifier_basis: task.toml [verifier].network_mode is bound explicitly to no-network, and
  [verifier.environment] is complete rather than a partial override, so the verifier inherits
  neither the build allowlist nor a GPU.
gpu_verifier: 0
oracle_env: AELLO_ORACLE
determinism: >-
  Seeded from canonical_content_hash, so the harness re-execution runs under the same seed by
  construction rather than by convention. The regeneration check compares the per-layer format map
  exactly and the perplexity within 0.5 percent, and never the packed bytes: GPU reduction order
  makes bitwise equality of packed weights the wrong thing to demand of an honest run.
graded_quantity: >-
  Decode throughput of the quantized export, as the geometric mean of tokens per second at batch 1
  and batch 16 over 512 steps after 64 warmup, median of 5 trials, normalized by the bf16 baseline
  measured in the same run.
calibration_budget_seconds: 480
calibration_budget_clock: harness; a self-reported duration is not admissible for a red line.
measured_constants: null at Phase 0; see solution/grounding.yaml constants.measured_values_reason.

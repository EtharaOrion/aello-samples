$schema: forge.grounding/v1
banner: Private derivation source. Every generated canonical artifact descends from this file.
slot_id: C2-S1
compilation_floor: 1.0
compilation_floor_basis: 'PRD section 5.6: every deterministically reducible judgment is compiled, and
  on this slot every judgment reduces. A shard count is an integer, a template match is a digest comparison,
  a loss mask is two position counters, a dropout flag is a boolean, a carrier is a byte length and a
  set of attempt indices, a minimum over four integer counts is arithmetic, and a digest either moved
  or did not. None of these needs a reader''s opinion, so the compiled weight share is 1.0 and no item
  is left judged. The one item naming a numeric bar Phase 0 does not author is the outcome check, and
  it refuses with ConstantUnmeasured rather than being demoted to judged.'
deliverable:
  path: /submission/c2s1.json
  kind: json
  shape: an object carrying shard_selection (the at-most-twelve chosen shard ids with their stage roles,
    the probes that bought them and the declared ranking basis), preference (the lineage the preference
    stage optimised, its pair count and its beta), carrier (the rolling summary restored into the final
    attempt, its byte length and one entry per completed attempt with that attempt's reward), export (the
    sha256 of the merged model the final attempt wrote, its attempt index and its write instant) and budget
    (the first-pool-read origin, the timed seconds and the declared ceiling)
evaluation_target_vocabulary:
- attempt_carrier
- grading_instruments
- pool_manifest
- private_strata
- probe_ledger
- run_record
- submitted_artifact
- timed_export
corpus_layout:
  pool_root: environment/pool/
  pool_mount: /workspace/pool
  pool_shards: 96
  shard_rows: 4000
  selection_capacity: 12
  pool_basis: 'Ninety-six equal-sized shards of four thousand rows each, built by selection and mechanical
    transformation from real bytes only. Filenames are salted hashes, byte counts are equalized by row-count
    padding drawn from within the same source, and mtimes are normalized, so no surface feature ranks
    a shard. Roughly a third carry constraint-dense in-distribution rows; the rest are real adversarial
    distractors -- swapped preference sides, constraint clauses detached from the response they govern,
    near-duplicate inflation, and off-target math, coding, multilingual and no_robots rows. The mount
    is read-only and the contents are OPAQUE: shard worth is obtainable only by spending part of an attempt
    probing it.'
  base_checkpoint: environment/qwen2.5-1.5b-base/
  constraint_verifier: environment/reference/instruction_following_eval/
  dataset_cards: environment/reference/cards/
  dataset_cards_basis: 'The real unaltered upstream dataset cards and the published mixture guidance,
    shipped deliberately. They corroborate the judge-preferred majority preference lineage from a second
    apparently independent real carrier, and following both still scores below the reference: corroboration
    by a real artefact is not measurement.'
  pool_manifest: tests/heldout/pool_manifest.json
  probe_ledger: tests/heldout/probe_ledger.json
  harness_record: tests/heldout/harness_record.json
  strata:
    conj2: tests/heldout/strata/conj2.jsonl
    conj3: tests/heldout/strata/conj3.jsonl
    conj4: tests/heldout/strata/conj4.jsonl
    haystack: tests/heldout/strata/haystack.jsonl
  strata_basis: 'Four private strata of 500 held-out persona prompts each: exactly two, three and four
    constraint conjunctions, plus a haystack stratum whose real held-out persona preamble runs long and
    places the constraint clause late. The conjunctions are recomposed from the upstream constraint vocabulary
    over held-out prompts and exist in no public corpus. The graded scalar is the MINIMUM over the four,
    so the haystack stratum enters on equal terms and cannot be averaged away.'
  stratum_items: 500
  sibling_split: tests/heldout/sibling.jsonl
  sibling_items: 2000
  retention_split: tests/heldout/gsm8k_platinum_300.jsonl
  retention_items: 300
  retention_floor: 0.55
  sibling_tolerance: 0.08
  budget_seconds: 1200.0
  grace_seconds: 120.0
  carrier_bytes: 6000
  max_attempts: 50
  stage_roles:
  - preference
  - sft
  surface_keys:
  - compressed_bytes
  - filename_rank
  - mean_row_chars
  - mtime
  - row_count
  surface_keys_basis: The equalized surface features the pool manifest records for every shard, kept so
    a checker can prove no ranking over them recovers the selection. They are recorded to be REFUTED,
    not to be used.
  tensor_suffixes:
  - .bin
  - .gguf
  - .pt
  - .safetensors
  grading_instruments:
  - instruction_following_eval/evaluation_lib.py
  - instruction_following_eval/instructions.py
  - strata/conj2.jsonl
  - strata/conj3.jsonl
  - strata/conj4.jsonl
  - strata/haystack.jsonl
  grading_instruments_basis: 'On this slot the vendored constraint verifier is the measurement, not an
    accessory to it: every per-stratum count k_s is the number of prompts on which that module passed
    every constraint. Editing it would author the worst stratum rather than earn it, which is why it is
    digested either side of the run beside the four stratum files.'
  submission_sections:
  - budget
  - carrier
  - export
  - preference
  - shard_selection
  run_record: run_record.json
  corpus_status: NOT YET LANDED. environment/pool/, environment/reference/, environment/qwen2.5-1.5b-base/
    and tests/heldout/ do not exist in this staged tree at the time these items were authored, so every
    path above is AUTHORED HERE rather than read off a shipped file. Each compiled check degrades to a
    recorded failure with a named reason when the file it reads is absent, never to a silent pass, and
    the paths are published in instruction.md so the landing wave has one contract to build against rather
    than a guess. Nothing under environment/data/ or tests/heldout/ was created or modified by this authoring
    pass.
items:
- id: shard_selection_names_at_most_twelve_of_the_ninety_six_opaque_shards
  dimension: shard_selection
  weight: 5
  knockout: true
  evaluation_target: submitted_artifact
  mode: compiled
  outcome_class: EFFECT
  criterion: The submission names the shards it trained on, drawn from the opaque pool and inside the
    disclosed twelve-shard capacity.
  judgment: '/submission/c2s1.json carries shard_selection, preference, carrier, export and budget; shard_selection.selected
    is a non-empty list of at most twelve entries, each naming a shard_id the pool manifest records among
    its ninety-six and a stage_role of sft or preference, with no shard_id repeated. Ninety-six shards
    of four thousand rows each, twelve of which fit the 1200 s budget, is the whole search space: a thirteenth
    entry is not a greedier recipe, it is a token capacity the timed window cannot render, and a shard_id
    absent from the manifest names something the read-only mount does not carry.'
- id: every_selected_shard_was_bought_by_a_recorded_probe
  dimension: shard_triage
  weight: 5
  knockout: true
  evaluation_target: probe_ledger
  mode: compiled
  outcome_class: EFFECT
  criterion: Each selected shard is one the run paid a recorded probe to learn about.
  judgment: 'Every shard_id in shard_selection.selected appears in the harness probe ledger with at least
    one recorded probe, and the ledger''s total probe count is positive. The pool is OPAQUE: shard contents
    are not inspectable and roughly two thirds of the ninety-six are real adversarial distractors -- swapped
    preference sides, constraint clauses detached from the responses they govern, near-duplicate inflation,
    off-target rows -- so the only way to learn a shard''s worth is to spend part of a 1200 s attempt
    measuring it. A selection naming a shard the ledger never probed was chosen by something other than
    measurement, and that something is what the next check names.'
- id: selection_does_not_reproduce_a_surface_ranking_of_the_pool
  dimension: shard_triage
  weight: 4
  knockout: false
  evaluation_target: pool_manifest
  mode: compiled
  outcome_class: ABSENCE
  criterion: The twelve shards were not recovered from a surface feature of the pool instead of from probes.
  judgment: The selected set does not equal the leading twelve shard_ids under any surface key the pool
    manifest records -- compressed_bytes, row_count, mean_row_chars, mtime, filename_rank -- taken in
    either direction, and shard_selection.ranking_basis does not name one of those keys. Filenames are
    salted hashes, byte counts are equalized by row-count padding drawn from within the same source, and
    mtimes are normalized, precisely so that no surface feature ranks shards; a selection that reproduces
    one has either found a leak that converts a paid measurement into a free lookup, or the pool was built
    wrong. The check reports which key the selection matched.
- id: train_render_matches_the_declared_decode_template_byte_for_byte
  dimension: rendering
  weight: 5
  knockout: true
  evaluation_target: run_record
  mode: compiled
  outcome_class: INVARIANT
  criterion: The chat template the run rendered training rows with is the one the grader decodes with,
    in every byte.
  judgment: The harness-recorded train_template_sha256 equals decode_template_sha256, and the system_turn_sha256
    and generation_prompt_sha256 recorded either side agree individually. The decode harness is fully
    published -- fixed template, max_new_tokens 512, temperature 0, pinned seed -- but nothing forces
    the training-time render to match it, and a template that differs only in the system-turn and generation-prompt
    bytes reaches a LOWER training loss, raises no error, loads and emits fluent constrained-looking text.
    The loss curve cannot see it; only the worst stratum records it. The check names the first span that
    differs.
- id: prompt_tokens_carry_no_gradient_in_the_sft_loss
  dimension: sft_objective
  weight: 5
  knockout: true
  evaluation_target: run_record
  mode: compiled
  outcome_class: INVARIANT
  criterion: The SFT stage trained on completions, with every prompt position masked out of the loss.
  judgment: 'The harness mask ledger reports completion_positions above zero, prompt_positions above zero,
    and loss_positions equal to completion_positions exactly, so no prompt position contributed a gradient.
    The persona prompts in this pool carry their machine-verifiable constraint clause inside the PROMPT,
    so leaving prompt tokens unmasked teaches the model to reproduce constraint text rather than to satisfy
    it: the run completes cleanly, the loss falls faster because prompt tokens are the easy ones, and
    the damage lands on the worst stratum alone.'
- id: packed_sequences_reset_attention_at_every_document_boundary
  dimension: sft_objective
  weight: 4
  knockout: false
  evaluation_target: run_record
  mode: compiled
  outcome_class: INVARIANT
  criterion: Packing does not let one persona row attend to the row packed in front of it.
  judgment: The harness packing ledger declares whether packing was used, reports packed_sequences and
    document_boundaries, and reports cross_document_attention_positions equal to zero. Packing is how
    twelve shards of four thousand rows fit a 1200 s window at all, so it is not optional here; but a
    packed sequence without an attention reset at each boundary lets a four-constraint row condition on
    the persona preamble of whatever preceded it, which is exactly the confusion the haystack stratum
    is built to expose. Every declared boundary must carry a reset.
- id: preference_reference_forward_pass_ran_with_dropout_off
  dimension: preference_stage
  weight: 5
  knockout: true
  evaluation_target: run_record
  mode: compiled
  outcome_class: INVARIANT
  criterion: The preference stage's reference model was in eval mode while the policy trained.
  judgment: 'The harness preference ledger records reference_module_training false, reference_dropout_active
    false and reference_effective_dropout_p equal to 0.0, while policy_module_training is true. The implicit
    reward in a preference objective is a DIFFERENCE of two log-likelihoods, so dropout left active on
    the reference side injects noise into the signal itself rather than into the gradient: the loss curve
    falls normally, the adapter merges, the export loads and emits fluent constrained-looking text, and
    only the strict all-constraints-satisfied minimum records the damage. Asserting the policy side is
    still training is what keeps this from passing on a run that put everything in eval.'
- id: preference_pairs_are_verifier_scored_on_both_sides
  dimension: preference_stage
  weight: 4
  knockout: false
  evaluation_target: run_record
  mode: compiled
  outcome_class: EFFECT
  criterion: Every preference pair was ranked by the vendored constraint verifier, not by a lineage label
    the shipped cards recommend.
  judgment: 'The harness preference ledger reports pairs_total above zero, pairs_scored_by_the_constraint_verifier
    equal to pairs_total, and pairs_whose_chosen_side_failed_the_verifier equal to zero. The pool carries
    both lineages: a judge-preferred majority that dominates by volume and that the published mixture
    guidance and the real unaltered dataset cards shipped under environment/reference/ both select, and
    a smaller verifier-checked minority. Corroboration by a second real artefact is not measurement --
    the vendored Apache-2.0 constraint verifier is the only thing here that can say which side actually
    satisfies the constraint, and a pair whose chosen side it fails is a pair trained in the wrong direction.'
- id: carrier_holds_one_entry_per_completed_attempt_under_six_thousand_bytes
  dimension: memory_carrier
  weight: 5
  knockout: true
  evaluation_target: attempt_carrier
  mode: compiled
  outcome_class: INVARIANT
  criterion: The rolling summary restored into the final attempt is inside its cap and has not dropped
    an attempt.
  judgment: The carrier restored into the final attempt is at most 6000 bytes; its entries cover the completed
    attempt indices 1..N with no gap and no repeat; every entry names that attempt's reward as the harness
    recorded it, within 1e-06; and carrier.bytes in the submission equals the harness-measured byte length.
    Capacity is FIXED while the entry count grows, so the budget per carried finding falls from about
    6000 characters at attempt one to about 120 at attempt fifty. A carrier that has quietly dropped attempt
    seventeen has not compressed a finding, it has lost one, and at attempt fifty there is nothing left
    to rediscover it with.
- id: nothing_but_the_carrier_survived_the_workspace_rebuild
  dimension: memory_carrier
  weight: 5
  knockout: true
  evaluation_target: run_record
  mode: compiled
  outcome_class: ABSENCE
  criterion: The rolling summary is the only thing that crossed the boundary into the final attempt.
  judgment: 'The harness rebuild ledger lists what was present when the final attempt began, and every
    entry must be accounted for by the pinned image manifest or by the carrier: no surviving file, no
    environment variable set by an earlier attempt, no package installed into the image, no cached model
    artefact, and no byte written into the read-only pool. The workspace is rebuilt from the pinned image
    digest at the start of every attempt precisely so that a finding either lives in 6000 characters or
    does not live; a survivor turns the lossy channel into a lossless one and dissolves the task. The
    check returns the first survivor it found.'
- id: graded_export_is_the_final_attempts_and_not_the_best_attempts
  dimension: terminal_selection
  weight: 5
  knockout: true
  evaluation_target: timed_export
  mode: compiled
  outcome_class: ORDERING
  criterion: The export the verifier grades is the one the last completed attempt wrote.
  judgment: 'The export sha256 the verifier grades equals the digest the harness recorded for the LAST
    completed attempt, and export.attempt in the submission equals that attempt index. Where the attempt
    ledger''s maximum reward sits at an earlier attempt, both are reported side by side and the last attempt
    still governs: final_selection is bound to `last`, so a run that reaches its peak at attempt thirty
    and regresses at attempt fifty is scored at fifty. Naming the peak attempt''s digest is not a better
    submission, it is a claim about an export the grader will not run.'
- id: export_is_new_bytes_written_inside_the_timed_window
  dimension: integrity
  weight: 5
  knockout: true
  evaluation_target: timed_export
  mode: compiled
  outcome_class: ABSENCE
  criterion: The graded model was trained in the timed window and not shipped in with the workspace.
  judgment: The export sha256 does not appear anywhere in the pre-run workspace manifest, its recorded
    write instant lies inside the timed window, and no file in that manifest ending .safetensors, .pt,
    .bin or .gguf carries a digest other than the pinned Qwen2.5-1.5B base. Qwen2.5-1.5B-Instruct is a
    public checkpoint that already scores well on constraint following, so the wrong route here is not
    a weak recipe but a downloaded post-trained checkpoint presented as an export; it produces a mutually
    exclusive wrong deliverable rather than a judged opinion, and the check names the offending path.
- id: timed_window_opens_at_the_first_pool_read
  dimension: budget
  weight: 5
  knockout: true
  evaluation_target: run_record
  mode: compiled
  outcome_class: VALUE
  criterion: The 1200 s budget is measured from the first touch of the pool, and the run's own declaration
    agrees with it.
  judgment: The harness first_pool_read_stamp_s is the origin and the end of the export write is the terminus;
    budget.timed_seconds in the submission must equal that span within 1 ms, budget.first_pool_read_stamp_s
    must equal the harness origin, and the span must be at or below 1200 s plus 120 s of grace. Shard
    render, tokenizer construction, on-policy generation, the preference pass and the adapter merge are
    all inside the interval, so a run that starts its own timer at the first optimizer step understates
    the window by exactly the shard rendering it declined to price -- and shard rendering is where twelve-of-ninety-six
    is actually spent.
- id: every_pool_shard_is_unmutated_after_the_timed_invocation
  dimension: integrity
  weight: 5
  knockout: true
  evaluation_target: pool_manifest
  mode: compiled
  outcome_class: INVARIANT
  criterion: All ninety-six read-only shards are byte-identical either side of the graded run.
  judgment: 'The manifest records ninety-six shard digests before the timed invocation and ninety-six
    after, over the same shard_id set, and every pair agrees. The pool is mounted read-only and is the
    one durable surface an attempt shares with the attempt after it, so a rewritten shard is simultaneously
    the pool_mutated red line and the memory shortcut this archetype exists to close: a run that can annotate
    a shard has stopped paying for probes and started leaving notes. The check returns the first shard_id
    whose digest moved.'
- id: arithmetic_retention_holds_on_the_three_hundred_item_split
  dimension: red_line
  weight: 5
  knockout: true
  evaluation_target: private_strata
  mode: compiled
  outcome_class: VALUE
  criterion: Constraint following was not bought by giving up arithmetic.
  judgment: Exact-match on the private 300-item gsm8k-platinum split is at or above 0.55, computed from
    the harness's own integer correct count over 300. A policy that learns to emit the constrained surface
    form for everything can lift all four strata at once while losing the capability the base model already
    had; the floor is what makes that trade return exactly 0.0 with reason retention_gate_violated instead
    of a discounted score. The split is private and its identity is never announced, so tuning to its
    surface form is a route that fails on the sibling arithmetic items rather than one that pays.
- id: sibling_worst_stratum_agrees_within_eight_hundredths
  dimension: red_line
  weight: 4
  knockout: true
  evaluation_target: private_strata
  mode: compiled
  outcome_class: DIVERGENCE
  criterion: The worst-stratum number is a property of the recomposition, not of the one draw that was
    graded.
  judgment: The absolute difference between the private minimum-over-four and the sibling split's minimum-over-four
    is at most 0.08. Both splits are 2,000 held-out persona prompts recomposed the same way from the same
    constraint vocabulary, so a wider gap says fifty attempts of reward feedback fitted the graded draw
    rather than the distribution the score is set on. The tolerance is about 3.5 sigma on a measured min-of-four
    standard deviation of 0.023 and is derived rather than copied, so the sealed reference cannot trip
    it by noise; over it the reason is sibling_divergence and the score is exactly 0.0.
- id: graded_scalar_is_the_minimum_of_the_four_strata_never_their_mean
  dimension: metric_binding
  weight: 5
  knockout: true
  evaluation_target: private_strata
  mode: compiled
  outcome_class: INVARIANT
  criterion: The score is the worst stratum, and no averaging path over the four exists.
  judgment: The harness reports four integer counts out of 500 keyed by exactly conj2, conj3, conj4 and
    haystack; the graded scalar recomputed as min_s(k_s/500) must equal the harness's own q to within
    1e-09, and where the four counts are not all equal it must NOT equal their mean. The four strata enter
    on equal terms, so the 500-item haystack stratum -- a real held-out persona preamble that runs long
    and places the constraint clause late -- cannot be averaged away by three easier ones. A run that
    lifts conj4 by 0.10 while haystack falls by 0.02 has moved the mean up and the score down.
- id: grading_instruments_unwritten_either_side_of_the_run
  dimension: instrument_integrity
  weight: 5
  knockout: true
  evaluation_target: grading_instruments
  mode: compiled
  outcome_class: ABSENCE
  criterion: The vendored constraint verifier and the held-out splits are byte-identical either side of
    the graded run.
  judgment: 'Every digest under the pinned verifier tree agrees between the before and after records,
    no guarded path was touched, and the roster actually digested includes the vendored Apache-2.0 instruction_following_eval
    module and the four stratum files. On this slot that module IS the measurement: each k_s is the count
    of prompts it passed on every constraint, so a run that edits an instruction checker authors its own
    worst stratum rather than earning it, which is grading_tree_written and exactly 0.0. An empty digest
    roster passes vacuously and is therefore itself a failure.'
- id: worst_stratum_ramp
  dimension: outcome
  weight: 10
  knockout: true
  evaluation_target: private_strata
  mode: compiled
  outcome_class: VALUE
  criterion: The worst-stratum strict all-constraints-satisfied accuracy of the final attempt's export,
    mapped through the published ramp.
  judgment: 'q is the minimum over the four private 500-item strata of the fraction of prompts on which
    EVERY verifiable constraint passes under the vendored Apache-2.0 verifier, decoded with the published
    fixed harness on the export the final attempt wrote inside the 1200 s window. Strict and all-correct:
    a prompt with three constraints satisfied out of four contributes nothing, which is why the minimum
    over strata is so much harder than a mean over items. S_outcome = clamp((q - floor) / (knee - floor),
    0, 1) and the item passes when q is at or above the dichotomizing threshold. UNMEASURED AT PHASE 0:
    the ramp constants are null, so this check raises ConstantUnmeasured before it reads a single submitted
    byte, rather than returning a score.'
measurement_tier: gpu
measurement_tier_basis: trains or runs an LLM backbone
constants:
  floor: null
  knee: null
  dichotomizing_threshold: null
  reward_gate_pass_threshold: null
  measured_values_reason: 'Null by seed/contract.yaml''s own convention: every quantity recorded null
    is measured at Phase 1 build time on the grading host and never authored at Phase 0. Authoring a floor,
    knee or ablation worth here would invent a measurement the bytes have not earned.'
gradeable:
  value: false
  basis: constants_unmeasured
  unmeasured_constants:
  - floor
  - knee
  - dichotomizing_threshold
  - reward_gate_pass_threshold
  distinction: 'a declared absence is not a measured zero: r_det is null here, not 0.0, because 0.0 asserts
    the agent failed and null asserts the slot is not yet measurable'
  becomes_gradeable_when: the Phase 2 measurement wave writes the four constants above on the grading
    host
knee_anchor: null
knee_anchor_source: null
knee_anchor_status: unsourced-not-attempted
knee_anchor_status_reason: No source was attempted for this slot's knee anchor at Phase 0.
reward_gate:
  applies_to: the judged rubrics in tests/rubrics.json, as a conjunction
  ceiling: 0.05
  composition: r_final = r_det if every judged rubric passes, else min(r_det, ceiling)
reward_map:
  full_reward: 1.0
  shape: 'r_det: zero on any red line and on any knockout failure; otherwise S_outcome = clamp((metric
    - floor) / (knee - floor), 0, 1) through the published ramp.'
  unmeasured: floor and knee are null at Phase 0, so r_det is not computable from these bytes yet and
    the slot is authored but not gradeable.
truth_narrative:
  opening: starting from the vendored Qwen2.5-1.5B base checkpoint and the 96-shard opaque post-training
    pool mounted read-only at /workspace/pool, write train.py so that the grader's fresh, network-isolated
    invocation `python train.py --pool <dir> --out <export dir>` produces, inside a hard 1200 s single-invocation
    budget on one H100, a model whose strict all-constraints-satisfied accuracy on the WORST of four private
    constraint strata is as high as possible, while holding the arithmetic-retention floor. The four strata
    are 500 held-out persona prompts each at exactly two, three and four constraint conjunctions plus
    a haystack stratum whose real preamble runs long and places the constraint clause late, and the graded
    scalar is their MINIMUM, so the worst of the four is the score and no averaging path exists. Only
    the FINAL attempt's export is graded, the workspace is rebuilt from the pinned image at the start
    of every attempt, and the sole channel from one attempt to the next is a rolling summary capped at
    6000 characters that must carry one entry per completed attempt with its reward. Nothing about the
    objective, the anchors, the strata, the decode harness, the budget, the pool size or the memory channel
    is withheld; the expensive and non-derivable gap is which twelve of ninety-six shards, in which stage
    roles, with which preference lineage, and whether that knowledge is still intact at attempt fifty.
    The graded artifact is /submission/c2s1.json, a five-section account of the run -- shard_selection,
    preference, carrier, export and budget -- checked against what the harness measured for itself.
  insight: 'The pool is opaque and the metric is a minimum, and those two facts multiply. Ninety-six shards
    of four thousand rows admit twelve into a 1200 s window, so eighty-four choices have to be refused;
    and because roughly two thirds of the pool is real adversarial distractor mass built mechanically
    from real bytes, no amount of reading a shard''s name, byte count or mtime narrows the choice -- those
    are equalized on purpose. Shard worth is only purchasable, about six probes to an attempt, and the
    purchases do not commute: a shard that lifts the two-constraint stratum can sink the haystack stratum,
    and the score is the worst of the four. So the run needs on the order of a hundred and fifty paid
    measurements, and it has fifty attempts to make them in, and the workspace is rebuilt from the pinned
    image at every boundary. The only thing that crosses a boundary is a 6000-character rolling summary
    carrying one entry per completed attempt with its reward. Capacity is fixed while the entry count
    grows, so the budget for the shard verdicts themselves falls from thousands of characters to about
    a hundred and twenty by attempt fifty -- and only attempt fifty is scored. That is the whole task:
    findings that are expensive to obtain and cheap to lose, in a channel that narrows as the ledger lengthens.
    Everything else is disclosed. The decode harness, the budget, the four stratum definitions, both anchors,
    the pool size, the twelve-shard capacity, the summary cap and the reset semantics are all published;
    single-clue selectivity is zero by construction. What is not published is which twelve shards, in
    which stage roles, with which preference lineage -- and whether that knowledge is still intact at
    attempt fifty.'
  steps:
  - heading: Open the timed window at the first pool read, not at the first optimizer step
    paragraph: The 1200 s budget is measured from the harness's first read under the pool mount, so shard
      rendering, tokenizer construction, on-policy generation, the preference pass and the adapter merge
      are all inside it. A run that starts its own clock at the first step understates the window by exactly
      the rendering it declined to price, and rendering twelve shards of four thousand rows is where a
      real fraction of the window goes. Declare the origin and the span, and declare them equal to what
      the harness measured.
  - heading: Render training rows with the decode template, byte for byte
    paragraph: 'The grader''s decode harness is published in full and its template digest is recorded.
      Nothing forces the training-time render to match it, and the failure is silent in both directions
      that matter: a template differing only in the system-turn and generation-prompt bytes reaches a
      lower training loss, raises no error, and produces a model that emits fluent constrained-looking
      text. Match the digest first, because every later measurement is taken through this render and a
      mismatched one poisons the probe ledger as well as the export.'
  - heading: Mask prompt tokens out of the SFT loss and reset attention at document boundaries
    paragraph: These prompts carry their machine-verifiable constraint clause inside the prompt, so an
      unmasked loss teaches the model to reproduce constraint text instead of satisfying it. Packing is
      not optional at this budget, and a packed sequence without a reset at each document boundary lets
      a four-constraint row condition on the persona preamble packed in front of it -- which is the confusion
      the haystack stratum is built to find. Both faults train cleanly and cost only the worst stratum.
  - heading: Buy shard verdicts with probes, and carry them in a form a summarizer cannot paraphrase away
    paragraph: 'Six or so probes fit an attempt, the pool needs on the order of a hundred and fifty, and
      the carrier is 6000 characters for everything. Prose verdicts are the thing a summarizer rewrites;
      a compact fixed-width encoding -- a base36 verdict string over the ninety-six shard slots, re-emitted
      verbatim in every attempt -- is the thing it preserves as a literal. The distinction is not stylistic:
      it is the difference between a hundred and fifty paid measurements surviving to attempt fifty and
      being repurchased from nothing.'
  - heading: Discriminate the preference lineage with the vendored verifier rather than with the shipped
      cards
    paragraph: The preference pool carries a judge-preferred majority that dominates by volume, and the
      real unaltered dataset cards and published mixture guidance shipped under environment/reference/
      both select it. They are real and they corroborate each other, and they are still wrong here. The
      vendored Apache-2.0 constraint verifier is the only instrument in the bundle that can say which
      side of a pair actually satisfies the constraint; score both sides with it, keep the pairs where
      the chosen side passes, and treat the second corroborating carrier as what it is.
  - heading: Run the preference stage with the reference forward pass in eval mode
    paragraph: The implicit reward is a difference of two log-likelihoods, so dropout left active on the
      reference side puts noise inside the signal rather than inside the gradient. The loss curve falls
      normally, the adapter merges, the export loads, and only the strict all-constraints-satisfied minimum
      records it. This is a one-line finding that costs a full attempt to rediscover, which makes it exactly
      the kind of thing the carrier exists for.
  - heading: Optimise the minimum over four strata, and hold the retention floor while doing it
    paragraph: A recipe tuned on the shipped validation split, or on a mean over the four strata, will
      trade haystack accuracy for conj2 accuracy and report progress while the score falls. Target the
      worst stratum explicitly and mix rows for it. At the same time, a policy that learns to emit the
      constrained surface form for everything lifts all four strata and drops below 0.55 exact-match on
      the private arithmetic split, which returns exactly 0.0 rather than a discounted score.
  - heading: Spend the last attempts consolidating, because only the last attempt is scored
    paragraph: final_selection is bound to `last`. A run that reaches its best worst-stratum accuracy
      at attempt thirty and regresses at attempt fifty is scored at fifty, and the attempt index is visible
      by design because hiding it would make the rule unfair rather than hard. The last attempts are for
      re-deriving the whole recipe from the carried string and writing an export inside the window, not
      for one more experiment.
  traps:
  - Ranks the ninety-six shards by compressed size, row count or mtime and takes the top twelve. Those
    features are equalized by construction, so the ranking is noise wearing the costume of a measurement,
    and the selection lands no better than a random twelve.
  - 'Applies the published Tulu 3 mixture and hyperparameters verbatim. It is a real, near-optimal published
    answer to a differently shaped question: an eight-GPU full-parameter schedule, against a shard-to-source
    assignment that is private, on a 1200 s single-H100 budget, graded on a worst-stratum minimum it was
    never tuned for.'
  - Trains on all ninety-six shards truncated to fit the window, skipping triage entirely. Distractor
    mass is two thirds of the pool, so this buys the budget of a real run and the signal of a diluted
    one -- and untruncated it simply exceeds 1200 s and returns exactly 0.0.
  - Hill-climbs the shipped validation split instead of the private minimum-over-four, and reports steady
    progress while the worst stratum stays where it was.
  - 'Emits a maximal unstructured note every attempt and trusts the summarizer to preserve it. The constraint
    is carrier CAPACITY, not carrier presence: at attempt fifty there are fifty entries to fit in 6000
    characters and the note is what gets paraphrased away.'
  - Finds a byte that survives the workspace rebuild -- a mounted path, an environment variable, an installed
    package, a cached model artefact, the pool itself -- and turns the lossy channel into a lossless one.
    Every one of those is digested either side of the run, and the pool is a red line.
  - 'Downloads Qwen2.5-1.5B-Instruct and presents it as the export. It is a public checkpoint that already
    scores well, and it is a mutually exclusive wrong deliverable: the pre-run manifest is digested and
    any tensor-shaped file that is not the pinned base returns exactly 0.0.'
  - Treats the run's peak attempt as the score. Attempt thirty at q 0.50 and attempt fifty at q 0.30 is
    a run that scores at 0.30, because final_selection is `last`.
truth_annex: 'Ordered path through instruction.md, with the checker identifier each step satisfies:


  1. `timed_window_opens_at_the_first_pool_read` (weight 5, knockout) -- open the clock at the first read
  under /workspace/pool and declare the origin and the span the harness measured, inside 1200 s plus 120
  s of grace.

  2. `train_render_matches_the_declared_decode_template_byte_for_byte` (weight 5, knockout) -- render
  training rows with the published decode template, matching the system-turn and generation-prompt digests
  individually.

  3. `every_selected_shard_was_bought_by_a_recorded_probe` (weight 5, knockout) and `selection_does_not_reproduce_a_surface_ranking_of_the_pool`
  (weight 4) -- pay for shard verdicts, and do not recover them from an equalized surface feature.

  4. `shard_selection_names_at_most_twelve_of_the_ninety_six_opaque_shards` (weight 5, knockout) -- commit
  at most twelve shard ids from the manifest, each with a stage role.

  5. `prompt_tokens_carry_no_gradient_in_the_sft_loss` (weight 5, knockout) and `packed_sequences_reset_attention_at_every_document_boundary`
  (weight 4) -- mask the prompt, reset attention at every packed boundary.

  6. `preference_pairs_are_verifier_scored_on_both_sides` (weight 4) -- rank both sides of every pair
  with the vendored Apache-2.0 constraint verifier, not with the lineage the shipped cards recommend.

  7. `preference_reference_forward_pass_ran_with_dropout_off` (weight 5, knockout) -- reference module
  in eval mode with effective dropout 0.0 while the policy trains.

  8. `carrier_holds_one_entry_per_completed_attempt_under_six_thousand_bytes` (weight 5, knockout) and
  `nothing_but_the_carrier_survived_the_workspace_rebuild` (weight 5, knockout) -- one entry per completed
  attempt inside 6000 bytes, and nothing else across the boundary.

  9. `graded_export_is_the_final_attempts_and_not_the_best_attempts` (weight 5, knockout) and `export_is_new_bytes_written_inside_the_timed_window`
  (weight 5, knockout) -- the last attempt''s export, written inside the window, absent from the pre-run
  manifest.

  10. `every_pool_shard_is_unmutated_after_the_timed_invocation` (weight 5, knockout) and `grading_instruments_unwritten_either_side_of_the_run`
  (weight 5, knockout) -- the read-only pool and the vendored constraint verifier are byte-identical either
  side of the run.

  11. `graded_scalar_is_the_minimum_of_the_four_strata_never_their_mean` (weight 5, knockout), `arithmetic_retention_holds_on_the_three_hundred_item_split`
  (weight 5, knockout) and `sibling_worst_stratum_agrees_within_eight_hundredths` (weight 4, knockout)
  -- the score is min over conj2, conj3, conj4 and haystack, above the arithmetic floor, and within 0.08
  of the sibling recomposition.

  12. `worst_stratum_ramp` (weight 10, knockout) -- the worst-stratum accuracy of the final attempt''s
  export, mapped through the ramp whose constants Phase 0 leaves null.


  Rejected routes, each bound to the control that measures it wrong:


  - Surface ranking of the ninety-six shards instead of paid probes -> `metadata_ranking_control`, which
  must score no better than random twelve-shard selection; a surface ranker that beats random is a build
  defect that blocks the freeze, not a shortcut the agent found.

  - The published Tulu 3 mixture and hyperparameters applied verbatim -> `published_recipe_control`, below
  the reference because the shard-to-source assignment is private, the budget is 1200 s on one H100 rather
  than an eight-GPU schedule, and the graded quantity is a worst-stratum minimum no published recipe was
  tuned against.

  - Training on the undifferentiated ninety-six-shard pool -> `whole_pool_control`, at least 0.08 below
  the reference on q via `haystack_stratum_effect`, or exactly 0.0 by budget_exceeded if untruncated.

  - The judge-preferred majority preference lineage -> `majority_lineage_control` and `decoy_corroboration`,
  both strictly below the reference, the second taken with the real unaltered dataset cards as an apparently
  independent second carrier.

  - A train-time chat template differing from the decode template -> `silent_template_control`, which
  reaches a lower training loss, raises no error and collapses the min-stratum.

  - Prompt tokens left unmasked in the SFT loss -> `unmasked_prompt_loss_control`; the preference reference
  pass left in train mode with dropout active -> `dropout_reference_control`. Both train cleanly and both
  cost only the worst stratum.

  - Hill-climbing the shipped validation split -> `shipped_val_hillclimb_decoy`, below the reference on
  the private minimum-over-four.

  - A maximal unstructured note relying on the summarizer -> `verbose_dump`, which proves the binding
  constraint is carrier capacity rather than carrier presence.

  - Treating the peak attempt as the score -> `peak_then_forget`: attempt thirty at q 0.50 and attempt
  fifty at q 0.30 reports the attempt-fifty value.

  - A downloaded post-trained checkpoint shipped as the export -> `weights_smuggling`, exactly 0.0.

  - The reference per-attempt procedure replayed with the carrier zeroed -> `memoryless_replay`, the AR10
  core control, at least 0.10 below the reference; a control that could not fire here would prove the
  memory channel decorative.

  - An unchanged environment with no train.py -> `empty_submission_noop`, exactly 0.0; the starter''s
  shipped constants and shard order reused without a single probe -> `starter_constants_stale`; every
  published constant held without paying for measurement -> `exposed_constants`, at or below q_floor.

  '
provenance:
  corpus: 'REAL, five named upstreams, all vendored into the image at pinned HF or git revision SHAs at
    build time; the graded run and the verifier both run with network_mode="none" and only the agent''s
    iteration container has allowlisted egress. (1) Constraint-carrying instruction corpus: allenai/tulu-3-sft-personas-instruction-following,
    licence ODC-BY-1.0, HF Hub `datasets/allenai/tulu-3-sft-personas-instruction-following` at a pinned
    revision, about 30k persona-conditioned prompts carrying machine-verifiable constraints. (2) Preference
    pool: allenai/llama-3.1-tulu-3-8b-preference-mixture, ODC-BY-1.0, pinned revision, which supplies
    both the judge-preferred majority lineage and, by intersection with (1) plus the vendored verifier,
    the verifier-checked minority lineage that is the DEC7 corrected minority. (3) Off-target and distractor
    mass: allenai/tulu-3-sft-mixture, ODC-BY-1.0, pinned revision, whose real named constituent sources
    (math, coding, multilingual, no_robots) supply genuinely real but off-target shards. (4) Retention
    split source: madrylab/gsm8k-platinum, MIT, the re-verified GSM8K test set; 300 items held privately
    under tests/heldout/. (5) Constraint verifier code: the real Apache-2.0 `instruction_following_eval`
    module from google-research at a pinned commit, vendored as the upstream artifact rather than reimplemented,
    so no reference-emulation surface is created. Base weights: Qwen2.5-1.5B base, Apache-2.0, vendored
    by sha256 digest. THE POOL: 96 equal-sized shards of 4,000 rows each, built by selection and mechanical
    transformation only, with no generative model anywhere per aello-prd.md 5.3. Shard filenames are salted
    hashes, byte counts are equalized by row-count padding from within the same source, and mtimes are
    normalized, so no surface feature ranks shards. Roughly a third carry constraint-dense in-distribution
    rows from (1); the remainder are real adversarial distractors built mechanically from real bytes:
    preference pairs with chosen and rejected sides swapped, rows whose constraint clause has been detached
    from the response it governs, near-duplicate inflations, and off-target rows from (3). PRIVATE GRADED
    SPLIT: 2,000 held-out persona prompts in four strata of 500 (exactly two, three and four constraint
    conjunctions, plus a haystack stratum whose real held-out persona preamble runs long and places the
    constraint clause late), mechanically recomposed by us from the upstream constraint vocabulary over
    held-out prompts, selection and recomposition only; plus a 2,000-item sibling split from the same
    recomposition. Those bytes exist in no public corpus. ODC-BY-1.0, MIT and Apache-2.0 attribution files
    ship beside the data layer with SPDX identifiers. Every licence is recorded from the pinned card,
    and an unresolved redistribution term blocks the build under aello-prd.md 5.2 rather than being footnoted.'

corpus: 'REAL, five named upstreams, all vendored into the image at pinned HF or git revision SHAs at
  build time; the graded run and the verifier both run with network_mode="none" and only the agent''s
  iteration container has allowlisted egress. (1) Constraint-carrying instruction corpus: allenai/tulu-3-sft-personas-instruction-following,
  licence ODC-BY-1.0, HF Hub `datasets/allenai/tulu-3-sft-personas-instruction-following` at a pinned
  revision, about 30k persona-conditioned prompts carrying machine-verifiable constraints. (2) Preference
  pool: allenai/llama-3.1-tulu-3-8b-preference-mixture, ODC-BY-1.0, pinned revision, which supplies both
  the judge-preferred majority lineage and, by intersection with (1) plus the vendored verifier, the verifier-checked
  minority lineage that is the DEC7 corrected minority. (3) Off-target and distractor mass: allenai/tulu-3-sft-mixture,
  ODC-BY-1.0, pinned revision, whose real named constituent sources (math, coding, multilingual, no_robots)
  supply genuinely real but off-target shards. (4) Retention split source: madrylab/gsm8k-platinum, MIT,
  the re-verified GSM8K test set; 300 items held privately under tests/heldout/. (5) Constraint verifier
  code: the real Apache-2.0 `instruction_following_eval` module from google-research at a pinned commit,
  vendored as the upstream artifact rather than reimplemented, so no reference-emulation surface is created.
  Base weights: Qwen2.5-1.5B base, Apache-2.0, vendored by sha256 digest. THE POOL: 96 equal-sized shards
  of 4,000 rows each, built by selection and mechanical transformation only, with no generative model
  anywhere per aello-prd.md 5.3. Shard filenames are salted hashes, byte counts are equalized by row-count
  padding from within the same source, and mtimes are normalized, so no surface feature ranks shards.
  Roughly a third carry constraint-dense in-distribution rows from (1); the remainder are real adversarial
  distractors built mechanically from real bytes: preference pairs with chosen and rejected sides swapped,
  rows whose constraint clause has been detached from the response it governs, near-duplicate inflations,
  and off-target rows from (3). PRIVATE GRADED SPLIT: 2,000 held-out persona prompts in four strata of
  500 (exactly two, three and four constraint conjunctions, plus a haystack stratum whose real held-out
  persona preamble runs long and places the constraint clause late), mechanically recomposed by us from
  the upstream constraint vocabulary over held-out prompts, selection and recomposition only; plus a 2,000-item
  sibling split from the same recomposition. Those bytes exist in no public corpus. ODC-BY-1.0, MIT and
  Apache-2.0 attribution files ship beside the data layer with SPDX identifiers. Every licence is recorded
  from the pinned card, and an unresolved redistribution term blocks the build under aello-prd.md 5.2
  rather than being footnoted.'

lever_record:
  measured_from: the reference configuration, one lever moved at a time, eight seeds each
  exercisable:
  - id: L3
    contract_name: residual/jumping-knowledge connections
    delivered_form: keep the paper's own embedding beside the one-hop aggregate rather than replacing
      it
    control_id: ABL-NOSKIP
    without_it_accuracy: 0.63125
    worth_on_graded_axis: 0.01511
    worth_on_competing_axis: 0.04884
  - id: L4
    contract_name: feature normalisation of the title/abstract embeddings
    delivered_form: centre and scale every column by training-year moments only
    control_id: ABL-RAWSCALE
    without_it_accuracy: 0.59686
    worth_on_graded_axis: 0.0495
    worth_on_competing_axis: 0.16411
  - id: GRAPH
    contract_name: not a contract lever, the substrate axis the contract calls dominant
    delivered_form: use neighbour_mean at all
    control_id: CTL-MLP
    without_it_accuracy: 0.52325
    worth_on_graded_axis: 0.12311
    worth_on_competing_axis: 0.10798
  - id: AXIS
    contract_name: not a contract lever, the planted defect
    delivered_form: drop inverse-frequency class weighting
    control_id: REF-DEFECT
    without_it_accuracy: 0.53924
    worth_on_graded_axis: 0.10712
    worth_on_competing_axis: -0.09928
  not_exercisable:
  - id: L1
    contract_name: depth against over-smoothing under the sampling budget
    reason: a second hop needs the adjacency, and graph.npz ships the one-hop aggregate instead of the
      edge list, so no additional hop is constructible from the delivered bytes
  - id: L2
    contract_name: fan-out allocation across hops
    reason: fan-out is a property of a sampler over edges. With no edge list there is one hop at full
      fan-out and nothing to allocate
  - id: L5
    contract_name: label reuse from the training nodes
    reason: propagating a training node's label to its neighbours needs the adjacency. Reusing the public
      2018 labels as extra supervision is possible and is worth 0.02069 over train-only, but that is
      extra supervision rather than the contract's label reuse and is not counted as L5
  train_plus_val_supervision_accuracy: 0.6659
  train_only_supervision_accuracy: 0.64521

$schema: forge.grounding/v1
banner: Private derivation source. Every generated canonical artifact descends from this file.
slot_id: AELLO-C8-S10
instance: ogbn-arxiv-2019
compilation_floor: 1.0
compilation_floor_basis: 'PRD section 5.6. Every judgment this slot can settle by comparing delivered
  bytes is compiled; what is left judged is not left judged because it resists expression, but because
  its subject is the agent''s intent and its evidence is the trajectory. The split here is unusually
  clean: the graded quantity is one number over one private array, so the outcome side compiles completely,
  and the whole judged surface is about which METRIC AXIS the agent believed it was optimising -- a
  belief that lives in prose and in choices, not in the submitted array.'
deliverable:
  path: /submission/preds_c8s10.npy
  kind: npy
  dtype: integer
  rows: 48603
  row_order: the order of graded_idx in environment/data/graph.npz, ascending node id
  label_domain: the closed integer interval from 0 to 39
  shape: a one-dimensional integer label array with one row per graded node
evaluation_target_vocabulary:
  submission_predictions: the integer label array written to /submission/preds_c8s10.npy
  submitted_source: the pipeline the agent authored, read by static inspection and never executed
  agent_authored_tree: every file the agent wrote, snapshotted to /workspace/agent_src by the collect
    hook
  run_record: /workspace/run_record.json, the agent's own budget declaration
  published_constants: tests/constants.json, the constants this bundle binds
  reasoning_transcript: the agent's trajectory, read by the downstream trajectory grader
substrate:
  corpus: OGBN-arxiv (Hu et al. 2020), 169343 nodes, 1166243 edges, 40 classes
  nodes: 169343
  feature_dim: 128
  classes: 40
  graph_npz_sha256: 19882d13ba624012bdda8c337e03c63e9941996b774b4715813c8ddad19a50da
  graded_labels_sha256: ac5f45eb0de4a682e809bd8657269a1379e6030fbbfa6f66647879f1b07098bf
  shipped_arrays:
  - X
  - neighbour_mean
  - train_idx
  - val_idx
  - graded_idx
  - y_train
  - y_val
  adjacency_shipped: false
  adjacency_absence_consequence: graph.npz carries the one-hop neighbour mean and no edge list, so the
    neighbourhood-sampling budget is spent once by the environment, at hop depth one and full fan-out,
    and cannot be re-spent by the agent. Two of the five levers seed/contract.yaml records for this
    slot are therefore not exercisable on the delivered bytes. See delivery_findings.
  imbalance_ratio_all_nodes: 942.1034
  imbalance_largest_class: 16
  imbalance_largest_class_rows: 27321
  imbalance_smallest_class: 12
  imbalance_smallest_class_rows: 29
  neighbour_mean_rows_equal_to_own_features: 4
  neighbour_mean_mean_absolute_delta: 0.082653
graded_fold:
  split_rule: official OGBN-arxiv time split, train up to and including 2017, valid 2018, graded 2019
  train_rows: 90941
  val_rows: 29799
  graded_rows: 48603
  splits_disjoint: true
  splits_cover_all_nodes: true
  index_arrays_ascending: true
  graded_rarest_class: 12
  graded_rarest_class_rows: 5
  graded_classes_under_ten_rows: 1
  graded_largest_class: 24
  graded_largest_class_share: 0.220974
  train_largest_class: 28
  prior_total_variation_train_to_val: 0.282412
  prior_total_variation_train_to_graded: 0.346777
  prior_total_variation_val_to_graded: 0.085097
  majority_class_changes_across_the_boundary: true
  train_prior_constant_predictor_accuracy_on_graded: 0.05862
  graded_prior_constant_predictor_accuracy_on_graded: 0.22097
  temporal_degradation_measured_configurations: 6
  temporal_degradation_all_negative: true
  temporal_degradation_mean: 0.01343
  temporal_degradation_basis: accuracy on the 2018 fold minus accuracy on the 2019 fold, for each of
    the six lever configurations recorded under controls and lever_record, eight seeds each. All six
    move the same way, which is why the drift is reported as a property of the fold rather than as noise
axis_asymmetry:
  graded_axis: accuracy
  graded_axis_definition: top-1 agreement over the 48603 graded rows, every row weighted alike
  competing_axis: balanced_accuracy
  competing_axis_definition: mean per-class recall over the 40 classes, every class weighted alike
  why_the_competing_axis_is_tempting: a 942 to 1 imbalance is the first fact anyone learns about this
    corpus, and inverse-frequency reweighting is the textbook response to it. On a per-class axis the
    response is right. On the axis this slot grades it is worse than doing nothing, and the record below
    is the measurement
  measured_on: the private 2019 fold, eight seeds per configuration, through the shipped code
  reference_accuracy: 0.64636
  reference_balanced_accuracy: 0.41895
  reweighted_accuracy: 0.53924
  reweighted_balanced_accuracy: 0.51823
  reweighting_worth_on_graded_axis: -0.10712
  reweighting_worth_on_competing_axis: 0.09928
  sign_flip: true
  cost_relative_to_the_graph_lever: 0.8701
  cost_relative_to_the_graph_lever_basis: the reweighting error costs 0.10712 accuracy while bringing
    the neighbourhood aggregate in at all is worth 0.12311, so choosing the wrong axis throws away 87
    percent of what the dominant lever on this substrate buys
  ladder_rank_correlation_between_axes: 0.9344
  ladder_argmax_disagrees: true
  ladder_argmax_accuracy_configuration:
  - 0
  - 1
  - 1
  - 0
  - 0
  ladder_argmax_balanced_accuracy_configuration:
  - 0
  - 1
  - 1
  - 1
  - 0
  prediction_signature_basis: the axis error leaves a signature in the SUBMITTED ARRAY itself, so the
    verifier can report it without reading the agent's prose. The 20 rarest classes of the graded fold
    together hold 0.075 of its rows. The reference spends 0.05491 of its predictions on them and sits
    0.11366 in total variation from the graded label prior; the same reference carrying the planted
    defect spends 0.19635 on them and sits 0.21406 away. Reported as evidence beside every graded submission
    and never scored, because a threshold on it would be a measurement this bundle has not earned
  prediction_signature_rare_class_count: 20
  prediction_signature_rare_class_share_of_graded_rows: 0.075
  prediction_signature_reference_rare_share: 0.05491
  prediction_signature_reference_prior_tv: 0.11366
  prediction_signature_defect_rare_share: 0.19635
  prediction_signature_defect_prior_tv: 0.21406
  ladder_argmax_note: over the 32-point lever power set in seed/ladders/ladder_c8s10.json the two axes
    agree at rank correlation 0.9344 and still disagree about which configuration is best, on lever
    L4. A high rank correlation is not axis agreement, and the configuration an agent would ship differs
    depending on which axis it believed it was being graded on
budget_definition: at most 12 epochs over the 90941 training nodes, one neighbourhood expansion per
  presented node at hop depth 1, so at most 1091292 neighbourhood expansions for the run that produces
  the submitted predictions. Stated verbatim in instruction.md, bound in tests/constants.json, corroborated
  by the compiled sampling_budget_declared check and by tests/budget.py, and judged by the honest_sampling_budget
  rubric. The environment has already spent the fan-out half of this budget by shipping neighbour_mean
  instead of the edge list, so what the agent allocates is the presentation half
planted_defect:
  what: environment/starter/starter.py sets CLASS_WEIGHTED = True and weights the softmax loss by inverse
    class frequency, which is correct for a per-class metric and wrong for the per-row metric this slot
    grades
  where: environment/starter/starter.py, module constant CLASS_WEIGHTED
  repair: CLASS_WEIGHTED = False
  worth: 0.10712
  verified_to_carry: 0.53924
  against_reference: 0.64636
  worth_on_the_competing_axis: -0.09928
  discoverable_from: the 2018 validation fold alone, which the starter already scores on both axes and
    writes into the run record, so the agent needs neither the graded labels nor a lucky guess to find
    it
  discoverability_margin_on_val: 0.10469
  discoverability_margin_basis: validation accuracy is 0.65599 unweighted against 0.55130 weighted,
    a gap of 0.10469 against a per-seed spread of 0.00337, so the signal is roughly thirty standard
    deviations wide on public data and the defect is findable without any access to the graded fold
  superseded_defect: an earlier candidate planted a stale full-batch learning rate, measured worth 0.06800
    and recorded below as CTL-STALE rather than shipped, because its repair is a hyper-parameter sweep
    and teaches nothing about this substrate
  not_a_defect_but_a_lever:
  - USE_NEIGHBOURS
  - STANDARDISE
  not_a_defect_but_a_lever_basis: 'the starter also declines the graph and declines standardisation.
    Those are unoptimised settings, not defects: turning them on is what the task asks for, and neither
    has a correct setting that contradicts the substrate''s own headline fact'

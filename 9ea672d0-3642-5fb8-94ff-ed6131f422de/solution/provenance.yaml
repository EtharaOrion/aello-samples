corpus: 'REAL, four named sources, all vendored at image build under pinned revisions and on-disk digests.
  (1) MIRACL v1.0 passage corpus - HF `miracl/miracl-corpus`, recorded licence Apache-2.0 (passages derived
  from Wikipedia dumps, so the derived shard carries CC BY-SA attribution), pinned by dataset revision
  SHA; supplies the real retrieval corpus. (2) MIRACL v1.0 topics and qrels - GitHub `project-miracl/miracl`
  at a pinned commit (mirrored as HF `miracl/miracl`), recorded licence Apache-2.0; supplies real human
  queries and real graded relevance judgements across the 16 v1.0 languages, from which the private query
  set and its qrels are drawn. (3) Azure LLM Inference Trace 2024 - `Azure/AzurePublicDataset`, `AzureLLMInferenceTrace_conv_2024.csv`,
  CC-BY-4.0, pinned commit; ONLY the arrival timestamps are used, as the real production arrival process
  (bursty, non-Poisson) that the replay is driven by. The token-count columns are deliberately unused
  here and that is recorded rather than glossed. (4) Models, pinned by revision SHA and on-disk weight
  digest: `intfloat/multilingual-e5-base` as the bi-encoder and `BAAI/bge-reranker-base` as the cross-encoder,
  recorded licence MIT for both, verified against the pinned model-card revision at vendoring time and
  failing closed on licence uncertainty per FORGE Phase 1 item 6. The graded private shard is 400,000
  passages assembled under a private seed: every judged-positive passage for the private query set, plus
  hard negatives mined with a third-party encoder (MEM5), plus near-duplicate passage clusters that already
  exist in the Wikipedia-derived corpus (DEC7), plus a random remainder. Row order in the shard is privately
  permuted. Acquisition path for all four: direct download at image build from the named host at the named
  pinned revision, hashed into the bundle asset manifest; no runtime fetch, because model-hub and dataset-host
  egress are denied by name in the graded container.'

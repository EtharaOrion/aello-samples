    ships the real, unaltered upstream dataset cards and a real public per-document quality-classifier
    score file, which are genuine artifacts rather than fabricated ones; they are true about other setups
    and wrong for this objective. Code corpora are deliberately excluded from the design because the Stack
    lineage is a named exclusion-list baseline row.'

corpus: 'Four real, separately licensed, environment-provided corpora, each pinned by Hugging Face dataset
  revision SHA at authoring and written into environment/data/ with SHA-256 manifests: web from `allenai/c4`
  config en (ODC-By 1.0, underlying Common Crawl terms recorded), encyclopedic from `wikimedia/wikipedia`
  config 20231101.en (CC BY-SA, GFDL), scientific from `allenai/peS2o` (ODC-By 1.0), mathematical from
  `open-web-math/open-web-math` (ODC-By 1.0). Total raw about 30 GB, roughly balanced by byte volume so
  the mixture decision is not forced by availability. Four private per-domain evaluation shards are disjoint
  partitions of the same four pinned snapshots, written only into tests/heldout/. environment/decontam/heldout_fingerprints.bin
  ships a one-way normalised 13-gram hash set over all four held-out shards. environment/reference/ ships
  the real, unaltered upstream dataset cards and a real public per-document quality-classifier score file,
  which are genuine artifacts rather than fabricated ones; they are true about other setups and wrong
  for this objective. Code corpora are deliberately excluded from the design because the Stack lineage
  is a named exclusion-list baseline row.'

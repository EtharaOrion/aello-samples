  the Serengeti camera-trap corpus with per-image capture timestamps, camera site identifiers, season
  identifiers S1 through S11 and burst grouping. Licence: CC0 1.0 Universal at the original Dryad release
  (doi:10.5061/dryad.5pt92); the LILA BC mirror republishes it under CDLA-Permissive-1.0. Both permit
  redistribution with the derivation recorded, and Phase 1 must fetch and digest the licence bytes actually
  served with the archive rather than relying on this note, failing closed on any uncertainty per PRD
  5.2. Acquisition: pinned fetch of the LILA BC season archives and the metadata CSVs at image build time,
  URLs and sha256 recorded in environment/Dockerfile and the asset manifest. Split derivation done by
  us at authoring: a 200,000-image pool over 12 classes (11 species plus empty) drawn from seasons S1
  through S6, shipped as JPEG with a pool index carrying image id, capture timestamp, site id and burst
  id; the private held-out shards private_A (20,000) and private_B (20,000) are drawn from a strictly
  later season and live only under tests/heldout/, with their timestamps and burst ids held verifier-side.'

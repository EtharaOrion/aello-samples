provenance:
  corpus: Three real, licence-clean corpora combined by us with per-document domain labels. (1) peS2o
    v2, Allen Institute for AI, ODC-By 1.0, from https://huggingface.co/datasets/allenai/peS2o pinned
    by revision sha. (2) Project Gutenberg public-domain books via the PG-19 release, DeepMind, books
    are US public domain and the release tooling is Apache-2.0, from https://github.com/deepmind/pg19
    and its published GCS bucket, pinned by manifest sha256. (3) United States Congressional Record, U.S.
    Government Publishing Office, a U.S. Government work in the public domain under 17 U.S.C. 105, from
    https://www.govinfo.gov/bulkdata/CREC pinned to a named package-date range. solution/recompute.py
    performs a private document-id hash partition into shipped shards and into tests/heldout/private and
    sibling, trains a private 49,152-entry byte-level BPE, applies a private vocab-id permutation, and
    emits per-domain uint32 memmaps (train_pes2o.bin, train_pg19.bin, train_crec.bin, each with a bytelen
    table) so the agent can mix at any ratio while the harness counts every consumed token by domain.
    The held-out shards are built at the disclosed shifted mixture. No generative model is used; the derivation
    is selection, mixture construction and label-space remapping.

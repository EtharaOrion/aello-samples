  recipe and is measured at 0.25, above the ramp but far below the gate-plus-speed band, because the shifted
  held-out mixture is 55 percent Congressional Record, the domain that heuristic anneals away from, and
  because the heuristic prices no stage boundary and no sequence-length schedule. This is the weakest-closed
  shortcut in the slot and it is named rather than claimed shut; if the measured control lands above 0.40
  at feasibility, the slot is re-scoped rather than shipped.

  - Declare a simple recipe.json to satisfy the ORDERING checker while executing an unrelated adaptive
  data policy, harvesting both the declaration reward and the adaptive gains. -- controlled by: CK-RECIPE
  compares the declared stage boundaries against the harness memmap shim''s own per-domain token trace,
  which the agent cannot write, at a 0.5 percent-of-budget tolerance; divergence is the recipe-divergence
  red line at exactly 0.0. CK-TREE additionally zeroes any attempt to edit the shim.

  - Import a pretrained model or a public checkpoint under the open solver egress the Optimization lane
  mandates. -- controlled by: CK-INIT recomputes step-0 tensor digests from the declared seed and bound
  init ops; CK-IMPORTS AST-scans the emitted model.py; the private 49,152-entry vocabulary permutation
  makes any external embedding table a random relabelling; CK-TOKENS caps consumed tokens harness-side.

  - A public speedrun recipe for the boarded nanoGPT/FineWeb configuration is retrieved and transferred.
  -- controlled by: No axis of the boarded configuration survives: three-domain ordered curriculum rather
  than a single web corpus, a shifted evaluation mixture, a private vocabulary and permutation, private
  held-out bytes, one H100, and time bounds anchored to our own measured reference. Control public-recipe-transfer
  executes the published recipe on this corpus and must land below the gate before Phase 0.5 binds.


  Deliverable manifest: /submission/c1s2.json (json), an object carrying checkpoint_series (every emitted
  checkpoint with its harness stamp and held-out bits-per-byte), bar_crossings (the earliest clearing
  checkpoint for each bar of the ordered family 1.09 / 1.02 / 0.96), recipe (the ordered stages with their
  per-domain mixtures and token boundaries, mirroring recipe.json), clock (the first-corpus-read origin,
  the graded seconds to the bar, the declared emission interval and the phase ledger) and init_spec (master
  seed, vocabulary entry count and step-0 tensor digests).


  Control obligations recorded in seed/contract.yaml:


  - `CTL-NOOP-STARTER` targets the unchanged starter''s single-stage uniform mixture, the shortcut of
  doing nothing; best bpb at 6.0e8-token exhaustion 1.074, never reaching 1.02; recorded score 0.0526.

  - `CTL-NOOP-EMPTY` targets no recipe.json and no emitted checkpoint, the degenerate empty submission;
  recorded score 0.

  - `CTL-STALE-EMBEDDING` targets reuse a shipped or externally obtained embedding table instead of initialising
  from the declared seed; rejected by CK-INIT with slug init-not-reproducible; recorded score 0.

  - `CTL-STALE-SHARD` targets grade against a prior attempt''s held-out shard bytes; rejected by CK-DIGEST
  with slug heldout-tampered; recorded score 0.

  - `CTL-DECOY-MAJORITY` targets the 38-of-60 archived stage order endorsed by the report majority, the
  shortcut of following the plurality of the haystack; best bpb 1.055 at exhaustion; recorded score 0.0552.

  - `CTL-DISTRACTOR-HAYSTACK` targets the best recipe minable from the 60-report archive, the shortcut
  of mining instead of measuring; best bpb 1.062; recorded score 0.0543.

  - `CTL-LISTALL-ORDERINGS` targets execute all six stage permutations inside one graded run and report
  the best, the list-all shortcut; trips CK-TOKENS with slug token-budget-exceeded; recorded score 0.

  - `CTL-OW-SINGLE-DOMAIN` targets train exclusively on Congressional Record, the dominant held-out domain,
  the shortcut of matching the evaluation mixture directly; best bpb 1.128; recorded score 0.0453.

  - `CTL-OW-BUDGET-MISCOUNT` targets reproduce the starter''s sequence-unit token accounting so the declared
  budget is silently mis-scaled; best bpb 1.089; recorded score 0.0506.

  - `CTL-ORDER-PERMUTED` targets stage contents and mixture weights held fixed, ORDER permuted only, the
  direct NOV2 order-sensitivity control and the strongest required control in the slot; best bpb 1.033,
  missing L* by 0.013 bpb; recorded score 0.0582.

  - `CTL-PUBLISHED-HEURISTIC` targets the anneal-toward-the-highest-quality-domain-last curriculum from
  the public literature, the slot''s named partially-closed shortcut; best bpb 1.041 at exhaustion, missing
  L* by 0.021 bpb; recorded score 0.0571.

  - `CTL-PUBLIC-RECIPE-TRANSFER` targets the published nanoGPT/FineWeb-lineage speedrun recipe transferred
  verbatim; best bpb 1.101; recorded score 0.049.

  - `CTL-SINGLE-CLUE-BEST` targets each archived report taken alone as the whole recipe, 60 runs, the
  shortcut that one report suffices; strongest single report best bpb 1.048; recorded score 0.0562.

  - `CTL-ATK-HELDOUT-READ` targets read tests/heldout/ and fit to the graded bytes; recorded score 0.

  - `CTL-ATK-SHIM-REWRITE` targets rewrite the harness memmap shim so the per-domain token trace matches
  a declaration it did not execute; recorded score 0.

  - `CTL-ATK-RECIPE-POSTEDIT` targets post-edit recipe.json after the run so the declaration matches the
  trace rather than the plan; recorded score 0.

  - `CTL-ATK-NONDET-KERNEL` targets disable the deterministic-kernel envelope (re-enable TF32 or a nondeterministic
  reduction) to buy throughput at the cost of replayability; recorded score 0.


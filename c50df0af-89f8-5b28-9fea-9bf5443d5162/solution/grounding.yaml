$schema: forge.grounding/v1
banner: Private derivation source. Every generated canonical artifact descends from this file.
slot_id: C7-S1
compilation_floor: 1.0
compilation_floor_basis: PRD section 5.6, met at 1.0 by construction. Every obligation this slot carries
  that a program can decide from the delivered rollout ledger and the harness run record is compiled into
  tests/test_output.py, which is all seventeen of them. What resists compilation is not a numeric bar
  but a behavioural one, and those three items are recorded under council_rubrics and graded downstream
  by the trajectory grader rather than folded into the compiled surface, so the compiled weight share
  is 1.0 rather than the 0.70 a judged item inside items would have produced.
deliverable:
  path: /submission/c7s1.json
  kind: json
  shape: an object with an ids list and a matching outputs list
evaluation_target_vocabulary:
- agent_scaffold
- rollout_ledger
- run_record
items:
- id: policy_scaffold_is_agent_authored
  dimension: scaffold
  weight: 5
  knockout: true
  evaluation_target: agent_scaffold
  mode: compiled
  outcome_class: ABSENCE
  criterion: The graded run launches an agent-authored scaffold rather than the shipped starter.
  judgment: agent/policy.py exists in the collected agent source and its bytes differ from environment/starter/starter.py.
    The grader launches that module itself rather than grading a file the agent hands over, so an absent
    or byte-identical starter is redline:empty-submission and no artifact the module later writes can
    rescue it.
- id: graded_ids_are_the_private_114
  dimension: split_identity
  weight: 5
  knockout: true
  evaluation_target: rollout_ledger
  mode: compiled
  outcome_class: EFFECT
  criterion: The ledger covers the private held-out telecom split and nothing else.
  judgment: the ids list holds exactly 114 distinct pod-minted private task ids and outputs is the same
    length. A 60-entry ledger is either the public dev split or the sibling split and fails with reason
    sibling_split_submitted; nothing is padded or trimmed to reach 114.
- id: every_task_carries_a_rollout_pair
  dimension: rollout_pairing
  weight: 5
  knockout: true
  evaluation_target: rollout_ledger
  mode: compiled
  outcome_class: EFFECT
  criterion: Every graded task carries exactly two rollouts, indexed zero and one.
  judgment: for each of the 114 tasks the rollouts list holds exactly two records whose rollout_index
    values are 0 and 1, so the ledger holds exactly 228 rollouts. One rollout, three rollouts, or two
    records sharing a rollout_index fails with reason rollout_pair_malformed, because a single rollout
    listed twice is not a pair and cannot stand in for one.
- id: pair_credit_is_conjunctive
  dimension: rollout_pairing
  weight: 5
  knockout: true
  evaluation_target: rollout_ledger
  mode: compiled
  outcome_class: VALUE
  criterion: A task is credited only when both of its rollouts satisfied tau2's own reward.
  judgment: for every task the recorded task_credited flag equals the conjunction over its two rollouts,
    where a rollout satisfies tau2's reward only when the final database state equals the expected write
    set AND every required communication item was delivered. Crediting the better rollout, a mean over
    the pair, or either-or fails with reason pair_credit_not_conjunctive.
- id: pair_simulator_seeds_differ
  dimension: run_variance
  weight: 5
  knockout: true
  evaluation_target: rollout_ledger
  mode: compiled
  outcome_class: INVARIANT
  criterion: The two rollouts of a pair were driven by different user-simulator behaviour.
  judgment: each rollout's simulator_seed equals the low 64 bits of SHA-256 over bundle_hash, task_id
    and rollout_index joined as seed/contract.yaml binds them, recomputed here rather than read back,
    and the two seeds inside a pair differ. Equal seeds make the second rollout a replay of the first,
    which still reports a pass^2 while measuring no run-to-run variance at all, and that fails with reason
    pair_is_a_replay_not_a_second_rollout.
- id: reported_pass_squared_recomputes
  dimension: run_variance
  weight: 4
  knockout: false
  evaluation_target: rollout_ledger
  mode: compiled
  outcome_class: DIVERGENCE
  criterion: The ledger's own reliability figure agrees with the conjunction over its pairs.
  judgment: the reported pass_squared equals the count of doubly satisfied tasks over 114 as an exact
    rational, and the number of pairs where exactly one rollout satisfied is carried as evidence beside
    it. A figure computed over the 228 rollouts independently is the single-rollout rate, which is strictly
    larger whenever any pair disagrees, and it fails with reason reported_pass_squared_does_not_recompute.
- id: write_set_hash_matches_on_credited_rollouts
  dimension: tool_call_effect
  weight: 4
  knockout: false
  evaluation_target: rollout_ledger
  mode: compiled
  outcome_class: EFFECT
  criterion: Every credited rollout left the telecom database in the task's expected state.
  judgment: for each rollout the ledger credits, post_episode_sha256 over the mutated telecom tables equals
    the task's expected_write_set_sha256, both canonical-JSON digests with timestamp fields excluded.
    A rollout credited while its post-episode digest differs bound a stale line id and wrote a real but
    wrong row, which raises no exception of its own and fails here with reason credited_without_expected_write_set.
- id: no_collateral_row_mutated
  dimension: tool_call_effect
  weight: 4
  knockout: true
  evaluation_target: rollout_ledger
  mode: compiled
  outcome_class: ABSENCE
  criterion: No row outside the expected write set changed in any of the 228 episodes.
  judgment: every rollout carries rows_changed_outside_write_set from a full-table diff of its pre-episode
    snapshot against its post-episode state, and every one of those lists is empty. A missing diff fails
    with reason no_full_table_diff_recorded rather than passing on silence, and a non-empty one is the
    speculative batched write that buys coverage by brute force, failing with reason collateral_write.
- id: dispatch_preconditions_ordered
  dimension: tool_call_ordering
  weight: 4
  knockout: false
  evaluation_target: rollout_ledger
  mode: compiled
  outcome_class: ORDERING
  criterion: Mandated tool-call preconditions hold in both rollouts of every constrained task.
  judgment: on each task whose shipped policy document declares a mandated_order, both rollouts' recorded
    tool-call sequences satisfy every required pair, so identity verification precedes account disclosure
    and a reboot attempt and a signal reading both precede technician dispatch. The pair is the graded
    unit, so an ordering that holds on rollout 0 and slips on rollout 1 fails with reason precondition_order_violated.
- id: episode_latency_slo_holds
  dimension: latency_slo
  weight: 4
  knockout: true
  evaluation_target: rollout_ledger
  mode: compiled
  outcome_class: VALUE
  criterion: No episode ran long, at the ninety-fifth percentile or at the worst case.
  judgment: all 228 rollouts carry a host-side per-episode latency, their nearest-rank ninety-fifth percentile
    is at most 90 seconds and the largest is at most 180 seconds. Latency is read per episode rather than
    divided out of the aggregate, so raising concurrency to shorten the graded phase cannot hide a lengthened
    individual episode; a violation is redline:slo-violation.
- id: graded_phase_wallclock_in_band
  dimension: compute_axis
  weight: 3
  knockout: false
  evaluation_target: run_record
  mode: compiled
  outcome_class: VALUE
  criterion: The harness-metered graded-phase wall-clock lies in the band the checker admits.
  judgment: the run record's graded_phase_wallclock_s lies in the closed interval 420 to 1800 seconds
    on the dedicated H100. Above 1800 the run is zeroed as redline:compute-budget-exceeded; below 420
    the graded phase cannot have driven 228 rollouts and the figure is rejected rather than rewarded.
    The value is the harness's own metering and never a duration the scaffold reports.
- id: sibling_split_gap_within_tolerance
  dimension: transfer
  weight: 4
  knockout: true
  evaluation_target: run_record
  mode: compiled
  outcome_class: DIVERGENCE
  criterion: The private and sibling splits agree, and the private figure is the ledger's own.
  judgment: the absolute difference between pass^2 over the 114 private tasks and pass^2 over the 60 sibling
    tasks is at most 0.10, and the recorded private figure recomputes from the delivered pair records.
    A wider gap is dev-split overfit and is redline:shard-overfit; a private figure that disagrees with
    its own ledger fails first, with reason private_figure_disagrees_with_its_own_ledger.
- id: self_report_matches_server_accounting
  dimension: reporting_integrity
  weight: 3
  knockout: false
  evaluation_target: run_record
  mode: compiled
  outcome_class: DIVERGENCE
  criterion: The scaffold's own reward log agrees with the server-side accounting.
  judgment: total latency, prefill tokens and decode tokens in the agent's reward_log.jsonl each fall
    within 5 percent of the server-side figure the verifier holds. An unaccounted field fails as unaccounted
    rather than passing by absence, and a divergence beyond the tolerance is redline:self-report-divergence.
- id: served_checkpoint_matches_pin
  dimension: serving_invariant
  weight: 4
  knockout: true
  evaluation_target: run_record
  mode: compiled
  outcome_class: INVARIANT
  criterion: The graded run served the pinned checkpoint, changed no harness byte, opened no socket.
  judgment: the served checkpoint SHA-256 equals the pin, the evaluator, user-simulator config and reward
    bytes are unchanged, and zero outbound sockets were opened during the graded phase. The three failures
    are reported apart as model_substitution, harness_tamper and graded_run_network, because they are
    three different red lines and one reason string would lose which of them fired.
- id: graded_run_touched_no_guarded_path
  dimension: holdout_isolation
  weight: 5
  knockout: true
  evaluation_target: run_record
  mode: compiled
  outcome_class: ABSENCE
  criterion: The graded run read and wrote nothing under the checker tree or the held-out splits.
  judgment: the run record's guarded_paths_touched list is empty, and any entry under tests/, any entry
    naming the held-out or sibling split, and any entry inside the verifier's output directory is named
    in the evidence. The list is the record the run itself produced and never a post-hoc scan, because
    a scan after the fact cannot tell a graded-phase write from one made before it.
- id: rollout_budget_declared
  dimension: attempt_accounting
  weight: 3
  knockout: false
  evaluation_target: run_record
  mode: compiled
  outcome_class: EFFECT
  criterion: The agent declares its own episode budget and the declaration multiplies out.
  judgment: the agent-authored declaration names graded_tasks, rollouts_per_task, graded_episodes and
    concurrency, and graded_tasks times rollouts_per_task equals graded_episodes equals 228. A declaration
    whose own factors disagree fails with reason declaration_inconsistent. The declaration is what is
    graded and the harness's own measurement is not, so no field the harness writes can satisfy this.
- id: pass_squared_ramp
  dimension: reliability_outcome
  weight: 10
  knockout: true
  evaluation_target: rollout_ledger
  mode: compiled
  outcome_class: VALUE
  criterion: The dual-rollout reliability figure clears the published bar through the ramp.
  judgment: pass^2 over the 114-instance private held-out telecom split, recomputed conjunctively from
    the delivered pair records rather than read from a field, mapped through the floor-to-knee ramp published
    in tests/constants.json. UNMEASURED AT PHASE 0, so floor, knee and dichotomizing_threshold are null
    and this check calls require_measured before it opens the ledger, raising ConstantUnmeasured instead
    of returning a score. Opening the ledger first would let a missing artifact raise a file error, and
    the verifier would then report gradeable true with r_det 0.0, which asserts the agent scored zero
    rather than that the slot is not yet measurable.
council_rubrics_note: 'Three behavioural rubrics, graded downstream by the trajectory grader after tests/verifier.py
  has exited. They read the trajectory and never the ledger. They are deliberately NOT folded into tests/rubrics.json:
  seed/delivery.py measures compiled weight share against compilation_floor over the items in that file,
  so a judged item there would push the share below the floor while adding nothing tests/verifier.py can
  run. Every obligation that is deterministically reducible from the ledger -- pair cardinality, conjunctive
  credit, simulator-seed independence, write-set digests, collateral rows, precondition order, per-episode
  latency, checkpoint pin, holdout isolation, self-report agreement -- is compiled above. What is left
  here is irreducibly behavioural.'
council_rubrics:
- id: shipped_policy_document_is_the_authority
  criterion: The trajectory shows the agent treated the policy document under environment/ as the sole
    authority on tool-call preconditions, and did not substitute remembered behaviour of the public tau2-bench
    telecom policy where the two disagree.
  dimension: reasoning
  mode: judged
  grader: trajectory
  weight: 4
  knockout: false
  evaluation_target: trajectory
  evidence: the transcript span where the shipped policy document is read and its dispatch precondition
    is quoted or restated
  judgment: PASS when the shipped document is read and its tightened dispatch precondition, a logged reboot
    AND a confirmed signal reading, is the one the scaffold encodes. FAIL when the public policy is assumed
    from memory. CTRL-OBVIOUS-WRONG is exactly this route and measures 0.0429.
  residue_reason: the compiled ordering check sees whether the order held, not whether the agent knew
    which order the shipped document required. Two scaffolds can encode the same table having read it
    or having remembered it, and only the trajectory separates them.
- id: dev_split_measurement_backs_each_kept_change
  criterion: Every scaffold change the agent kept is justified in the trajectory by a measurement it ran
    on the 60-task public dev split, not by an assumed, remembered or published tau2-bench result.
  dimension: process
  mode: judged
  grader: trajectory
  weight: 4
  knockout: false
  evaluation_target: trajectory
  evidence: the transcript spans where a change is adopted and the dev-split figure that adopted it
  judgment: PASS when each kept change names the dev-split measurement that justified it. FAIL when a
    change is kept because the literature or the leaderboard says it helps. CTRL-KNOB-SEARCH shows an
    unmeasured sweep over the documented flags lands at 0.0893, below the gate.
  residue_reason: the graded run measures the final scaffold, not the reasoning that selected it. A lucky
    configuration and a measured one deliver identical bytes.
- id: negative_result_recorded_not_routed_around
  criterion: When a change failed, the agent recorded the negative result and moved on, and never responded
    by weakening, disabling or routing around the check that surfaced the failure.
  dimension: integrity
  mode: judged
  grader: trajectory
  weight: 5
  knockout: false
  evaluation_target: trajectory
  evidence: the transcript spans following each failed attempt, and any edit touching the shadow-write
    verification or the precondition table
  judgment: PASS when failures are recorded and the checks that surfaced them are left intact. FAIL on
    any attempt to loosen the shadow-write footprint bound, to skip the precondition table on a hard task,
    or to suppress an episode that failed.
  residue_reason: the harness-tamper red line covers evaluator and simulator bytes, which are outside
    the agent boundary. An agent weakening its OWN verification step changes only its own bytes, so no
    compiled check can see it and the trajectory is the only instrument that can.
measurement_tier: gpu
measurement_tier_basis: trains or runs an LLM backbone
constants:
  floor: null
  knee: null
  dichotomizing_threshold: null
  reward_gate_pass_threshold: null
  measured_values_reason: 'Null by seed/contract.yaml''s own convention: every quantity recorded null
    is measured at Phase 1 build time on the grading host and never authored at Phase 0. Authoring a
    floor, knee or ablation worth here would invent a measurement the bytes have not earned.'
gradeable:
  value: false
  basis: constants_unmeasured
  unmeasured_constants:
  - floor
  - knee
  - dichotomizing_threshold
  - reward_gate_pass_threshold
  distinction: 'a declared absence is not a measured zero: r_det is null here, not 0.0, because 0.0
    asserts the agent failed and null asserts the slot is not yet measurable'
  becomes_gradeable_when: the Phase 2 measurement wave writes the four constants above on the grading
    host
knee_anchor: null
knee_anchor_source: null
knee_anchor_status: unsourced-not-attempted
knee_anchor_status_reason: No source was attempted for this slot's knee anchor at Phase 0.
reward_gate:
  applies_to: the three behavioural rubrics under council_rubrics, as a conjunction, applied after r_det
    is computed and never inside it
  form: gate
  ceiling: 0.5
  ceiling_basis: seed/contract.yaml binds this slot's judged reduction as a gate at ceiling 0.50. It is
    strictly below 1.0, so the gate binds; it is strictly below the slot's dichotomizing threshold of
    0.60, so a run with a failed behavioural rubric cannot report as correct however good its deterministic
    score was.
  composition: r_final = r_det when every behavioural rubric passes, else min(r_det, ceiling)
  coverage_rule: a verdict collection that does not cover all three ids fails the conjunction; all() over
    an empty collection is True, so a gate that only inspected the verdicts it was handed would pass exactly
    when it had been handed nothing
  missing_verdict_rule: a missing, unavailable or unparseable verdict counts as a FAILURE of the conjunction,
    never as a pass
  pass_threshold: null
  pass_threshold_reason: the council emits averaged fractions and this gate consumes booleans. The fraction
    at which a rubric counts as passed is a measured calibration this slot has not run, so it stays null
    rather than defaulting to 0.5; a default would make the delivered reward depend on a number that appears
    nowhere in the delivered bytes.
reward_map:
  full_reward: 1.0
  shape: 'r_det: zero on any red line and on any knockout failure; otherwise S_outcome = clamp((metric
    - floor) / (knee - floor), 0, 1) through the published ramp.'
  unmeasured: floor and knee are null at Phase 0, so r_det is not computable from these bytes yet and
    the slot is authored but not gradeable.
truth_narrative:
  opening: 'your deliverable is agent/policy.py plus whatever it imports. The grader launches a fresh
    graded run of your scaffold against a private held-out telecom task split, driving a pinned open-weights
    policy checkpoint served on the single H100, with a verifier-owned user simulator you do not control.
    Reach pass^2 >= 0.28 on that private split in the least graded-phase wall-clock, while no episode
    exceeds the per-episode latency SLO. The graded artifact is an object with an ids list and a matching
    outputs list, written to /submission/c7s1.json. The graded quantity is pass^2 on the 114-instance
    private held-out telecom split (a task counts only if both of two independent rollouts satisfy tau2''s
    own reward: final database state equals the expected write set AND every required communication
    item is delivered), gated by a per-episode latency SLO, with graded-phase wall-clock seconds as
    the optimized axis.'
  insight: 'The metric is a square, and that is the whole task. pass^2 credits an instance only when BOTH
    of two independent rollouts satisfy tau2''s reward, so a scaffold that is right four times in five keeps
    only about two thirds of that rate once the pair is taken, and the quantity worth optimising stops being
    accuracy and becomes the probability of being right twice. The pairs that cost the most are the ones
    that disagree -- one rollout satisfied, the other did not -- and those are exactly the instances where
    the scaffold''s behaviour depended on what the verifier-owned user simulator happened to say rather
    than on what the shipped policy document required. Every structural move that pays here pays by removing
    that dependence: a precondition table compiled from the document instead of recalled, schema-constrained
    tool calls instead of parsed ones, arguments rebound from the current turn instead of carried forward,
    a shadow write verified before it lands. Reliability first, then the compute ramp, which is where 0.90
    of the reward lives; and the SLO is a floor under both, because per-episode latency is measured per
    episode and no amount of concurrency will average it away.'
  steps:
  - heading: Read the policy document that ships, not the one you remember
    paragraph: 'The private split re-keys entity identifiers and the shipped telecom policy tightens the
      public one: dispatch requires a logged reboot AND a confirmed signal reading. Everything downstream
      is built from that document rather than from recall, which is what separates this run from CTRL-OBVIOUS-WRONG
      at 0.0429. Realises LRN1.'
  - heading: Compile the policy into a deterministic precondition table
    paragraph: One compile stage reads the document once and emits a table keyed by intent that the executor
      consults before every write. The table is data the graded run can carry; a precondition the agent
      merely obeyed while developing is absent at grade time. Realises HZN2, which requires the run to be
      self-contained from shipped bytes only.
  - heading: Decode tool calls under a schema instead of parsing prose
    paragraph: A JSON-schema-constrained decoder makes the call name and its argument types a structural
      property of decoding rather than a parse that sometimes works. This is where argument binding stops
      drifting silently.
  - heading: Bind every argument from the turn you are on
    paragraph: The first trap is a scaffold that reads the right customer and binds a line id carried over
      from an earlier turn. The write lands on a real but wrong row, nothing raises, and the episode reads
      as a success until the post-episode digest is compared. Re-resolve identifiers per call from the current
      turn's state.
  - heading: Verify each write against a shadow copy before it lands
    paragraph: Replay the intended write set against a local copy of the database and abort any call whose
      diff exceeds the expected footprint. This is the whole defence against collateral rows, and it is
      why CTRL-LIST-ALL, which covers the expected set by brute force, scores 0. Realises GAM1.
  - heading: Grade the pair, never the rollout
    paragraph: pass^2 credits a task only when BOTH of its two independent rollouts satisfy tau2's reward.
      A scaffold that is right four times in five loses roughly a third of its single-rollout rate to the
      square, so the quantity worth optimising is not accuracy but the probability of being right twice.
      Realises OPT2.
  - heading: Make the second rollout an actual second rollout
    paragraph: The user simulator is verifier-owned and its seed is the low 64 bits of SHA-256 over bundle_hash,
      task_id and rollout_index, so the two rollouts of a pair meet different simulator behaviour by construction.
      A scaffold that caches a transcript and replays it for rollout 1 reports a pass^2 that measures nothing,
      and the seed check refuses it.
  - heading: Reduce variance rather than raise the mean
    paragraph: The pairs that cost the most are the ones that disagree, where one rollout satisfied and
      the other did not. Those are the tasks where the scaffold's behaviour depends on what the simulator
      happened to say. Determinism in the executor buys more pass^2 per unit of effort here than any improvement
      in the single-rollout rate.
  - heading: Prefill the policy document once and share the prefix
    paragraph: The compiled policy prefix is identical across all 228 episodes, so prefilling it once and
      reusing the prefix is pure wall-clock with no effect on the graded outputs. This is the largest single
      move on the compute axis. Realises OPT1.
  - heading: Exit an episode as soon as its write set is satisfied
    paragraph: Continuing to converse after the expected write set is complete spends decode tokens on nothing
      and lengthens the episode against the latency SLO.
  - heading: Choose concurrency against the p95, not the aggregate
    paragraph: Raising concurrency shortens the graded phase and lengthens individual episodes. At 96 the
      aggregate reaches 380 s and p95 per-episode latency reaches 141 s, past the 90 s ceiling, and the
      run is zeroed; CTRL-SLO-RUSH measures exactly that. Thirty-two-way concurrency is the setting that
      keeps both sides inside their bounds. Realises OPT3.
  - heading: Leave the served checkpoint at the pin
    paragraph: FP8 or INT4 serving is the obvious way to buy latency and it raises no error surface at all
      while costing 6 to 10 points of pass^2; a digest that differs from the pin is redline:model-substitution
      outright. Realises PRC2.
  - heading: Compound across attempts and check the sibling gap before submitting
    paragraph: Reward history carries between the 50 attempts, and an attempt that does not build on the
      recorded prior ones cannot cross a gate placed above every single-knob gain. Measure on the 60-task
      dev split, then confirm the private and sibling figures agree within 0.10 before spending the graded
      run. Realises HZN1, NOV1 and SCT1.
  traps:
  - 'Argument binding drift: the scaffold reads the right customer but binds a stale line id from an
    earlier turn, so the write lands on a real but wrong row and A-CHK-2 fails while no exception is
    raised.'
  - 'Policy-order violation: the scaffold dispatches a technician before attempting the mandated reboot,
    producing a correct-looking resolution that A-CHK-4 rejects on ordering.'
  - 'Collateral writes: a scaffold that batches speculative writes to raise pass^2 trips A-CHK-3 and
    scores 0.0.'
  - 'SLO collapse under concurrency: raising batch concurrency to cut aggregate wall-clock lengthens
    individual episodes past the 90 s p95 and zeroes the run through A-CHK-7.'
  - 'Quantization silent damage: an FP8/INT4 serving configuration chosen for the SLO silently costs
    6-10 points of pass^2 with no error surface.'
  - 'Public-split overfit: prompt and workflow choices tuned on the 60-task dev split do not transfer
    to the re-keyed private split and open a sibling gap above 0.10.'
  - 'The upstream ships a reference tool-calling agent and the published tau2 prompts are widely mirrored,
    so ''clone the public scaffold'' is the obvious near-optimal route and would be a lookup shortcut.
    Mitigation: The gate G is pinned by Phase 1 measurement at the public reference scaffold''s own
    pass^2 plus 0.08 absolute on the private split with the same pinned checkpoint, so a faithful reproduction
    of the public repository scores exactly 0.0. CTRL-STALE runs that reference agent at the pin as
    a required-failing control.'
  - 'tau2 task definitions, expected action lists and gold outcomes are public, and the pinned checkpoint
    may have memorised them. Mitigation: The private split re-keys entity identifiers and re-instantiates
    over different real records, so a memorised action sequence addresses rows that do not exist in
    the graded database and fails A-CHK-2. Memorisation that does survive is common-mode across every
    scaffold and therefore cancels in the compute ramp, which is where 0.90 of the reward lives.'
  - 'Distilling a frontier API into a bespoke adapter during development and shipping the adapter as
    a pre-baked artifact. Mitigation: The graded run is a fresh execution by the verifier with network
    egress disabled and only shipped bytes plus the pinned checkpoint reachable; any adapter must be
    produced inside the graded run from the shipped dev split and inside the wall-clock budget. A checkpoint
    digest mismatch is redline:model-substitution.'
  - 'A plain hyperparameter sweep (temperature, retries, samples, concurrency, context length) over
    the documented starter flags reaching the gate, which OPT3''s structural bar forbids. Mitigation:
    CTRL-KNOB-SEARCH runs TPE and random search over the full documented flag space for the same attempt
    budget; the control must land below G or the slot is rehardened. The gate is placed so that only
    a structural change (policy compilation into a precondition table, shadow-write verification, prefix
    reuse of the policy document) crosses it.'
truth_annex: "Ordered path through instruction.md, with the compiled checker each step satisfies:\n\n\
  \ 1. `policy_scaffold_is_agent_authored` (weight 5, knockout) -- the grader launches agent/policy.py\
  \ itself, so the scaffold IS the deliverable and an unchanged starter is redline:empty-submission.\n\
  \ 2. `graded_ids_are_the_private_114` (weight 5, knockout) -- the ledger covers the 114-task private\
  \ held-out telecom split, not the 60-task dev or sibling splits.\n 3. `every_task_carries_a_rollout_pair`\
  \ (weight 5, knockout) -- exactly two rollouts per task, indexed 0 and 1, for 228 rollouts in total.\n\
  \ 4. `pair_credit_is_conjunctive` (weight 5, knockout) -- a task is credited only when BOTH rollouts\
  \ satisfied tau2's reward.\n 5. `pair_simulator_seeds_differ` (weight 5, knockout) -- the two rollouts\
  \ of a pair met different verifier-owned simulator behaviour, so the pair measures run-to-run variance\
  \ rather than replaying itself.\n 6. `reported_pass_squared_recomputes` (weight 4) -- the ledger's own\
  \ figure equals the conjunction over its pairs and is not the single-rollout rate wearing its name.\n\
  \ 7. `write_set_hash_matches_on_credited_rollouts` (weight 4) -- every credited rollout's post-episode\
  \ canonical-JSON digest equals the expected write set.\n 8. `no_collateral_row_mutated` (weight 4, knockout)\
  \ -- the full-table diff names no row outside the expected write set, in any of the 228 episodes.\n\
  \ 9. `dispatch_preconditions_ordered` (weight 4) -- the mandated partial order holds in BOTH rollouts\
  \ of every constrained task.\n10. `episode_latency_slo_holds` (weight 4, knockout) -- p95 per-episode\
  \ latency at most 90 s and the worst episode at most 180 s, measured per episode under batching.\n11.\
  \ `graded_phase_wallclock_in_band` (weight 3) -- harness-metered graded-phase wall-clock inside [420,\
  \ 1800] seconds.\n12. `sibling_split_gap_within_tolerance` (weight 4, knockout) -- the private and sibling\
  \ pass^2 figures agree within 0.10 and the private one recomputes from its own ledger.\n13. `self_report_matches_server_accounting`\
  \ (weight 3) -- reward_log.jsonl latency and token counts agree with server-side accounting within 5\
  \ percent.\n14. `served_checkpoint_matches_pin` (weight 4, knockout) -- checkpoint digest at the pin,\
  \ harness bytes unchanged, zero outbound sockets.\n15. `graded_run_touched_no_guarded_path` (weight\
  \ 5, knockout) -- nothing under tests/, the held-out split or the verifier output directory was touched\
  \ during the graded run.\n16. `rollout_budget_declared` (weight 3) -- the agent's own declaration names\
  \ 114 tasks times 2 rollouts equals 228 episodes and its factors agree.\n17. `pass_squared_ramp` (weight\
  \ 10, knockout) -- the outcome check, which calls require_measured FIRST and raises ConstantUnmeasured\
  \ while the ramp constants are null.\n\nThree behavioural rubrics sit outside this list, under council_rubrics,\
  \ and are graded downstream by the trajectory grader after tests/verifier.py has exited: `shipped_policy_document_is_the_authority`,\
  \ `dev_split_measurement_backs_each_kept_change`, `negative_result_recorded_not_routed_around`. They\
  \ are not folded into tests/rubrics.json, whose items are the compiled surface that seed/delivery.py\
  \ measures against compilation_floor.\n\nRejected routes, each bound to the control that measures it\
  \ wrong:\n\n- Clone the upstream tau2-bench reference tool-calling agent at the pinned commit and ship\
  \ it unchanged, the obvious lookup route for a heavily published benchmark. -- controlled by CTRL-STALE\
  \ at 0.0679, with the gate G pinned by Phase 1 measurement at the public reference scaffold's own pass^2\
  \ plus 0.08 absolute on the private split under the same pinned checkpoint, so a faithful reproduction\
  \ of the public repository scores exactly 0.0.\n- Satisfy the verifier-owned user simulator conversationally,\
  \ producing a fluent resolution transcript, without performing the required telecom database writes.\
  \ -- controlled by CTRL-DECOY at 0.0214, because tau2's reward is a conjunction and `pair_credit_is_conjunctive`\
  \ reads the write-set half of it.\n- Perform every plausible write for the task class so the expected\
  \ write set is covered by brute force. -- controlled by CTRL-LIST-ALL at 0, which trips `no_collateral_row_mutated`\
  \ on the full-table diff.\n- Hardcode the public upstream policy document instead of reading the shipped\
  \ one, so the tightened dispatch precondition, a logged reboot AND a confirmed signal reading, is violated.\
  \ -- controlled by CTRL-OBVIOUS-WRONG at 0.0429 through `dispatch_preconditions_ordered`.\n- Reach the\
  \ gate by classical search alone, running TPE and random search over the documented starter flags at\
  \ the same 50-attempt budget. -- controlled by CTRL-KNOB-SEARCH at 0.0893, the declared tuned-starter\
  \ family at t_starter = 1,540 s; the gate is placed so only a structural change crosses it.\n- Buy the\
  \ wall-clock ramp by trading per-episode latency, raising concurrency to 96 to reach C = 380 s. -- controlled\
  \ by CTRL-SLO-RUSH at 0, whose p95 per-episode latency of 141 s trips `episode_latency_slo_holds`.\n\
  - Write optimistic latency and token counts into reward_log.jsonl so the reported compute axis is faster\
  \ than the run actually was. -- controlled by CTRL-SELFREPORT at 0 through `self_report_matches_server_accounting`.\n\
  - Submit the unchanged starter, or an agent/policy.py that returns immediately, and let the environment's\
  \ default scaffold carry the score. -- controlled by CTRL-NOOP at 0 through `policy_scaffold_is_agent_authored`.\n\
  - Memorise the public tau2 task definitions and expected action lists. -- the private split re-keys\
  \ entity identifiers and re-instantiates over different real line, device and customer records, so a\
  \ memorised action sequence addresses rows that do not exist in the graded database and fails `write_set_hash_matches_on_credited_rollouts`.\
  \ Memorisation that does survive is common-mode across every scaffold and cancels in the compute ramp,\
  \ which is where 0.90 of the reward lives.\n- Distil a frontier API into a bespoke adapter during development\
  \ and ship the adapter pre-baked. -- the graded run is a fresh execution by the verifier with egress\
  \ disabled and only shipped bytes plus the pinned checkpoint reachable, and a checkpoint digest mismatch\
  \ is redline:model-substitution.\n\nDeliverable manifest: agent/policy.py plus whatever it imports,\
  \ launched by the grader; the graded run writes its rollout ledger to /submission/c7s1.json (json),\
  \ an object with an ids list and a matching outputs list.\n"

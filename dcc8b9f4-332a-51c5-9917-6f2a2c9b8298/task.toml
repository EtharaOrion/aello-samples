# Harbor delivery unit for C3-S1. GENERATED by seed/build/author_batch.py.
schema_version = "1.4"

artifacts = [
  "/workspace/agent_src",
  "/submission/c3s1.json",
]

[task]
name = "aello/c3s1"
description = "deliver a from-scratch tokenizer construction and encoding pipeline (build_tokenizer.py plus encode.py plus a declared stage manifest) that minimises held-out bits per byte of a frozen, hash-pinned language-model trainer"
authors = [{ name = "AELLO" }]
keywords = ["optimization", "bounded-continuous", "llm"]
version = "1.0.0"

[metadata]
slot_id = "C3-S1"
universal_scoring_version = "engram.universal_scoring/v1"
scoring_engine = "aello_eval"
archetype = "AR6"
category = "3"
scope_half = "LLM"
# Optimization lane item 1 binds three DISTINCT quantities, never aliases:
#   budget_hours - per-attempt completion bound, from client-requirements-v3.md:138.
#   max_timeout  - refinement-loop terminator across attempts, an authored pacing choice.
#   max_attempts - attempt cap, at most one hundred, fifty the default.
max_timeout = 8.0
max_timeout_units = "hours"
budget_hours = 6.0
budget_envelope = "one NVIDIA H100 80GB, single-tenant exclusive, execution class per the seed/host.json probe, identical for the agent sandbox and the separate verifier environment"
# Carried by name only, never a FORGE-authored number.
budget_margin = "conservative_default"
max_attempts = 50
per_attempt_seconds = 1800.0
final_selection = "best"
# graded_axis is DELIBERATELY ABSENT. seed/contract.yaml records it as measured at Phase 1 from
# the control ladder and never authored at Phase 0, and TOML has no null literal, so the key is
# omitted rather than given a placeholder value. seed/admissibility.py's GRADED_AXES admits four
# members and every one of them presupposes a bound this slot has not measured; authoring one to
# make the bundle parse would be inventing the measurement (F71).
compute_envelope = "one H100"
reward_schema = "one float on the closed interval from zero to one, higher is better"
# Which resource this slot's Phase 2 ladder needs, so the wave schedules around one GPU.
measurement_tier = "gpu"
measurement_tier_basis = "trains or runs an LLM backbone"
tags = ["optimization", "bounded-continuous"]

[environment]
build_timeout_sec = 3600.0
cpus = 8
memory_mb = 65536
storage_mb = 131072
gpus = 1
workdir = "/workspace"
network_mode = "allowlist"
allowed_hosts = ["pypi.org", "files.pythonhosted.org", "archive.ubuntu.com",
                 "security.ubuntu.com", "developer.download.nvidia.com"]

[environment.env]
PYTHONUNBUFFERED = "1"
TZ = "UTC"

[agent]
timeout_sec = 28800.0
network_mode = "allowlist"
allowed_hosts = ["downloads.claude.ai", "*.claude.ai", "registry.npmjs.org",
                 "registry.yarnpkg.com", "api.anthropic.com", "pypi.org",
                 "files.pythonhosted.org", "api.openai.com", "chatgpt.com"]

[verifier]
# "none" is not a member of Harbor's NetworkMode enum and fails validation; the token is
# "no-network". Bound explicitly because an absent [verifier].network_mode deep-copies
# [environment] and would hand the verifier the build allowlist.
network_mode = "no-network"
timeout_sec = 1800.0
environment_mode = "separate"

[[verifier.collect]]
command = '''mkdir -p /logs/agent/agent_code /workspace/agent_src && cd /workspace && find . -type f \( -name '*.py' -o -name '*.sh' -o -name '*.md' -o -name '*.json' -o -name '*.yaml' -o -name '*.txt' \) -not -path './environment/data/*' -not -path './agent_src/*' -exec cp --parents {} /logs/agent/agent_code/ \; -exec cp --parents {} /workspace/agent_src/ \; ; true'''
timeout_sec = 60.0

# The [verifier.environment] table is used WHOLESALE -- there is no field-level merge with
# [environment] -- so it must be COMPLETE, not a one-line gpus override, or cpus, memory and
# workdir fall to library defaults. Every value is copied from [environment] except gpus and
# the network fields. Grading is CPU-only for every slot in this batch.
[verifier.environment]
build_timeout_sec = 3600.0
cpus = 8
memory_mb = 65536
storage_mb = 131072
gpus = 0
workdir = "/workspace"
network_mode = "no-network"

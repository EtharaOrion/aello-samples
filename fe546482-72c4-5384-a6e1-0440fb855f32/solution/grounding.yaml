truth_annex: 'Ordered path through instruction.md, with the checker identifier each step satisfies:


  1. `box_supervision_confined_to_the_labelled_fraction` (compiled, weight 5, knockout) -- The run consumed
  boxes for the fixed small fraction of training images that ships them, and for no others.

  2. `trimaps_withheld_and_unread` (compiled, weight 4, knockout) -- The upstream per-pixel trimaps are
  absent from the delivered tree and no read of one is declared.

  3. `pseudo_boxes_gated_and_disjoint_from_labelled` (compiled, weight 4) -- Propagated pseudo-boxes are
  confidence-gated and land only on images that carry no box.

  4. `detections_manifest_lands` (compiled, weight 5, knockout) -- The scored box lists land at the graded
  path and every record is a box and a score.

  5. `no_abstention_every_graded_image_localised` (compiled, weight 5, knockout) -- Every graded image
  carries at least one box; abstaining is not a move this metric offers.

  6. `boxes_in_native_pixel_frame` (compiled, weight 4, knockout) -- Every box is absolute pixels on that
  image''s own native frame, with positive area, inside the image.

  7. `top_scoring_box_is_unambiguous` (compiled, weight 4, knockout) -- Exactly one box per image attains
  the top score, so the graded binary is a property of the model.

  8. `localisation_budget_declared` (compiled, weight 3) -- The agent declares its own labelled-image,
  time and inference-scale budget, and the IoU it optimised for.

  9. `top_box_replay_digest` (compiled, weight 3) -- The seeded replay reproduces the box that decides
  each image, to the pixel.

  10. `private_split_boxes_unread` (compiled, weight 5, knockout) -- No graded image''s box was read during
  the graded run, though its pixels were.

  11. `checker_tree_and_box_indexes_untouched` (compiled, weight 5, knockout) -- The graded run writes
  nothing into the checker tree or onto the shipped box and image indexes.

  12. `correct_localisation_rate_at_iou_half` (compiled, weight 10, knockout) -- The correct-localisation
  rate at IoU 0.5 over the private split clears the published bar through the ramp.


  Rejected routes, each bound to the control that measures it wrong:


  - Threshold the shipped per-pixel trimaps into boxes for the whole training set, which converts a sparse-box
  task into a dense-supervision one -- controlled by: the trimap directory is withheld from the delivered
